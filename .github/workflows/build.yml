              <div class="card-2027 rounded-3xl w-full max-w-sm p-5 space-y-3 text-center">
                <div class="flex justify-between items-center border-b border-purple-800/40 pb-2"><h3 class="font-bold text-sm text-purple-100">Temporizador de Apagado</h3><button onclick="closeModal('timerModal')" class="text-purple-400"><i class="fa-solid fa-xmark"></i></button></div>
                <div class="grid grid-cols-3 gap-2 pt-2">
                  <button onclick="setSleepTimer(10)" class="p-2.5 rounded-2xl glass-pill text-xs font-semibold">10 Min</button>
                  <button onclick="setSleepTimer(20)" class="p-2.5 rounded-2xl glass-pill text-xs font-semibold">20 Min</button>
                  <button onclick="setSleepTimer(45)" class="p-2.5 rounded-2xl glass-pill text-xs font-semibold">45 Min</button>
                </div>
                <button onclick="setSleepTimer(0)" class="w-full p-2.5 rounded-2xl bg-red-950/60 border border-red-700/40 text-xs text-red-300 font-semibold mt-2">Desactivar</button>
              </div>
            </div>

            <div id="cosmosToast" class="fixed top-20 left-1/2 -translate-x-1/2 z-[90] px-4 py-2 rounded-full bg-gradient-to-r from-purple-700 to-fuchsia-600 text-white text-xs font-bold shadow-lg opacity-0 pointer-events-none transition-opacity duration-200">Listo</div>

            <script>
              window.defaultLogoDataUri = "data:image/svg+xml;utf8," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300"><rect width="300" height="300" fill="#06020d"/><circle cx="150" cy="150" r="110" fill="none" stroke="#a855f7" stroke-width="3" opacity="0.5"/><path d="M80 138 A72 72 0 0 1 220 138" fill="none" stroke="#f0abfc" stroke-width="6" stroke-linecap="round"/><polygon points="150,55 88,168 122,168 150,108" fill="#f5d0fe"/><polygon points="150,55 212,168 178,168 150,108" fill="#a855f7"/><polygon points="124,162 150,235 176,162 150,184" fill="#c084fc"/><polygon points="150,122 162,146 150,170 138,146" fill="#ffffff"/></svg>`);
              document.getElementById("headerLogoImg").onerror = function() { this.src = window.defaultLogoDataUri; };

              let tracks = [];
              let customOverrides = JSON.parse(localStorage.getItem("cosmos_overrides_2027")) || {};
              let likedTrackIds = JSON.parse(localStorage.getItem("cosmos_likes_2027")) || [];
              let userPlaylists = JSON.parse(localStorage.getItem("cosmos_playlists_2027")) || [{ id: "pl_default_1", name: "Sesión Nocturna ✨", tracks: [] }];

              let currentTab = "songs", currentTrackIndex = -1, actionSheetTrackIdx = -1, pendingAddTrackIdx = -1, activePlaylistViewId = null;
              let isPlaying = false, isDraggingSeek = false, currentDurationSec = 0, shuffleMode = false, repeatMode = 0;
              let activePresetName = "Space Rock", sleepTimerId = null;

              const eqPresets = {
                "Space Rock": [5, 2, 0, 4, 6], "Gothic Rock": [6, 4, -1, 3, 5], "Love Metal": [6, 3, -1, 5, 6], "Symphonic": [5, 2, 1, 5, 7],
                "Metal": [7, 3, -3, 5, 7], "Rock": [5, 3, -1, 4, 5], "Pop": [2, 3, 4, 3, 3], "Acoustic": [3, 2, 1, 4, 5],
                "Bass Boost": [9, 6, 0, 1, 2], "Vocal": [-2, 1, 6, 5, 2], "Synthwave": [7, 4, -1, 3, 6], "Salsa": [4, 3, 3, 4, 5],
                "Cumbia": [7, 5, 1, 3, 4], "Jazz": [4, 2, -1, 3, 4], "Classical": [3, 1, 0, 3, 5], "Plano": [0, 0, 0, 0, 0]
              };

              function showToast(msg) {
                const t = document.getElementById("cosmosToast");
                t.textContent = msg; t.style.opacity = "1";
                setTimeout(() => { t.style.opacity = "0"; }, 2000);
              }

              function updateBentoCounters() {
                document.getElementById("bentoLikesCount").textContent = `${likedTrackIds.length} pistas`;
                document.getElementById("bentoPlaylistsCount").textContent = `${userPlaylists.length} listas`;
              }

              function renderEqButtons() {
                const container = document.getElementById("eqPresetContainer");
                container.innerHTML = "";
                Object.keys(eqPresets).forEach(name => {
                  const btn = document.createElement("button");
                  btn.className = name === activePresetName
                    ? "px-2 py-1.5 rounded-xl text-[10px] font-bold bg-gradient-to-r from-purple-600 to-fuchsia-600 text-white border border-fuchsia-300 truncate"
                    : "px-2 py-1.5 rounded-xl text-[10px] glass-pill text-purple-300 truncate";
                  btn.textContent = name;
                  btn.onclick = () => applyEqPreset(name);
                  container.appendChild(btn);
                });
              }

              window.onNativeLibraryLoaded = function(jsonArray) {
                try {
                  const list = typeof jsonArray === "string" ? JSON.parse(jsonArray) : jsonArray;
                  tracks = list.map((item, idx) => {
                    const saved = customOverrides[item.id] || {};
                    if (saved.title && window.CosmosNative) window.CosmosNative.updateTrackMetadata(idx, saved.title, saved.artist || item.artist, saved.album || item.album);
                    return {
                      id: item.id, mediaId: item.mediaId || 0,
                      title: saved.title || item.title, artist: saved.artist || item.artist, album: saved.album || item.album,
                      albumId: item.albumId !== undefined ? item.albumId : -1, durationMs: item.durationMs || 0,
                      thumb: saved.cover || item.thumb || item.cover || "ic_launcher.png",
                      cover: saved.cover || item.cover || "ic_launcher.png"
                    };
                  });
                  updateBentoCounters();
                  renderLibrary();
                } catch(e) {}
              };

              window.onNativeTrackState = function(idx, playing, posMs, durMs) {
                if (idx < 0 || idx >= tracks.length) return;
                const prevIdx = currentTrackIndex;
                currentTrackIndex = idx; isPlaying = playing;
                const t = tracks[idx];
                setImageWithFallback(document.getElementById("miniCover"), t.thumb);
                setImageWithFallback(document.getElementById("fullCover"), t.cover);
                document.getElementById("miniTitle").textContent = t.title;
                document.getElementById("miniArtist").textContent = t.artist;
                document.getElementById("fullTitle").textContent = t.title;
                document.getElementById("fullArtist").textContent = t.artist;
                document.getElementById("fullAlbumName").textContent = t.album;
                updatePlayButtons(playing);
                updateLikeButtonsUI();
                highlightActiveRow(prevIdx, idx);
                currentDurationSec = (durMs || t.durationMs || 0) / 1000;
                if (!isDraggingSeek) updateTimeUI((posMs || 0) / 1000, currentDurationSec);
              };

              window.onNativeProgress = function(posMs, durMs, playing) {
                isPlaying = playing;
                updatePlayButtons(playing);
                currentDurationSec = (durMs || 0) / 1000;
                if (!isDraggingSeek) updateTimeUI((posMs || 0) / 1000, currentDurationSec);
              };

              function rescanPhoneLibrary() { if(window.CosmosNative) window.CosmosNative.rescanMediaStore(); }
              function isTrackLiked(trackId) { return likedTrackIds.includes(trackId); }

              function toggleLikeByIdx(idx, ev) {
                if (ev) ev.stopPropagation();
                const t = tracks[idx]; if (!t) return;
                const pos = likedTrackIds.indexOf(t.id);
                const nowLiked = pos === -1;
                if (pos >= 0) { likedTrackIds.splice(pos, 1); showToast("Quitado de Tus Me Gusta"); }
                else { likedTrackIds.push(t.id); showToast("❤️ Añadido a Tus Me Gusta"); }
                localStorage.setItem("cosmos_likes_2027", JSON.stringify(likedTrackIds));
                updateLikeButtonsUI(); updateBentoCounters();
                const rowHeartBtn = document.getElementById(`row-like-btn-${idx}`);
                if (rowHeartBtn) {
                  rowHeartBtn.className = `w-8 h-8 rounded-full flex items-center justify-center ${nowLiked ? 'text-pink-500' : 'text-purple-300/50'}`;
                  rowHeartBtn.innerHTML = `<i class="${nowLiked ? 'fa-solid' : 'fa-regular'} fa-heart text-xs"></i>`;
                }
                if (currentTab === "favorites") renderLibrary();
              }

              function toggleLikeCurrent() { if (currentTrackIndex >= 0) toggleLikeByIdx(currentTrackIndex); }

              function updateLikeButtonsUI() {
                if (currentTrackIndex < 0 || !tracks[currentTrackIndex]) return;
                const liked = isTrackLiked(tracks[currentTrackIndex].id);
                const html = liked ? '<i class="fa-solid fa-heart text-pink-500"></i>' : '<i class="fa-regular fa-heart"></i>';
                document.getElementById("miniLikeBtn").innerHTML = html;
                document.getElementById("fullLikeBtn").innerHTML = html;
              }

              function openActionSheet(idx) {
                if (idx < 0 || !tracks[idx]) return;
                actionSheetTrackIdx = idx;
                const t = tracks[idx];
                if (navigator.vibrate) navigator.vibrate(20);
                setImageWithFallback(document.getElementById("sheetTrackCover"), t.thumb);
                document.getElementById("sheetTrackTitle").textContent = t.title;
                document.getElementById("sheetTrackArtist").textContent = `${t.artist} • ${t.album}`;
                const liked = isTrackLiked(t.id);
                document.getElementById("sheetLikeIcon").className = liked ? "fa-solid fa-heart text-pink-500 text-base w-5 text-center" : "fa-regular fa-heart text-pink-400 text-base w-5 text-center";
                document.getElementById("sheetLikeText").textContent = liked ? "Quitar de Tus Me Gusta" : "Añadir a Tus Me Gusta ❤️";
                openModal("actionSheetModal");
              }

              function sheetToggleLike() { toggleLikeByIdx(actionSheetTrackIdx); closeModal("actionSheetModal"); }
              function sheetAddToPlaylist() { closeModal("actionSheetModal"); openAddToPlaylistModal(actionSheetTrackIdx); }
              function sheetShareTrack() { closeModal("actionSheetModal"); shareTrack(actionSheetTrackIdx); }
              function sheetEditTrack() { closeModal("actionSheetModal"); currentTrackIndex = actionSheetTrackIdx; openEditModal(); }

              function shareTrack(idx) {
                const t = tracks[idx]; if (!t) return;
                if (window.CosmosNative) window.CosmosNative.shareTrackNative(t.mediaId || 0, t.title, t.artist, t.album);
              }

              function openCreatePlaylistModal(fromSelector = false) {
                if (!fromSelector) pendingAddTrackIdx = -1;
                document.getElementById("newPlaylistNameInput").value = "";
                openModal("createPlaylistModal");
              }

              function confirmCreatePlaylist() {
                const name = document.getElementById("newPlaylistNameInput").value.trim();
                if (!name) return;
                const newPl = { id: "pl_" + Date.now(), name: name, tracks: [] };
                if (pendingAddTrackIdx >= 0 && tracks[pendingAddTrackIdx]) {
                  newPl.tracks.push(tracks[pendingAddTrackIdx].id);
                  showToast(`✨ Creada y añadida a "${name}"`);
                } else showToast(`✨ Playlist "${name}" creada`);
                userPlaylists.push(newPl);
                localStorage.setItem("cosmos_playlists_2027", JSON.stringify(userPlaylists));
                pendingAddTrackIdx = -1;
                updateBentoCounters();
                closeModal("createPlaylistModal");
                if (currentTab === "playlists") renderLibrary();
              }

              function openAddToPlaylistModal(idx) {
                if (idx < 0 || !tracks[idx]) return;
                pendingAddTrackIdx = idx;
                const listEl = document.getElementById("playlistSelectorList");
                listEl.innerHTML = "";
                const trackId = tracks[idx].id;
                userPlaylists.forEach(pl => {
                  const alreadyIn = pl.tracks.includes(trackId);
                  const btn = document.createElement("button");
                  btn.className = "w-full p-3 rounded-2xl glass-pill flex items-center justify-between text-left";
                  btn.innerHTML = `<div class="flex items-center gap-3 min-w-0"><div class="w-9 h-9 rounded-xl bg-purple-900/80 border border-fuchsia-400/30 flex items-center justify-center text-fuchsia-300 shrink-0"><i class="fa-solid fa-music text-xs"></i></div><div class="min-w-0"><div class="text-xs font-bold text-white truncate">${pl.name}</div><div class="text-[10px] text-purple-300/70">${pl.tracks.length} canciones</div></div></div><span class="text-xs font-bold ${alreadyIn ? 'text-fuchsia-400' : 'text-purple-300'}">${alreadyIn ? '✓ Añadida' : '+ Añadir'}</span>`;
                  btn.onclick = () => {
                    if (!alreadyIn) {
                      pl.tracks.push(trackId);
                      localStorage.setItem("cosmos_playlists_2027", JSON.stringify(userPlaylists));
                      showToast(`🎵 Añadida a "${pl.name}"`);
                    } else showToast(`Ya estaba en "${pl.name}"`);
                    closeModal("addToPlaylistModal");
                    if (currentTab === "playlists") renderLibrary();
                  };
                  listEl.appendChild(btn);
                });
                openModal("addToPlaylistModal");
              }

              function deletePlaylist(plId, ev) {
                if (ev) ev.stopPropagation();
                userPlaylists = userPlaylists.filter(p => p.id !== plId);
                localStorage.setItem("cosmos_playlists_2027", JSON.stringify(userPlaylists));
                updateBentoCounters(); renderLibrary(); showToast("Playlist eliminada");
              }

              function removeTrackFromPlaylist(plId, trackId, ev) {
                if (ev) ev.stopPropagation();
                const pl = userPlaylists.find(p => p.id === plId); if (!pl) return;
                pl.tracks = pl.tracks.filter(id => id !== trackId);
                localStorage.setItem("cosmos_playlists_2027", JSON.stringify(userPlaylists));
                renderLibrary(); showToast("Quitada de la playlist");
              }

              function playRandomMix() {
                if (!tracks.length) return;
                shuffleMode = true;
                document.getElementById("shuffleBtn").className = "w-9 h-9 rounded-full flex items-center justify-center text-fuchsia-400";
                if (window.CosmosNative) window.CosmosNative.setShuffleAndRepeat(shuffleMode, repeatMode);
                loadTrack(Math.floor(Math.random() * tracks.length), true);
                showToast("🔀 Mix Cosmos Activado");
              }

              function applyEqPreset(name) {
                const gains = eqPresets[name]; if (!gains) return;
                activePresetName = name;
                document.getElementById("fullGenreBadge").textContent = `EQ: ${name}`;
                gains.forEach((val, idx) => {
                  const slider = document.getElementById(`eq-${idx}`);
                  if (slider) slider.value = val;
                  const valLabel = document.getElementById(`eq-val-${idx}`);
                  if (valLabel) valLabel.textContent = (val > 0 ? "+" : "") + val + "dB";
                });
                if (window.CosmosNative) window.CosmosNative.setEqPresetGains(gains[0], gains[1], gains[2], gains[3], gains[4]);
                renderEqButtons();
              }

              function updateEqBand(index, val) {
                const dbVal = parseInt(val, 10) || 0;
                const valLabel = document.getElementById(`eq-val-${index}`);
                if (valLabel) valLabel.textContent = (dbVal > 0 ? "+" : "") + dbVal + "dB";
                if (window.CosmosNative) window.CosmosNative.setEqBand(index, dbVal);
              }

              function setImageWithFallback(imgEl, srcUrl) {
                imgEl.onerror = function() {
                  this.onerror = function() { this.src = window.defaultLogoDataUri; };
                  this.src = "ic_launcher.png";
                };
                imgEl.src = srcUrl || "ic_launcher.png";
              }

              function highlightActiveRow(prevIdx, newIdx) {
                if (prevIdx >= 0) {
                  const oldRow = document.getElementById(`song-row-${prevIdx}`);
                  const oldTitle = document.getElementById(`song-title-${prevIdx}`);
                  if (oldRow) oldRow.classList.remove("song-row-active");
                  if (oldTitle) { oldTitle.classList.remove("text-fuchsia-300"); oldTitle.classList.add("text-white"); }
                }
                if (newIdx >= 0) {
                  const newRow = document.getElementById(`song-row-${newIdx}`);
                  const newTitle = document.getElementById(`song-title-${newIdx}`);
                  if (newRow) newRow.classList.add("song-row-active");
                  if (newTitle) { newTitle.classList.remove("text-white"); newTitle.classList.add("text-fuchsia-300"); }
                }
              }

              function loadTrack(idx, autoPlay = false) { if (window.CosmosNative) window.CosmosNative.loadTrack(idx, autoPlay); }
              function togglePlay() { if (!tracks.length) { rescanPhoneLibrary(); return; } if (window.CosmosNative) window.CosmosNative.togglePlay(); }
              function playAudio() { if (window.CosmosNative) window.CosmosNative.playAudio(); }
              function pauseAudio() { if (window.CosmosNative) window.CosmosNative.pauseAudio(); }
              function prevTrack() { if (window.CosmosNative) window.CosmosNative.prevTrack(); }
              function nextTrack() { if (window.CosmosNative) window.CosmosNative.nextTrack(); }
              function seekDelta(deltaMs) { if (window.CosmosNative) window.CosmosNative.seekByDeltaMs(deltaMs); }

              function onSeekDrag(val) {
                isDraggingSeek = true;
                const pct = parseFloat(val) || 0;
                document.getElementById("miniSeek").value = pct;
                document.getElementById("fullSeek").value = pct;
                const previewSec = (pct / 100) * currentDurationSec;
                const fmt = s => `${Math.floor(s/60)}:${Math.floor(s%60)<10?'0':''}${Math.floor(s%60)}`;
                document.getElementById("miniCurrentTime").textContent = fmt(previewSec);
                document.getElementById("fullCurrentTime").textContent = fmt(previewSec);
              }

              function onSeekCommit(val) {
                const pct = parseFloat(val) || 0;
                if (window.CosmosNative) window.CosmosNative.seekToPercent(pct);
                setTimeout(() => { isDraggingSeek = false; }, 150);
              }

              function updatePlayButtons(p) {
                const icon = p ? '<i class="fa-solid fa-pause"></i>' : '<i class="fa-solid fa-play"></i>';
                document.getElementById("miniPlayBtn").innerHTML = icon;
                document.getElementById("fullPlayBtn").innerHTML = icon;
              }

              function toggleShuffle() {
                shuffleMode = !shuffleMode;
                document.getElementById("shuffleBtn").className = shuffleMode ? "w-9 h-9 rounded-full flex items-center justify-center text-fuchsia-400" : "w-9 h-9 rounded-full flex items-center justify-center text-purple-400/50";
                if (window.CosmosNative) window.CosmosNative.setShuffleAndRepeat(shuffleMode, repeatMode);
              }

              function cycleRepeat() {
                repeatMode = (repeatMode + 1) % 3;
                document.getElementById("repeatBtn").className = repeatMode > 0 ? "w-9 h-9 rounded-full flex items-center justify-center text-fuchsia-400 relative" : "w-9 h-9 rounded-full flex items-center justify-center text-purple-400/50 relative";
                document.getElementById("repeatOneBadge").classList.toggle("hidden", repeatMode !== 2);
                if (window.CosmosNative) window.CosmosNative.setShuffleAndRepeat(shuffleMode, repeatMode);
              }

              function updateTimeUI(cur, tot) {
                const fmt = s => `${Math.floor(s/60)}:${Math.floor(s%60)<10?'0':''}${Math.floor(s%60)}`;
                const pct = tot > 0 ? (cur / tot) * 100 : 0;
                document.getElementById("miniSeek").value = pct;
                document.getElementById("fullSeek").value = pct;
                document.getElementById("miniCurrentTime").textContent = fmt(cur);
                document.getElementById("fullCurrentTime").textContent = fmt(cur);
                document.getElementById("miniDuration").textContent = fmt(tot);
                document.getElementById("fullDuration").textContent = fmt(tot);
              }

              function setSleepTimer(mins) {
                if (sleepTimerId) { clearTimeout(sleepTimerId); sleepTimerId = null; }
                const label = document.getElementById("timerText");
                if (mins > 0) {
                  label.textContent = `${mins}m`;
                  sleepTimerId = setTimeout(() => { pauseAudio(); label.textContent = "Off"; }, mins * 60000);
                } else label.textContent = "Off";
                closeModal("timerModal");
              }

              function switchTab(tab) {
                currentTab = tab; activePlaylistViewId = null;
                ["songs", "favorites", "playlists", "artists", "albums"].forEach(t => {
                  const btn = document.getElementById(`tab-${t}`); if (!btn) return;
                  btn.className = t === tab
                    ? "px-4 py-1.5 rounded-full text-xs font-bold bg-gradient-to-r from-purple-600 to-fuchsia-600 text-white shadow-md whitespace-nowrap flex items-center gap-1"
                    : "px-4 py-1.5 rounded-full text-xs font-semibold glass-pill text-purple-200/85 whitespace-nowrap flex items-center gap-1";
                });
                renderLibrary();
              }

              function syncQueueWithNative(trackArray) {
                if (!window.CosmosNative || !trackArray || !trackArray.length) return;
                window.CosmosNative.setActiveQueue(JSON.stringify(trackArray.map(t => tracks.indexOf(t)).filter(i => i >= 0)));
              }

              function createSongRowElement(track, idx, currentListContext = null, extraRightHtml = "") {
                const isCur = idx === currentTrackIndex;
                const liked = isTrackLiked(track.id);
                const div = document.createElement("div");
                div.id = `song-row-${idx}`;
                div.className = `p-2.5 rounded-2xl flex items-center justify-between gap-3 cursor-pointer song-row-fast ${isCur ? "song-row-active" : ""}`;
                let pressTimer = null, longPressTriggered = false;
                div.addEventListener("touchstart", () => { longPressTriggered = false; pressTimer = setTimeout(() => { longPressTriggered = true; openActionSheet(idx); }, 460); }, { passive: true });
                div.addEventListener("touchend", () => { if (pressTimer) clearTimeout(pressTimer); });
                div.addEventListener("touchmove", () => { if (pressTimer) clearTimeout(pressTimer); });
                div.oncontextmenu = (e) => { e.preventDefault(); openActionSheet(idx); return false; };

                const mainArea = document.createElement("div");
                mainArea.className = "flex items-center gap-3 min-w-0 flex-1";
                mainArea.onclick = () => { if (!longPressTriggered) { if (currentListContext) syncQueueWithNative(currentListContext); loadTrack(idx, true); } };
                mainArea.innerHTML = `<img src="${track.thumb}" loading="lazy" decoding="async" onerror="this.onerror=null;this.src='ic_launcher.png';" class="w-12 h-12 cover-row object-cover shrink-0 bg-purple-950" /><div class="min-w-0 flex-1"><h4 id="song-title-${idx}" class="text-sm font-bold ${isCur ? "text-fuchsia-300" : "text-white"} truncate">${track.title}</h4><p class="text-xs text-purple-300/70 truncate">${track.artist} • ${track.album}</p></div>`;

                const actionsArea = document.createElement("div");
                actionsArea.className = "flex items-center gap-1 shrink-0";
                actionsArea.innerHTML = `${extraRightHtml}<button id="row-like-btn-${idx}" onclick="toggleLikeByIdx(${idx}, event)" class="w-8 h-8 rounded-full flex items-center justify-center ${liked ? 'text-pink-500' : 'text-purple-300/50'}"><i class="${liked ? 'fa-solid' : 'fa-regular'} fa-heart text-xs"></i></button><button onclick="event.stopPropagation(); openActionSheet(${idx});" class="w-8 h-8 rounded-full flex items-center justify-center text-purple-300/75"><i class="fa-solid fa-ellipsis-vertical text-xs"></i></button>`;
                div.appendChild(mainArea); div.appendChild(actionsArea);
                return div;
              }

              function renderLibrary(filterField = null, filterValue = null) {
                const container = document.getElementById("libraryContainer");
                const query = document.getElementById("searchInput").value.toLowerCase();
                document.getElementById("countSongs").textContent = tracks.length;
                container.innerHTML = "";
                if (tracks.length === 0) {
                  container.innerHTML = `<div class="card-2027 rounded-3xl p-8 text-center my-6"><h3 class="text-sm font-bold text-white mb-1">Escaneando tu Música...</h3><button onclick="rescanPhoneLibrary()" class="mt-3 px-6 py-2.5 rounded-full bg-gradient-to-r from-purple-600 to-fuchsia-600 text-white text-xs font-bold shadow-lg">Escanear Memoria</button></div>`;
                  return;
                }
                const frag = document.createDocumentFragment();
                let filtered = tracks.filter(t => t.title.toLowerCase().includes(query) || t.artist.toLowerCase().includes(query) || t.album.toLowerCase().includes(query));
                if (filterField && filterValue) {
                  filtered = filtered.filter(t => t[filterField] === filterValue);
                  const back = document.createElement("button");
                  back.className = "mb-2 px-3.5 py-1.5 rounded-full glass-pill text-xs text-fuchsia-300 font-bold flex items-center gap-1.5";
                  back.innerHTML = `<i class="fa-solid fa-arrow-left"></i> Volver`;
                  back.onclick = () => renderLibrary();
                  frag.appendChild(back);
                }
                if (currentTab === "songs" || filterField) {
                  filtered.forEach(track => frag.appendChild(createSongRowElement(track, tracks.indexOf(track), filtered)));
                } else if (currentTab === "favorites") {
                  const favTracks = filtered.filter(t => isTrackLiked(t.id));
                  if (!favTracks.length) {
                    container.innerHTML = `<div class="card-2027 rounded-3xl p-8 text-center text-xs text-purple-300/80"><i class="fa-regular fa-heart text-2xl text-pink-400 mb-2 block"></i>Aún no tienes canciones en Tus Me Gusta.</div>`;
                    return;
                  }
                  favTracks.forEach(track => frag.appendChild(createSongRowElement(track, tracks.indexOf(track), favTracks)));
                } else if (currentTab === "playlists") {
                  if (activePlaylistViewId) {
                    const pl = userPlaylists.find(p => p.id === activePlaylistViewId);
                    if (!pl) { activePlaylistViewId = null; renderLibrary(); return; }
                    const topBar = document.createElement("div");
                    topBar.className = "flex items-center justify-between mb-3";
                    topBar.innerHTML = `<button onclick="activePlaylistViewId=null; renderLibrary();" class="px-3.5 py-1.5 rounded-full glass-pill text-xs text-fuchsia-300 font-bold flex items-center gap-1.5"><i class="fa-solid fa-arrow-left"></i> Playlists</button><h3 class="text-sm font-extrabold text-white truncate">${pl.name}</h3>`;
                    frag.appendChild(topBar);
                    const plTracks = pl.tracks.map(id => tracks.find(t => t.id === id)).filter(Boolean);
                    if (!plTracks.length) {
                      const empty = document.createElement("div");
                      empty.className = "card-2027 rounded-3xl p-6 text-center text-xs text-purple-300/80";
                      empty.innerHTML = "Esta playlist está vacía.";
                      frag.appendChild(empty);
                    } else {
                      plTracks.forEach(track => {
                        const rmBtn = `<button onclick="removeTrackFromPlaylist('${pl.id}', '${track.id}', event)" class="w-8 h-8 rounded-full flex items-center justify-center text-red-400/80"><i class="fa-solid fa-xmark text-xs"></i></button>`;
                        frag.appendChild(createSongRowElement(track, tracks.indexOf(track), plTracks, rmBtn));
                      });
                    }
                    container.appendChild(frag); return;
                  }
                  const headerBtn = document.createElement("button");
                  headerBtn.className = "w-full p-3.5 mb-2 rounded-2xl bg-gradient-to-r from-purple-700 to-fuchsia-600 text-white text-xs font-bold flex items-center justify-center gap-2 shadow-md";
                  headerBtn.innerHTML = `<i class="fa-solid fa-plus"></i> Crear Nueva Playlist Personalizada`;
                  headerBtn.onclick = () => openCreatePlaylistModal(false);
                  frag.appendChild(headerBtn);
                  userPlaylists.forEach(pl => {
                    const firstTrack = pl.tracks.map(id => tracks.find(t => t.id === id)).find(Boolean);
                    const card = document.createElement("div");
                    card.className = "card-2027 p-3 rounded-2xl flex items-center justify-between cursor-pointer";
                    card.onclick = () => { activePlaylistViewId = pl.id; renderLibrary(); };
                    card.innerHTML = `<div class="flex items-center gap-3.5 min-w-0"><img src="${firstTrack ? firstTrack.thumb : 'ic_launcher.png'}" onerror="this.onerror=null;this.src='ic_launcher.png';" class="w-[52px] h-[52px] cover-row object-cover shrink-0" /><div class="min-w-0"><h4 class="text-sm font-bold text-white truncate">${pl.name}</h4><p class="text-xs text-fuchsia-300/75">${pl.tracks.length} canciones</p></div></div><div class="flex items-center gap-2"><button onclick="deletePlaylist('${pl.id}', event)" class="w-8 h-8 rounded-full flex items-center justify-center text-purple-400/60"><i class="fa-regular fa-trash-can text-xs"></i></button><i class="fa-solid fa-chevron-right text-purple-400 text-xs pr-1"></i></div>`;
                    frag.appendChild(card);
                  });
                } else if (currentTab === "artists") {
                  [...new Set(filtered.map(t => t.artist))].forEach(artist => {
                    const artistTracks = tracks.filter(t => t.artist === artist);
                    const div = document.createElement("div");
                    div.className = "card-2027 p-3 rounded-2xl flex items-center justify-between cursor-pointer";
                    div.onclick = () => renderLibrary("artist", artist);
                    div.innerHTML = `<div class="flex items-center gap-3.5"><img src="${artistTracks[0]?.thumb}" onerror="this.onerror=null;this.src='ic_launcher.png';" class="w-12 h-12 rounded-full object-cover border border-fuchsia-400/40" /><div><h4 class="text-sm font-bold text-white">${artist}</h4><p class="text-xs text-purple-300/70">${artistTracks.length} pistas</p></div></div><i class="fa-solid fa-chevron-right text-purple-400 text-xs pr-2"></i>`;
                    frag.appendChild(div);
                  });
                } else if (currentTab === "albums") {
                  const grid = document.createElement("div"); grid.className = "grid grid-cols-2 gap-3";
                  [...new Set(filtered.map(t => t.album))].forEach(album => {
                    const sample = tracks.find(t => t.album === album);
                    const card = document.createElement("div");
                    card.className = "card-2027 p-3 rounded-3xl cursor-pointer";
                    card.onclick = () => renderLibrary("album", album);
                    card.innerHTML = `<img src="${sample.thumb}" onerror="this.onerror=null;this.src='ic_launcher.png';" class="w-full aspect-square cover-2027 object-cover mb-2.5" /><h4 class="text-xs font-bold text-white truncate px-1">${album}</h4><p class="text-[11px] text-purple-300/75 truncate px-1">${sample.artist}</p>`;
                    grid.appendChild(card);
                  });
                  frag.appendChild(grid);
                }
                container.appendChild(frag);
              }

              function openEditModal() {
                const t = tracks[currentTrackIndex]; if(!t) return;
                document.getElementById("editTitle").value = t.title;
                document.getElementById("editArtist").value = t.artist;
                document.getElementById("editAlbum").value = t.album;
                openModal("editModal");
              }

              function saveTrackEdits() {
                const t = tracks[currentTrackIndex]; if(!t) return;
                t.title = document.getElementById("editTitle").value;
                t.artist = document.getElementById("editArtist").value;
                t.album = document.getElementById("editAlbum").value;
                const coverFile = document.getElementById("editCoverFile").files[0];
                const save = () => {
                  customOverrides[t.id] = { title: t.title, artist: t.artist, album: t.album, cover: t.cover };
                  localStorage.setItem("cosmos_overrides_2027", JSON.stringify(customOverrides));
                  if (window.CosmosNative) window.CosmosNative.updateTrackMetadata(currentTrackIndex, t.title, t.artist, t.album);
                  document.getElementById("miniTitle").textContent = t.title; document.getElementById("miniArtist").textContent = t.artist;
                  document.getElementById("fullTitle").textContent = t.title; document.getElementById("fullArtist").textContent = t.artist;
                  document.getElementById("fullAlbumName").textContent = t.album;
                  setImageWithFallback(document.getElementById("miniCover"), t.thumb);
                  setImageWithFallback(document.getElementById("fullCover"), t.cover);
                  renderLibrary(); showToast("✨ Información actualizada");
                };
                if (coverFile) {
                  const reader = new FileReader();
                  reader.onload = e => { t.cover = e.target.result; t.thumb = e.target.result; save(); };
                  reader.readAsDataURL(coverFile);
                } else save();
                closeModal("editModal");
              }

              function openModal(id) { document.getElementById(id).classList.remove("hidden"); document.getElementById(id).classList.add("flex"); }
              function closeModal(id) { document.getElementById(id).classList.add("hidden"); document.getElementById(id).classList.remove("flex"); }

              window.addEventListener("DOMContentLoaded", () => {
                renderEqButtons(); updateBentoCounters(); rescanPhoneLibrary();
                const splash = document.getElementById("welcomeSplash");
                const bar = document.getElementById("splashBar");
                setTimeout(() => { if(bar) bar.style.width = "100%"; }, 80);
                setTimeout(() => { if(splash) { splash.style.opacity = "0"; setTimeout(() => splash.remove(), 500); } }, 1500);
              });
            </script>
          </body>
          </html>
          EOF

          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK Generado
        uses: actions/upload-artifact@v4
        with:
          name: COSMOS-Belmont-Edition-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
# === FIN DEL ARCHIVO VERIFICADO ===
