name: Compilar COSMOS APK Nativo

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Codigo Base
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Android SDK Unificado
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          rm tools.zip
          
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Ensamblar Motor Nativo y UI Maestra de COSMOS
        run: |
          mkdir -p app/src/main/java/com/belmont/cosmos
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-xxhdpi

          # Copiar tus imagenes reales tanto a recursos nativos como a assets del WebView
          if [ -f "ic_launcher.png" ]; then
            cp ic_launcher.png app/src/main/res/drawable/ic_launcher.png
            cp ic_launcher.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp ic_launcher.png app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
            cp ic_launcher.png app/src/main/assets/ic_launcher.png
          elif [ -f "app/src/main/res/drawable/ic_launcher.png" ]; then
            cp app/src/main/res/drawable/ic_launcher.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp app/src/main/res/drawable/ic_launcher.png app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
            cp app/src/main/res/drawable/ic_launcher.png app/src/main/assets/ic_launcher.png
          fi

          if [ -f "splash_bg.png" ]; then
            cp splash_bg.png app/src/main/res/drawable/splash_bg.png
            cp splash_bg.png app/src/main/assets/splash_bg.png
          elif [ -f "app/src/main/res/drawable/splash_bg.png" ]; then
            cp app/src/main/res/drawable/splash_bg.png app/src/main/assets/splash_bg.png
          fi

          # ICONOS VECTORIALES MODERNOS ESTILO SPOTIFY PARA LA NOTIFICACION
          cat << 'EOF' > app/src/main/res/drawable/ic_cosmos_notif.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="100"
              android:viewportHeight="100">
              <path android:fillColor="#FFFFFF" android:pathData="M50,8 L16,62 L34,62 L50,32 L66,62 L84,62 Z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M36,58 L50,92 L64,58 L50,68 Z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M50,39 L56,50 L50,61 L44,50 Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_action_prev.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="28dp"
              android:height="28dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M6,6c0.55,0 1,0.45 1,1v10c0,0.55 -0.45,1 -1,1s-1,-0.45 -1,-1V7C5,6.45 5.45,6 6,6zM9.5,12l8.5,6V6L9.5,12z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_action_play.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="32dp"
              android:height="32dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M8,6.82v10.36c0,0.79 0.87,1.27 1.54,0.84l8.14,-5.18c0.62,-0.39 0.62,-1.29 0,-1.69L9.54,5.98C8.87,5.55 8,6.03 8,6.82z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_action_pause.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="32dp"
              android:height="32dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M8,19c1.1,0 2,-0.9 2,-2V7c0,-1.1 -0.9,-2 -2,-2S6,5.9 6,7v10C6,18.1 6.9,19 8,19zM16,5c-1.1,0 -2,0.9 -2,2v10c0,1.1 0.9,2 2,2s2,-0.9 2,-2V7C18,5.9 17.1,5 16,5z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_action_next.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="28dp"
              android:height="28dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M18,6c-0.55,0 -1,0.45 -1,1v10c0,0.55 0.45,1 1,1s1,-0.45 1,-1V7C19,6.45 18.55,6 18,6zM14.5,12L6,6v12L14.5,12z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.CosmosSplash" parent="android:Theme.DeviceDefault.NoActionBar">
                  <item name="android:windowBackground">#040109</item>
                  <item name="android:statusBarColor">#040109</item>
                  <item name="android:navigationBarColor">#040109</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "COSMOS"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.belmont.cosmos'
              compileSdk 34
              defaultConfig {
                  applicationId "com.belmont.cosmos"
                  minSdk 26
                  targetSdk 34
                  versionCode 2
                  versionName "2.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.activity:activity-ktx:1.8.2'
              implementation 'androidx.media:media:1.7.0'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <application
                  android:label="COSMOS"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:theme="@style/Theme.CosmosSplash"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # KOTLIN MAINACTIVITY CON STREAMING RANGE 206 SIN LAG Y NOTIFICACION SPOTIFY/SUNO
          cat << 'EOF' > app/src/main/java/com/belmont/cosmos/MainActivity.kt
          package com.belmont.cosmos

          import android.Manifest
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.ContentUris
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.pm.PackageManager
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.LinearGradient
          import android.graphics.Paint
          import android.graphics.Shader
          import android.graphics.drawable.Icon
          import android.media.MediaMetadata
          import android.media.session.MediaSession
          import android.media.session.PlaybackState
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.MediaStore
          import android.view.View
          import android.webkit.JavascriptInterface
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceRequest
          import android.webkit.WebResourceResponse
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.activity.ComponentActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.BufferedInputStream
          import java.io.FileInputStream

          class MainActivity : ComponentActivity() {
              private lateinit var webView: WebView
              private var mediaSession: MediaSession? = null
              private val CHANNEL_ID = "cosmos_pro_media_channel"
              private var fallbackCosmosArt: Bitmap? = null

              private val mediaActionReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      when (intent?.action) {
                          "COSMOS_PREV" -> webView.evaluateJavascript("prevTrack();", null)
                          "COSMOS_TOGGLE" -> webView.evaluateJavascript("togglePlay();", null)
                          "COSMOS_NEXT" -> webView.evaluateJavascript("nextTrack();", null)
                      }
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = Color.parseColor("#040109")
                  window.navigationBarColor = Color.parseColor("#040109")
                  fallbackCosmosArt = createCosmosPurpleArtwork()
                  setupMediaSessionAndChannel()

                  webView = WebView(this)
                  webView.setLayerType(View.LAYER_TYPE_HARDWARE, null)
                  setContentView(webView)

                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      mediaPlaybackRequiresUserGesture = false
                      allowFileAccess = true
                      allowContentAccess = true
                      cacheMode = WebSettings.LOAD_DEFAULT
                  }
                  webView.webChromeClient = WebChromeClient()
                  webView.webViewClient = object : WebViewClient() {
                      override fun shouldInterceptRequest(view: WebView?, request: WebResourceRequest?): WebResourceResponse? {
                          val url = request?.url?.toString() ?: return null
                          if (url.startsWith("https://cosmos.local/audio/")) {
                              val id = url.removePrefix("https://cosmos.local/audio/").toLongOrNull() ?: return null
                              val contentUri = ContentUris.withAppendedId(MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, id)
                              return serveAudioStreamWithRange(contentUri, request.requestHeaders)
                          }
                          if (url.startsWith("https://cosmos.local/albumart/")) {
                              val albumId = url.removePrefix("https://cosmos.local/albumart/").toLongOrNull() ?: return null
                              val artUri = ContentUris.withAppendedId(Uri.parse("content://media/external/audio/albumart"), albumId)
                              return try {
                                  val stream = contentResolver.openInputStream(artUri) ?: return null
                                  WebResourceResponse("image/jpeg", "UTF-8", 200, "OK", mapOf("Access-Control-Allow-Origin" to "*"), BufferedInputStream(stream, 32768))
                              } catch (e: Exception) { null }
                          }
                          return super.shouldInterceptRequest(view, request)
                      }
                  }
                  webView.addJavascriptInterface(CosmosBridge(), "CosmosNative")
                  webView.loadUrl("file:///android_asset/index.html")
              }

              // Streaming de alta velocidad con soporte HTTP 206 Range para eliminar lag de audio
              private fun serveAudioStreamWithRange(uri: Uri, headers: Map<String, String>?): WebResourceResponse? {
                  return try {
                      val pfd = contentResolver.openFileDescriptor(uri, "r") ?: return null
                      val totalLen = pfd.statSize
                      val rangeHeader = headers?.entries?.firstOrNull { it.key.equals("Range", ignoreCase = true) }?.value

                      val fis = FileInputStream(pfd.fileDescriptor)
                      var start = 0L
                      var end = if (totalLen > 0) totalLen - 1 else 0L
                      var statusCode = 200
                      var reason = "OK"

                      if (rangeHeader != null && rangeHeader.startsWith("bytes=") && totalLen > 0) {
                          val parts = rangeHeader.removePrefix("bytes=").split("-")
                          start = parts[0].toLongOrNull() ?: 0L
                          if (parts.size > 1 && parts[1].isNotEmpty()) {
                              end = parts[1].toLongOrNull() ?: (totalLen - 1)
                          }
                          if (start > 0) fis.channel.position(start)
                          statusCode = 206
                          reason = "Partial Content"
                      }

                      val contentLen = if (totalLen > 0) (end - start + 1) else -1L
                      val respHeaders = mutableMapOf(
                          "Access-Control-Allow-Origin" to "*",
                          "Accept-Ranges" to "bytes",
                          "Cache-Control" to "no-cache"
                      )
                      if (totalLen > 0) {
                          respHeaders["Content-Length"] = contentLen.toString()
                          if (statusCode == 206) {
                              respHeaders["Content-Range"] = "bytes $start-$end/$totalLen"
                          }
                      }

                      val buffered = object : BufferedInputStream(fis, 65536) {
                          override fun close() {
                              super.close()
                              try { pfd.close() } catch (_: Exception) {}
                          }
                      }
                      WebResourceResponse("audio/mpeg", null, statusCode, reason, respHeaders, buffered)
                  } catch (e: Exception) {
                      null
                  }
              }

              private fun createCosmosPurpleArtwork(): Bitmap {
                  val size = 512
                  val bmp = Bitmap.createBitmap(size, size, Bitmap.Config.ARGB_8888)
                  val canvas = Canvas(bmp)
                  val paint = Paint(Paint.ANTI_ALIAS_FLAG)
                  paint.shader = LinearGradient(
                      0f, 0f, size.toFloat(), size.toFloat(),
                      intArrayOf(Color.parseColor("#3b0764"), Color.parseColor("#7e22ce"), Color.parseColor("#1e0536")),
                      floatArrayOf(0f, 0.5f, 1f),
                      Shader.TileMode.CLAMP
                  )
                  canvas.drawRect(0f, 0f, size.toFloat(), size.toFloat(), paint)

                  try {
                      assets.open("ic_launcher.png").use { stream ->
                          val logo = BitmapFactory.decodeStream(stream)
                          if (logo != null) {
                              val scaled = Bitmap.createScaledBitmap(logo, 340, 340, true)
                              canvas.drawBitmap(scaled, 86f, 86f, null)
                          }
                      }
                  } catch (_: Exception) {}
                  return bmp
              }

              private fun loadAlbumArtBitmap(albumId: Long): Bitmap {
                  if (albumId >= 0) {
                      try {
                          val artUri = ContentUris.withAppendedId(Uri.parse("content://media/external/audio/albumart"), albumId)
                          contentResolver.openInputStream(artUri)?.use { stream ->
                              val decoded = BitmapFactory.decodeStream(stream)
                              if (decoded != null) {
                                  // Mezclar sutilmente con atmósfera morada de COSMOS para la notificación
                                  val copy = decoded.copy(Bitmap.Config.ARGB_8888, true)
                                  val c = Canvas(copy)
                                  val p = Paint()
                                  p.color = Color.argb(48, 126, 34, 206)
                                  c.drawRect(0f, 0f, copy.width.toFloat(), copy.height.toFloat(), p)
                                  return copy
                              }
                          }
                      } catch (_: Exception) {}
                  }
                  return fallbackCosmosArt ?: Bitmap.createBitmap(64, 64, Bitmap.Config.ARGB_8888)
              }

              private fun setupMediaSessionAndChannel() {
                  val channel = NotificationChannel(CHANNEL_ID, "COSMOS Audio Engine", NotificationManager.IMPORTANCE_LOW).apply {
                      description = "Controles multimedia de COSMOS Belmont Edition"
                      setShowBadge(false)
                  }
                  getSystemService(NotificationManager::class.java).createNotificationChannel(channel)

                  mediaSession = MediaSession(this, "CosmosBelmontProSession").apply {
                      setCallback(object : MediaSession.Callback() {
                          override fun onPlay() { runOnUiThread { webView.evaluateJavascript("playAudio();", null) } }
                          override fun onPause() { runOnUiThread { webView.evaluateJavascript("pauseAudio();", null) } }
                          override fun onSkipToNext() { runOnUiThread { webView.evaluateJavascript("nextTrack();", null) } }
                          override fun onSkipToPrevious() { runOnUiThread { webView.evaluateJavascript("prevTrack();", null) } }
                          override fun onSeekTo(pos: Long) { runOnUiThread { webView.evaluateJavascript("seekToMs($pos);", null) } }
                      })
                      isActive = true
                  }

                  val filter = IntentFilter().apply {
                      addAction("COSMOS_PREV"); addAction("COSMOS_TOGGLE"); addAction("COSMOS_NEXT")
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      registerReceiver(mediaActionReceiver, filter, Context.RECEIVER_EXPORTED)
                  } else {
                      registerReceiver(mediaActionReceiver, filter)
                  }
              }

              private fun checkPermissionsAndScan() {
                  val perms = mutableListOf<String>()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      perms.add(Manifest.permission.READ_MEDIA_AUDIO)
                      perms.add(Manifest.permission.POST_NOTIFICATIONS)
                  } else {
                      perms.add(Manifest.permission.READ_EXTERNAL_STORAGE)
                  }
                  val missing = perms.filter { ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED }
                  if (missing.isNotEmpty()) {
                      ActivityCompat.requestPermissions(this, missing.toTypedArray(), 101)
                  } else {
                      scanDeviceMusic()
                  }
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  scanDeviceMusic()
              }

              private fun scanDeviceMusic() {
                  Thread {
                      val arr = JSONArray()
                      val projection = arrayOf(
                          MediaStore.Audio.Media._ID,
                          MediaStore.Audio.Media.TITLE,
                          MediaStore.Audio.Media.ARTIST,
                          MediaStore.Audio.Media.ALBUM,
                          MediaStore.Audio.Media.ALBUM_ID,
                          MediaStore.Audio.Media.DURATION
                      )
                      contentResolver.query(
                          MediaStore.Audio.Media.EXTERNAL_CONTENT_URI,
                          projection,
                          "${MediaStore.Audio.Media.IS_MUSIC} != 0",
                          null,
                          "${MediaStore.Audio.Media.DATE_ADDED} DESC"
                      )?.use { cursor ->
                          val idCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media._ID)
                          val titleCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media.TITLE)
                          val artistCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media.ARTIST)
                          val albumCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media.ALBUM)
                          val albumIdCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media.ALBUM_ID)
                          val durCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media.DURATION)
                          while (cursor.moveToNext()) {
                              val id = cursor.getLong(idCol)
                              val albumId = cursor.getLong(albumIdCol)
                              val durationMs = cursor.getLong(durCol)
                              arr.put(JSONObject().apply {
                                  put("id", "ms_$id")
                                  put("title", cursor.getString(titleCol) ?: "Pista")
                                  put("artist", cursor.getString(artistCol) ?: "Edward Belmont")
                                  put("album", cursor.getString(albumCol) ?: "COSMOS")
                                  put("albumId", albumId)
                                  put("durationMs", durationMs)
                                  put("audioUrl", "https://cosmos.local/audio/$id")
                                  put("cover", "https://cosmos.local/albumart/$albumId")
                              })
                          }
                      }
                      val jsonStr = arr.toString()
                      runOnUiThread { webView.evaluateJavascript("window.onNativeLibraryLoaded(${JSONObject.quote(jsonStr)});", null) }
                  }.start()
              }

              inner class CosmosBridge {
                  @JavascriptInterface fun rescanMediaStore() { runOnUiThread { checkPermissionsAndScan() } }
                  @JavascriptInterface fun updateNotification(title: String, artist: String, album: String, albumId: Long, durationMs: Long, positionMs: Long, isPlaying: Boolean) {
                      Thread {
                          val artBitmap = loadAlbumArtBitmap(albumId)
                          runOnUiThread { showMediaNotification(title, artist, album, artBitmap, durationMs, positionMs, isPlaying) }
                      }.start()
                  }
              }

              private fun showMediaNotification(title: String, artist: String, album: String, artBitmap: Bitmap, durationMs: Long, positionMs: Long, isPlaying: Boolean) {
                  val state = if (isPlaying) PlaybackState.STATE_PLAYING else PlaybackState.STATE_PAUSED
                  val actions = PlaybackState.ACTION_PLAY or PlaybackState.ACTION_PAUSE or PlaybackState.ACTION_SKIP_TO_NEXT or PlaybackState.ACTION_SKIP_TO_PREVIOUS or PlaybackState.ACTION_SEEK_TO

                  mediaSession?.setPlaybackState(
                      PlaybackState.Builder()
                          .setActions(actions)
                          .setState(state, positionMs, if (isPlaying) 1.0f else 0f)
                          .build()
                  )

                  val metadata = MediaMetadata.Builder()
                      .putString(MediaMetadata.METADATA_KEY_TITLE, title)
                      .putString(MediaMetadata.METADATA_KEY_ARTIST, "$artist • $album")
                      .putString(MediaMetadata.METADATA_KEY_ALBUM, "COSMOS • Belmont Edition")
                      .putLong(MediaMetadata.METADATA_KEY_DURATION, if (durationMs > 0) durationMs else -1L)
                      .putBitmap(MediaMetadata.METADATA_KEY_ALBUM_ART, artBitmap)
                      .putBitmap(MediaMetadata.METADATA_KEY_DISPLAY_ICON, artBitmap)
                      .build()
                  mediaSession?.setMetadata(metadata)

                  val openAppIntent = Intent(this, MainActivity::class.java).apply {
                      flags = Intent.FLAG_ACTIVITY_SINGLE_TOP
                  }
                  val contentPending = PendingIntent.getActivity(this, 0, openAppIntent, PendingIntent.FLAG_IMMUTABLE)
                  val prevPending = PendingIntent.getBroadcast(this, 1, Intent("COSMOS_PREV"), PendingIntent.FLAG_IMMUTABLE)
                  val togglePending = PendingIntent.getBroadcast(this, 2, Intent("COSMOS_TOGGLE"), PendingIntent.FLAG_IMMUTABLE)
                  val nextPending = PendingIntent.getBroadcast(this, 3, Intent("COSMOS_NEXT"), PendingIntent.FLAG_IMMUTABLE)

                  val playPauseIcon = if (isPlaying) R.drawable.ic_action_pause else R.drawable.ic_action_play

                  val prevAction = Notification.Action.Builder(Icon.createWithResource(this, R.drawable.ic_action_prev), "Anterior", prevPending).build()
                  val playAction = Notification.Action.Builder(Icon.createWithResource(this, playPauseIcon), if (isPlaying) "Pausa" else "Play", togglePending).build()
                  val nextAction = Notification.Action.Builder(Icon.createWithResource(this, R.drawable.ic_action_next), "Siguiente", nextPending).build()

                  val mediaStyle = Notification.MediaStyle()
                      .setMediaSession(mediaSession?.sessionToken)
                      .setShowActionsInCompactView(0, 1, 2)

                  val builder = Notification.Builder(this, CHANNEL_ID)
                      .setSmallIcon(R.drawable.ic_cosmos_notif)
                      .setLargeIcon(artBitmap)
                      .setContentTitle(title)
                      .setContentText("$artist • $album")
                      .setSubText("COSMOS")
                      .setContentIntent(contentPending)
                      .setOngoing(isPlaying)
                      .setVisibility(Notification.VISIBILITY_PUBLIC)
                      .setColor(Color.parseColor("#6b21a8"))
                      .setColorized(true)
                      .addAction(prevAction)
                      .addAction(playAction)
                      .addAction(nextAction)
                      .setStyle(mediaStyle)

                  getSystemService(NotificationManager::class.java).notify(777, builder.build())
              }

              override fun onDestroy() {
                  super.onDestroy()
                  unregisterReceiver(mediaActionReceiver)
                  mediaSession?.release()
              }
          }
          EOF

