              <div class="card-2027 rounded-3xl w-full max-w-md p-5 space-y-4 max-h-[90vh] overflow-y-auto">
                <div class="flex justify-between items-center border-b border-purple-800/40 pb-2">
                  <h3 class="font-bold text-sm text-purple-100">Ecualizador Hardware (Directo BT / 16 Géneros)</h3>
                  <button onclick="closeModal('eqModal')" class="text-purple-400"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div id="eqPresetContainer" class="grid grid-cols-4 gap-1.5"></div>
                <div class="space-y-3 pt-2 border-t border-purple-900/50">
                  <div class="flex items-center gap-3"><span class="text-xs text-fuchsia-300 w-16 font-mono font-bold">60 Hz</span><input type="range" id="eq-0" min="-12" max="12" value="0" oninput="updateEqBand(0, this.value)" class="flex-1" /><span id="eq-val-0" class="text-xs text-purple-200 w-10 text-right font-mono">0dB</span></div>
                  <div class="flex items-center gap-3"><span class="text-xs text-purple-300 w-16 font-mono">230 Hz</span><input type="range" id="eq-1" min="-12" max="12" value="0" oninput="updateEqBand(1, this.value)" class="flex-1" /><span id="eq-val-1" class="text-xs text-purple-200 w-10 text-right font-mono">0dB</span></div>
                  <div class="flex items-center gap-3"><span class="text-xs text-purple-300 w-16 font-mono">910 Hz</span><input type="range" id="eq-2" min="-12" max="12" value="0" oninput="updateEqBand(2, this.value)" class="flex-1" /><span id="eq-val-2" class="text-xs text-purple-200 w-10 text-right font-mono">0dB</span></div>
                  <div class="flex items-center gap-3"><span class="text-xs text-purple-300 w-16 font-mono">3.6 kHz</span><input type="range" id="eq-3" min="-12" max="12" value="0" oninput="updateEqBand(3, this.value)" class="flex-1" /><span id="eq-val-3" class="text-xs text-purple-200 w-10 text-right font-mono">0dB</span></div>
                  <div class="flex items-center gap-3"><span class="text-xs text-fuchsia-300 w-16 font-mono font-bold">14 kHz</span><input type="range" id="eq-4" min="-12" max="12" value="0" oninput="updateEqBand(4, this.value)" class="flex-1" /><span id="eq-val-4" class="text-xs text-purple-200 w-10 text-right font-mono">0dB</span></div>
                </div>
              </div>
            </div>

            <!-- MODAL TEMPORIZADOR -->
            <div id="timerModal" class="fixed inset-0 z-[75] bg-black/85 hidden items-center justify-center p-4">
              <div class="card-2027 rounded-3xl w-full max-w-sm p-5 space-y-3 text-center">
                <div class="flex justify-between items-center border-b border-purple-800/40 pb-2">
                  <h3 class="font-bold text-sm text-purple-100">Temporizador de Apagado</h3>
                  <button onclick="closeModal('timerModal')" class="text-purple-400"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="grid grid-cols-3 gap-2 pt-2">
                  <button onclick="setSleepTimer(10)" class="p-2.5 rounded-2xl glass-pill text-xs font-semibold">10 Min</button>
                  <button onclick="setSleepTimer(20)" class="p-2.5 rounded-2xl glass-pill text-xs font-semibold">20 Min</button>
                  <button onclick="setSleepTimer(45)" class="p-2.5 rounded-2xl glass-pill text-xs font-semibold">45 Min</button>
                </div>
                <button onclick="setSleepTimer(0)" class="w-full p-2.5 rounded-2xl bg-red-950/60 border border-red-700/40 text-xs text-red-300 font-semibold mt-2">Desactivar</button>
              </div>
            </div>

            <!-- TOAST FLOTANTE -->
            <div id="cosmosToast" class="fixed top-20 left-1/2 -translate-x-1/2 z-[90] px-4 py-2 rounded-full bg-gradient-to-r from-purple-700 to-fuchsia-600 text-white text-xs font-bold shadow-lg opacity-0 pointer-events-none transition-opacity duration-200">
              Listo
            </div>

            <script>
              window.defaultLogoDataUri = "data:image/svg+xml;utf8," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300"><rect width="300" height="300" fill="#06020d"/><circle cx="150" cy="150" r="110" fill="none" stroke="#a855f7" stroke-width="3" opacity="0.5"/><path d="M80 138 A72 72 0 0 1 220 138" fill="none" stroke="#f0abfc" stroke-width="6" stroke-linecap="round"/><polygon points="150,55 88,168 122,168 150,108" fill="#f5d0fe"/><polygon points="150,55 212,168 178,168 150,108" fill="#a855f7"/><polygon points="124,162 150,235 176,162 150,184" fill="#c084fc"/><polygon points="150,122 162,146 150,170 138,146" fill="#ffffff"/></svg>`);

              const headerLogo = document.getElementById("headerLogoImg");
              headerLogo.onerror = function() { this.src = window.defaultLogoDataUri; };

              let tracks = [];
              let customOverrides = JSON.parse(localStorage.getItem("cosmos_overrides_2027")) || {};
              let likedTrackIds = JSON.parse(localStorage.getItem("cosmos_likes_2027")) || [];
              let userPlaylists = JSON.parse(localStorage.getItem("cosmos_playlists_2027")) || [
                { id: "pl_default_1", name: "Sesión Nocturna ✨", tracks: [] }
              ];

              let currentTab = "songs", currentTrackIndex = -1, actionSheetTrackIdx = -1, pendingAddTrackIdx = -1;
              let activePlaylistViewId = null;
              let isPlaying = false, isDraggingSeek = false, currentDurationSec = 0;
              let shuffleMode = false, repeatMode = 0;
              let activePresetName = "Directo BT", sleepTimerId = null;

              function showToast(msg) {
                const t = document.getElementById("cosmosToast");
                t.textContent = msg;
                t.style.opacity = "1";
                setTimeout(() => { t.style.opacity = "0"; }, 2000);
              }

              function updateBentoCounters() {
                document.getElementById("bentoLikesCount").textContent = `${likedTrackIds.length} pistas`;
                document.getElementById("bentoPlaylistsCount").textContent = `${userPlaylists.length} listas`;
              }

              const eqPresets = {
                "Directo BT": [0, 0, 0, 0, 0],
                "Space Rock": [5, 2, 0, 4, 6],
                "Gothic Rock": [6, 4, -1, 3, 5],
                "Love Metal": [6, 3, -1, 5, 6],
                "Symphonic": [5, 2, 1, 5, 7],
                "Metal": [7, 3, -3, 5, 7],
                "Rock": [5, 3, -1, 4, 5],
                "Pop": [2, 3, 4, 3, 3],
                "Acoustic": [3, 2, 1, 4, 5],
                "Bass Boost": [8, 5, 0, 1, 2],
                "Vocal": [-2, 1, 6, 5, 2],
                "Synthwave": [6, 4, -1, 3, 6],
                "Salsa": [4, 3, 3, 4, 5],
                "Cumbia": [6, 4, 1, 3, 4],
                "Jazz": [4, 2, -1, 3, 4],
                "Classical": [3, 1, 0, 3, 5]
              };

              function renderEqButtons() {
                const container = document.getElementById("eqPresetContainer");
                container.innerHTML = "";
                Object.keys(eqPresets).forEach(name => {
                  const btn = document.createElement("button");
                  const isAct = name === activePresetName;
                  btn.className = isAct
                    ? "px-2 py-1.5 rounded-xl text-[10px] font-bold bg-gradient-to-r from-purple-600 to-fuchsia-600 text-white border border-fuchsia-300 truncate"
                    : "px-2 py-1.5 rounded-xl text-[10px] glass-pill text-purple-300 truncate";
                  btn.textContent = name;
                  btn.onclick = () => applyEqPreset(name);
                  container.appendChild(btn);
                });
              }

              window.onNativeLibraryLoaded = function(jsonArray) {
                try {
                  const list = typeof jsonArray === "string" ? JSON.parse(jsonArray) : jsonArray;
                  tracks = list.map((item, idx) => {
                    const saved = customOverrides[item.id] || {};
                    if (saved.title && window.CosmosNative) {
                      window.CosmosNative.updateTrackMetadata(idx, saved.title, saved.artist || item.artist, saved.album || item.album);
                    }
                    return {
                      id: item.id,
                      mediaId: item.mediaId || 0,
                      title: saved.title || item.title,
                      artist: saved.artist || item.artist,
                      album: saved.album || item.album,
                      albumId: item.albumId !== undefined ? item.albumId : -1,
                      durationMs: item.durationMs || 0,
                      thumb: saved.cover || item.thumb || item.cover || "ic_launcher.png",
                      cover: saved.cover || item.cover || "ic_launcher.png"
                    };
                  });
                  updateBentoCounters();
                  renderLibrary();
                } catch(e) {}
              };

              window.onNativeTrackState = function(idx, playing, posMs, durMs) {
                if (idx < 0 || idx >= tracks.length) return;
                const prevIdx = currentTrackIndex;
                currentTrackIndex = idx;
                isPlaying = playing;
                const t = tracks[idx];
                setImageWithFallback(document.getElementById("miniCover"), t.thumb);
                setImageWithFallback(document.getElementById("fullCover"), t.cover);
                document.getElementById("miniTitle").textContent = t.title;
                document.getElementById("miniArtist").textContent = t.artist;
                document.getElementById("fullTitle").textContent = t.title;
                document.getElementById("fullArtist").textContent = t.artist;
                document.getElementById("fullAlbumName").textContent = t.album;
                updatePlayButtons(playing);
                updateLikeButtonsUI();
                highlightActiveRow(prevIdx, idx);
                currentDurationSec = (durMs || t.durationMs || 0) / 1000;
                if (!isDraggingSeek) {
                  updateTimeUI((posMs || 0) / 1000, currentDurationSec);
                }
              };

              window.onNativeProgress = function(posMs, durMs, playing) {
                isPlaying = playing;
                updatePlayButtons(playing);
                currentDurationSec = (durMs || 0) / 1000;
                if (!isDraggingSeek) {
                  updateTimeUI((posMs || 0) / 1000, currentDurationSec);
                }
              };

              function rescanPhoneLibrary() { if(window.CosmosNative) window.CosmosNative.rescanMediaStore(); }

              function isTrackLiked(trackId) {
                return likedTrackIds.includes(trackId);
              }

              function toggleLikeByIdx(idx, ev) {
