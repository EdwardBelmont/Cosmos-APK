name: Compilar COSMOS APK Nativo

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Codigo Base
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Android SDK Unificado
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          rm tools.zip
          
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Ensamblar COSMOS 6.0 Pure Native Bluetooth Engine
        run: |
          mkdir -p app/src/main/java/com/belmont/cosmos
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-xxhdpi

          if [ -f "ic_launcher.png" ]; then
            cp ic_launcher.png app/src/main/res/drawable/ic_launcher.png
            cp ic_launcher.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp ic_launcher.png app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
            cp ic_launcher.png app/src/main/assets/ic_launcher.png
          elif [ -f "app/src/main/res/drawable/ic_launcher.png" ]; then
            cp app/src/main/res/drawable/ic_launcher.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp app/src/main/res/drawable/ic_launcher.png app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
            cp app/src/main/res/drawable/ic_launcher.png app/src/main/assets/ic_launcher.png
          fi

          if [ -f "splash_bg.png" ]; then
            cp splash_bg.png app/src/main/res/drawable/splash_bg.png
            cp splash_bg.png app/src/main/assets/splash_bg.png
          elif [ -f "app/src/main/res/drawable/splash_bg.png" ]; then
            cp app/src/main/res/drawable/splash_bg.png app/src/main/assets/splash_bg.png
          fi

          cat << 'EOF' > app/src/main/res/drawable/ic_cosmos_notif.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="100"
              android:viewportHeight="100">
              <path android:fillColor="#FFFFFF" android:pathData="M50,8 L16,62 L34,62 L50,32 L66,62 L84,62 Z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M36,58 L50,92 L64,58 L50,68 Z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M50,39 L56,50 L50,61 L44,50 Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_action_prev.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="28dp"
              android:height="28dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M6,6c0.55,0 1,0.45 1,1v10c0,0.55 -0.45,1 -1,1s-1,-0.45 -1,-1V7C5,6.45 5.45,6 6,6zM9.5,12l8.5,6V6L9.5,12z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_action_play.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="32dp"
              android:height="32dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M8,6.82v10.36c0,0.79 0.87,1.27 1.54,0.84l8.14,-5.18c0.62,-0.39 0.62,-1.29 0,-1.69L9.54,5.98C8.87,5.55 8,6.03 8,6.82z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_action_pause.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="32dp"
              android:height="32dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M8,19c1.1,0 2,-0.9 2,-2V7c0,-1.1 -0.9,-2 -2,-2S6,5.9 6,7v10C6,18.1 6.9,19 8,19zM16,5c-1.1,0 -2,0.9 -2,2v10c0,1.1 0.9,2 2,2s2,-0.9 2,-2V7C18,5.9 17.1,5 16,5z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_action_next.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="28dp"
              android:height="28dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M18,6c-0.55,0 -1,0.45 -1,1v10c0,0.55 0.45,1 1,1s1,-0.45 1,-1V7C19,6.45 18.55,6 18,6zM14.5,12L6,6v12L14.5,12z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.CosmosSplash" parent="android:Theme.DeviceDefault.NoActionBar">
                  <item name="android:windowBackground">#040109</item>
                  <item name="android:statusBarColor">#040109</item>
                  <item name="android:navigationBarColor">#040109</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "COSMOS"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.belmont.cosmos'
              compileSdk 34
              defaultConfig {
                  applicationId "com.belmont.cosmos"
                  minSdk 26
                  targetSdk 34
                  versionCode 6
                  versionName "6.0-PURE-NATIVE"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.activity:activity-ktx:1.8.2'
              implementation 'androidx.media:media:1.7.0'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:label="COSMOS"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:theme="@style/Theme.CosmosSplash"
                  android:hardwareAccelerated="true"
                  android:largeHeap="true"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".CosmosPlaybackService"
                      android:enabled="true"
                      android:exported="false"
                      android:stopWithTask="false"
                      android:foregroundServiceType="mediaPlayback" />
              </application>
          </manifest>
          EOF

          # SERVICIO EN PRIMER PLANO PERSISTENTE CON WAKELOCK CONTINUO
          cat << 'EOF' > app/src/main/java/com/belmont/cosmos/CosmosPlaybackService.kt
          package com.belmont.cosmos

          import android.app.Notification
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.IBinder
          import android.os.PowerManager
          import android.os.Process

          class CosmosPlaybackService : Service() {
              private var wakeLock: PowerManager.WakeLock? = null

              override fun onCreate() {
                  super.onCreate()
                  try {
                      Process.setThreadPriority(Process.THREAD_PRIORITY_URGENT_AUDIO)
                  } catch (_: Exception) {}

                  val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                  wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "Cosmos::PureNativeWakeLock").apply {
                      setReferenceCounted(false)
                  }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (wakeLock?.isHeld == false) {
                      wakeLock?.acquire(12 * 60 * 60 * 1000L)
                  }
                  val notif: Notification? = MainActivity.latestNotification
                  if (notif != null) {
                      try {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              startForeground(777, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK)
                          } else {
                              startForeground(777, notif)
                          }
                      } catch (_: Exception) {}
                  }
                  return START_STICKY
              }

              override fun onDestroy() {
                  if (wakeLock?.isHeld == true) wakeLock?.release()
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

          # MAINACTIVITY 6.0: AUDIOFOCUS UNICO (SIN AUTO-PAUSA), BITMAPS 256PX Y BYPASS BLUETOOTH A2DP
          cat << 'EOF' > app/src/main/java/com/belmont/cosmos/MainActivity.kt
          package com.belmont.cosmos

          import android.Manifest
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.ContentUris
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.pm.PackageManager
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.LinearGradient
          import android.graphics.Paint
          import android.graphics.Shader
          import android.graphics.drawable.Icon
          import android.media.AudioAttributes
          import android.media.AudioFocusRequest
          import android.media.AudioManager
          import android.media.MediaMetadata
          import android.media.MediaPlayer
          import android.media.audiofx.Equalizer
          import android.media.session.MediaSession
          import android.media.session.PlaybackState
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.os.PowerManager
          import android.provider.MediaStore
          import android.provider.Settings
          import android.util.LruCache
          import android.view.View
          import android.webkit.JavascriptInterface
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceRequest
          import android.webkit.WebResourceResponse
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.activity.ComponentActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.BufferedInputStream
          import java.io.ByteArrayInputStream
          import java.io.ByteArrayOutputStream

          data class NativeTrack(
              val index: Int,
              val id: String,
              val mediaId: Long,
              var title: String,
              var artist: String,
              var album: String,
              val albumId: Long,
              val durationMs: Long
          )

          class MainActivity : ComponentActivity() {
              companion object {
                  var latestNotification: Notification? = null
              }

              private lateinit var webView: WebView
              private var mediaSession: MediaSession? = null
              private lateinit var audioManager: AudioManager
              private var singleFocusRequest: AudioFocusRequest? = null
              private var hasAudioFocus = false
              private var isForegroundServiceStarted = false

              private val CHANNEL_ID = "cosmos_pure_native_channel"
              private var fallbackCosmosArt: Bitmap? = null
              private var fallbackThumbBytes: ByteArray? = null

              // Instancia unica de MediaPlayer en el proceso nativo
              private var mediaPlayer: MediaPlayer? = null
              private var hardwareEq: Equalizer? = null
              private var isEqEnabled: Boolean = false
              private var currentEqGainsDb = intArrayOf(0, 0, 0, 0, 0)
              private var isPlayerPrepared = false

              private val trackList = mutableListOf<NativeTrack>()
              private var activeQueueIndices = mutableListOf<Int>()
              private var currentIndex: Int = -1
              private var shuffleMode: Boolean = false
              private var repeatMode: Int = 0
              private var currentArtBitmap: Bitmap? = null

              private val uiHandler = Handler(Looper.getMainLooper())
              private var isUiVisible = true

              private val progressRunnable = object : Runnable {
                  override fun run() {
                      if (isUiVisible && isPlayerPrepared && mediaPlayer?.isPlaying == true) {
                          syncProgressToWeb()
                      }
                      uiHandler.postDelayed(this, 450L)
                  }
              }

              private val thumbCache = object : LruCache<Long, ByteArray>(12 * 1024 * 1024) {
                  override fun sizeOf(key: Long, value: ByteArray): Int = value.size
              }

              private val notifArtCache = object : LruCache<Long, Bitmap>(6 * 1024 * 1024) {
                  override fun sizeOf(key: Long, value: Bitmap): Int = value.byteCount
              }

              private val mediaActionReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      when (intent?.action) {
                          "COSMOS_PREV" -> prevTrackNative()
                          "COSMOS_TOGGLE" -> togglePlayNative()
                          "COSMOS_NEXT" -> nextTrackNative()
                      }
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = Color.parseColor("#040109")
                  window.navigationBarColor = Color.parseColor("#040109")
                  audioManager = getSystemService(Context.AUDIO_SERVICE) as AudioManager

                  fallbackCosmosArt = createCosmosPurpleArtwork()
                  currentArtBitmap = fallbackCosmosArt
                  fallbackThumbBytes = bitmapToJpegBytes(Bitmap.createScaledBitmap(fallbackCosmosArt!!, 140, 140, true), 82)

                  initSingleAudioFocusRequest()
                  initSingleMediaPlayer()
                  setupMediaSessionAndChannel()
                  requestBatteryOptimizationExemption()

                  webView = WebView(this)
                  webView.setLayerType(View.LAYER_TYPE_HARDWARE, null)
                  setContentView(webView)

                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      mediaPlaybackRequiresUserGesture = false
                      allowFileAccess = true
                      allowContentAccess = true
                      cacheMode = WebSettings.LOAD_DEFAULT
                  }
                  webView.webChromeClient = WebChromeClient()
                  webView.webViewClient = object : WebViewClient() {
                      override fun shouldInterceptRequest(view: WebView?, request: WebResourceRequest?): WebResourceResponse? {
                          val uriObj = request?.url ?: return null
                          val url = uriObj.toString()
                          if (url.startsWith("https://cosmos.local/albumart/")) {
                              val albumId = uriObj.lastPathSegment?.toLongOrNull() ?: return null
                              val isThumb = uriObj.getQueryParameter("thumb") == "1"
                              return serveAlbumArtFast(albumId, isThumb)
                          }
                          return super.shouldInterceptRequest(view, request)
                      }
                  }
                  webView.addJavascriptInterface(CosmosBridge(), "CosmosNative")
                  webView.loadUrl("file:///android_asset/index.html")
                  uiHandler.postDelayed(progressRunnable, 500L)
              }

              // Unica instancia de AudioFocusRequest: evita que Android auto-pause la app al dar Play
              private fun initSingleAudioFocusRequest() {
                  val attrs = AudioAttributes.Builder()
                      .setUsage(AudioAttributes.USAGE_MEDIA)
                      .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC)
                      .build()

                  singleFocusRequest = AudioFocusRequest.Builder(AudioManager.AUDIOFOCUS_GAIN)
                      .setAudioAttributes(attrs)
                      .setAcceptsDelayedFocusGain(true)
                      .setWillPauseWhenDucked(false)
                      .setOnAudioFocusChangeListener { change ->
                          when (change) {
                              AudioManager.AUDIOFOCUS_LOSS_TRANSIENT_CAN_DUCK -> {
                                  try { mediaPlayer?.setVolume(0.35f, 0.35f) } catch (_: Exception) {}
                              }
                              AudioManager.AUDIOFOCUS_GAIN -> {
                                  hasAudioFocus = true
                                  try { mediaPlayer?.setVolume(1.0f, 1.0f) } catch (_: Exception) {}
                              }
                          }
                      }
                      .build()
              }

              private fun ensureAudioFocus() {
                  if (!hasAudioFocus) {
                      singleFocusRequest?.let {
                          val res = audioManager.requestAudioFocus(it)
                          if (res == AudioManager.AUDIOFOCUS_REQUEST_GRANTED) {
                              hasAudioFocus = true
                          }
                      }
                  }
              }

              private fun initSingleMediaPlayer() {
                  mediaPlayer = MediaPlayer().apply {
                      setWakeMode(applicationContext, PowerManager.PARTIAL_WAKE_LOCK)
                      setAudioAttributes(
                          AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_MEDIA)
                              .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC)
                              .build()
                      )
                      setOnCompletionListener {
                          onNativeTrackCompleted()
                      }
                      setOnErrorListener { _, _, _ ->
                          isPlayerPrepared = false
                          true
                      }
                  }
              }

              private fun evaluateJsSafely(script: String) {
                  if (isUiVisible) {
                      webView.evaluateJavascript(script, null)
                  }
              }

              private fun loadTrackNative(index: Int, autoPlay: Boolean) {
                  if (index < 0 || index >= trackList.size) return
                  currentIndex = index
                  val track = trackList[index]

                  try {
                      if (mediaPlayer == null) initSingleMediaPlayer()
                      val mp = mediaPlayer!!
                      isPlayerPrepared = false
                      mp.reset()
                      mp.setWakeMode(applicationContext, PowerManager.PARTIAL_WAKE_LOCK)
                      mp.setAudioAttributes(
                          AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_MEDIA)
                              .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC)
                              .build()
                      )

                      val contentUri = ContentUris.withAppendedId(MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, track.mediaId)
                      mp.setDataSource(applicationContext, contentUri)
                      mp.prepare()
                      isPlayerPrepared = true

                      if (isEqEnabled) {
                          applyEqGainsToHardware()
                      }

                      if (autoPlay) {
                          ensureAudioFocus()
                          mp.start()
                      }

                      syncFullTrackToWeb()

                      val cachedArt = notifArtCache.get(track.albumId)
                      if (cachedArt != null) {
                          currentArtBitmap = cachedArt
                          updateNotificationAndSession()
                      } else {
                          currentArtBitmap = fallbackCosmosArt
                          updateNotificationAndSession()
                          Thread {
                              val bmp = loadCompactNotificationBitmap(track.albumId)
                              notifArtCache.put(track.albumId, bmp)
                              if (currentIndex == index) {
                                  currentArtBitmap = bmp
                                  runOnUiThread { updateNotificationAndSession() }
                              }
                          }.start()
                      }
                  } catch (e: Exception) {
                      isPlayerPrepared = false
                      try {
                          mediaPlayer?.release()
                          mediaPlayer = null
                          initSingleMediaPlayer()
                      } catch (_: Exception) {}
                  }
              }

              private fun playNative() {
                  if (trackList.isEmpty()) {
                      checkPermissionsAndScan()
                      return
                  }
                  if (!isPlayerPrepared || mediaPlayer == null) {
                      loadTrackNative(if (currentIndex >= 0) currentIndex else 0, true)
                      return
                  }
                  try {
                      ensureAudioFocus()
                      mediaPlayer?.setVolume(1.0f, 1.0f)
                      if (mediaPlayer?.isPlaying == false) {
                          mediaPlayer?.start()
                      }
                      syncFullTrackToWeb()
                      updateNotificationAndSession()
                  } catch (_: Exception) {
                      loadTrackNative(if (currentIndex >= 0) currentIndex else 0, true)
                  }
              }

              private fun pauseNative() {
                  if (!isPlayerPrepared) return
                  try {
                      if (mediaPlayer?.isPlaying == true) {
                          mediaPlayer?.pause()
                      }
                      syncFullTrackToWeb()
                      updateNotificationAndSession()
                  } catch (_: Exception) {}
              }

              private fun togglePlayNative() {
                  if (!isPlayerPrepared || mediaPlayer == null) {
                      playNative()
                      return
                  }
                  val playing = try { mediaPlayer?.isPlaying == true } catch (_: Exception) { false }
                  if (playing) {
                      pauseNative()
                  } else {
                      playNative()
                  }
              }

              private fun updatePlaybackStateOnly() {
                  if (!isPlayerPrepared) return
                  try {
                      val mp = mediaPlayer ?: return
                      val isPlaying = mp.isPlaying
                      val posMs = mp.currentPosition.toLong()
                      val state = if (isPlaying) PlaybackState.STATE_PLAYING else PlaybackState.STATE_PAUSED
                      val actions = PlaybackState.ACTION_PLAY or PlaybackState.ACTION_PAUSE or PlaybackState.ACTION_SKIP_TO_NEXT or PlaybackState.ACTION_SKIP_TO_PREVIOUS or PlaybackState.ACTION_SEEK_TO
                      mediaSession?.setPlaybackState(
                          PlaybackState.Builder()
                              .setActions(actions)
                              .setState(state, posMs, if (isPlaying) 1.0f else 0f)
                              .build()
                      )
                  } catch (_: Exception) {}
              }

              private fun seekToPercentNative(percent: Double) {
                  if (!isPlayerPrepared) return
                  try {
                      val mp = mediaPlayer ?: return
                      val dur = mp.duration
                      if (dur > 0) {
                          val targetMs = ((percent.coerceIn(0.0, 100.0) / 100.0) * dur).toInt()
                          mp.seekTo(targetMs)
                          syncProgressToWeb()
                          updatePlaybackStateOnly()
                      }
                  } catch (_: Exception) {}
              }

              private fun seekToMsNative(targetMs: Long) {
                  if (!isPlayerPrepared) return
                  try {
                      val mp = mediaPlayer ?: return
                      val dur = mp.duration
                      if (dur > 0) {
                          val clamped = targetMs.coerceIn(0L, dur.toLong()).toInt()
                          mp.seekTo(clamped)
                          syncProgressToWeb()
                          updatePlaybackStateOnly()
                      }
                  } catch (_: Exception) {}
              }

              private fun seekByDeltaMsNative(deltaMs: Int) {
                  if (!isPlayerPrepared) return
                  try {
                      val mp = mediaPlayer ?: return
                      val dur = mp.duration
                      if (dur > 0) {
                          val target = (mp.currentPosition + deltaMs).coerceIn(0, dur)
                          mp.seekTo(target)
                          syncProgressToWeb()
                          updatePlaybackStateOnly()
                      }
                  } catch (_: Exception) {}
              }

              private fun prevTrackNative() {
                  if (trackList.isEmpty()) return
                  if (isPlayerPrepared && (mediaPlayer?.currentPosition ?: 0) > 3500) {
                      seekToMsNative(0L)
                      return
                  }
                  val queue = if (activeQueueIndices.isNotEmpty()) activeQueueIndices else trackList.indices.toList()
                  if (queue.isEmpty()) return
                  val posInQueue = queue.indexOf(currentIndex)
                  val prevIdx = if (posInQueue > 0) queue[posInQueue - 1] else queue.last()
                  loadTrackNative(prevIdx, true)
              }

              private fun nextTrackNative() {
                  if (trackList.isEmpty()) return
                  val queue = if (activeQueueIndices.isNotEmpty()) activeQueueIndices else trackList.indices.toList()
                  if (queue.isEmpty()) return
                  val nextIdx = if (shuffleMode) {
                      queue.random()
                  } else {
                      val posInQueue = queue.indexOf(currentIndex)
                      if (posInQueue >= 0 && posInQueue + 1 < queue.size) queue[posInQueue + 1] else queue.first()
                  }
                  loadTrackNative(nextIdx, true)
              }

              private fun onNativeTrackCompleted() {
                  if (trackList.isEmpty()) return
                  if (repeatMode == 2) {
                      seekToMsNative(0L)
                      playNative()
                      return
                  }
                  nextTrackNative()
              }

              // Ecualizador con Bypass para Bluetooth A2DP: cuando esta en Plano (0dB), se apaga para no trabar el Bluetooth
              private fun applyEqGainsToHardware() {
                  try {
                      val mp = mediaPlayer ?: return
                      val allFlat = currentEqGainsDb.all { it == 0 }
                      if (allFlat) {
                          isEqEnabled = false
                          hardwareEq?.enabled = false
                          return
                      }
                      isEqEnabled = true
                      if (hardwareEq == null) {
                          hardwareEq = Equalizer(0, mp.audioSessionId)
                      }
                      val eq = hardwareEq ?: return
                      eq.enabled = true
                      val numBands = eq.numberOfBands.toInt()
                      val range = eq.bandLevelRange
                      val minMb = range[0].toInt()
                      val maxMb = range[1].toInt()
                      for (b in 0 until numBands) {
                          val gainIdx = (b * currentEqGainsDb.size) / numBands
                          val dbVal = currentEqGainsDb[gainIdx.coerceIn(0, currentEqGainsDb.size - 1)]
                          val levelMb = (dbVal * 100).coerceIn(minMb, maxMb)
                          eq.setBandLevel(b.toShort(), levelMb.toShort())
                      }
                  } catch (_: Exception) {}
              }

              private fun syncFullTrackToWeb() {
                  if (!isUiVisible || currentIndex < 0 || currentIndex >= trackList.size) return
                  val playing = isPlayerPrepared && (try { mediaPlayer?.isPlaying == true } catch (_: Exception) { false })
                  val posMs = if (isPlayerPrepared) (try { mediaPlayer?.currentPosition ?: 0 } catch (_: Exception) { 0 }) else 0
                  val durMs = if (isPlayerPrepared) (try { mediaPlayer?.duration ?: trackList[currentIndex].durationMs.toInt() } catch (_: Exception) { trackList[currentIndex].durationMs.toInt() }) else trackList[currentIndex].durationMs.toInt()
                  evaluateJsSafely("window.onNativeTrackState($currentIndex, $playing, $posMs, $durMs);")
              }

              private fun syncProgressToWeb() {
                  if (!isUiVisible || !isPlayerPrepared) return
                  val playing = try { mediaPlayer?.isPlaying == true } catch (_: Exception) { false }
                  val posMs = try { mediaPlayer?.currentPosition ?: 0 } catch (_: Exception) { 0 }
                  val durMs = try { mediaPlayer?.duration ?: 0 } catch (_: Exception) { 0 }
                  evaluateJsSafely("window.onNativeProgress($posMs, $durMs, $playing);")
              }

              private fun requestBatteryOptimizationExemption() {
                  try {
                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      if (!pm.isIgnoringBatteryOptimizations(packageName)) {
                          val intent = Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS).apply {
                              data = Uri.parse("package:$packageName")
                          }
                          startActivity(intent)
                      }
                  } catch (_: Exception) {}
              }

              private fun bitmapToJpegBytes(bmp: Bitmap, quality: Int): ByteArray {
                  val baos = ByteArrayOutputStream()
                  bmp.compress(Bitmap.CompressFormat.JPEG, quality, baos)
                  return baos.toByteArray()
              }

              private fun serveAlbumArtFast(albumId: Long, isThumb: Boolean): WebResourceResponse? {
                  val headers = mapOf(
                      "Access-Control-Allow-Origin" to "*",
                      "Cache-Control" to "max-age=31536000, immutable"
                  )
                  if (isThumb) {
                      val cached = thumbCache.get(albumId)
                      if (cached != null) {
                          return WebResourceResponse("image/jpeg", null, 200, "OK", headers, ByteArrayInputStream(cached))
                      }
                      val artUri = ContentUris.withAppendedId(Uri.parse("content://media/external/audio/albumart"), albumId)
                      try {
                          contentResolver.openInputStream(artUri)?.use { stream ->
                              val opts = BitmapFactory.Options().apply { inSampleSize = 4 }
                              val decoded = BitmapFactory.decodeStream(stream, null, opts)
                              if (decoded != null) {
                                  val scaled = Bitmap.createScaledBitmap(decoded, 140, 140, true)
                                  val bytes = bitmapToJpegBytes(scaled, 82)
                                  thumbCache.put(albumId, bytes)
                                  return WebResourceResponse("image/jpeg", null, 200, "OK", headers, ByteArrayInputStream(bytes))
                              }
                          }
                      } catch (_: Exception) {}

                      val fallback = fallbackThumbBytes ?: return null
                      thumbCache.put(albumId, fallback)
                      return WebResourceResponse("image/jpeg", null, 200, "OK", headers, ByteArrayInputStream(fallback))
                  } else {
                      val artUri = ContentUris.withAppendedId(Uri.parse("content://media/external/audio/albumart"), albumId)
                      return try {
                          val stream = contentResolver.openInputStream(artUri) ?: return null
                          WebResourceResponse("image/jpeg", null, 200, "OK", headers, BufferedInputStream(stream, 65536))
                      } catch (e: Exception) {
                          val fallback = fallbackThumbBytes ?: return null
                          WebResourceResponse("image/jpeg", null, 200, "OK", headers, ByteArrayInputStream(fallback))
                      }
                  }
              }

              // Portada compacta 256x256 para no saturar jamas el Binder de Bluetooth AVRCP
              private fun createCosmosPurpleArtwork(): Bitmap {
                  val size = 256
                  val bmp = Bitmap.createBitmap(size, size, Bitmap.Config.ARGB_8888)
                  val canvas = Canvas(bmp)
                  val paint = Paint(Paint.ANTI_ALIAS_FLAG)
                  paint.shader = LinearGradient(
                      0f, 0f, size.toFloat(), size.toFloat(),
                      intArrayOf(Color.parseColor("#3b0764"), Color.parseColor("#7e22ce"), Color.parseColor("#1e0536")),
                      floatArrayOf(0f, 0.5f, 1f),
                      Shader.TileMode.CLAMP
                  )
                  canvas.drawRect(0f, 0f, size.toFloat(), size.toFloat(), paint)

                  try {
                      assets.open("ic_launcher.png").use { stream ->
                          val logo = BitmapFactory.decodeStream(stream)
                          if (logo != null) {
                              val scaled = Bitmap.createScaledBitmap(logo, 180, 180, true)
                              canvas.drawBitmap(scaled, 38f, 38f, null)
                          }
                      }
                  } catch (_: Exception) {}
                  return bmp
              }

              private fun loadCompactNotificationBitmap(albumId: Long): Bitmap {
                  if (albumId >= 0) {
                      try {
                          val artUri = ContentUris.withAppendedId(Uri.parse("content://media/external/audio/albumart"), albumId)
                          contentResolver.openInputStream(artUri)?.use { stream ->
                              val opts = BitmapFactory.Options().apply { inSampleSize = 4 }
                              val decoded = BitmapFactory.decodeStream(stream, null, opts)
                              if (decoded != null) {
                                  val scaled = Bitmap.createScaledBitmap(decoded, 256, 256, true)
                                  val copy = scaled.copy(Bitmap.Config.ARGB_8888, true)
                                  val c = Canvas(copy)
                                  val p = Paint()
                                  p.color = Color.argb(40, 126, 34, 206)
                                  c.drawRect(0f, 0f, 256f, 256f, p)
                                  return copy
                              }
                          }
                      } catch (_: Exception) {}
                  }
                  return fallbackCosmosArt ?: Bitmap.createBitmap(128, 128, Bitmap.Config.ARGB_8888)
              }

              private fun setupMediaSessionAndChannel() {
                  val channel = NotificationChannel(CHANNEL_ID, "COSMOS Pure Native Audio", NotificationManager.IMPORTANCE_LOW).apply {
                      description = "Reproduccion Bluetooth directa y controles de COSMOS"
                      setShowBadge(false)
                  }
                  getSystemService(NotificationManager::class.java).createNotificationChannel(channel)

                  mediaSession = MediaSession(this, "CosmosPureNativeSession").apply {
                      setCallback(object : MediaSession.Callback() {
                          override fun onPlay() { runOnUiThread { playNative() } }
                          override fun onPause() { runOnUiThread { pauseNative() } }
                          override fun onSkipToNext() { runOnUiThread { nextTrackNative() } }
                          override fun onSkipToPrevious() { runOnUiThread { prevTrackNative() } }
                          override fun onSeekTo(pos: Long) { runOnUiThread { seekToMsNative(pos) } }
                      })
                      isActive = true
                  }

                  val filter = IntentFilter().apply {
                      addAction("COSMOS_PREV")
                      addAction("COSMOS_TOGGLE")
                      addAction("COSMOS_NEXT")
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      registerReceiver(mediaActionReceiver, filter, Context.RECEIVER_EXPORTED)
                  } else {
                      registerReceiver(mediaActionReceiver, filter)
                  }
              }

              private fun checkPermissionsAndScan() {
                  val perms = mutableListOf<String>()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      perms.add(Manifest.permission.READ_MEDIA_AUDIO)
                      perms.add(Manifest.permission.POST_NOTIFICATIONS)
                  } else {
                      perms.add(Manifest.permission.READ_EXTERNAL_STORAGE)
                  }
                  val missing = perms.filter { ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED }
                  if (missing.isNotEmpty()) {
                      ActivityCompat.requestPermissions(this, missing.toTypedArray(), 101)
                  } else {
                      scanDeviceMusic()
                  }
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  scanDeviceMusic()
              }

              private fun scanDeviceMusic() {
                  Thread {
                      val arr = JSONArray()
                      val scanned = mutableListOf<NativeTrack>()
                      val projection = arrayOf(
                          MediaStore.Audio.Media._ID,
                          MediaStore.Audio.Media.TITLE,
                          MediaStore.Audio.Media.ARTIST,
                          MediaStore.Audio.Media.ALBUM,
                          MediaStore.Audio.Media.ALBUM_ID,
                          MediaStore.Audio.Media.DURATION
                      )
                      contentResolver.query(
                          MediaStore.Audio.Media.EXTERNAL_CONTENT_URI,
                          projection,
                          "${MediaStore.Audio.Media.IS_MUSIC} != 0",
                          null,
                          "${MediaStore.Audio.Media.DATE_ADDED} DESC"
                      )?.use { cursor ->
                          val idCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media._ID)
                          val titleCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media.TITLE)
                          val artistCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media.ARTIST)
                          val albumCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media.ALBUM)
                          val albumIdCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media.ALBUM_ID)
                          val durCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media.DURATION)
                          var idx = 0
                          while (cursor.moveToNext()) {
                              val id = cursor.getLong(idCol)
                              val albumId = cursor.getLong(albumIdCol)
                              val durationMs = cursor.getLong(durCol)
                              val title = cursor.getString(titleCol) ?: "Pista"
                              val artist = cursor.getString(artistCol) ?: "Edward Belmont"
                              val album = cursor.getString(albumCol) ?: "COSMOS"

                              scanned.add(NativeTrack(idx, "ms_$id", id, title, artist, album, albumId, durationMs))

                              arr.put(JSONObject().apply {
                                  put("id", "ms_$id")
                                  put("mediaId", id)
                                  put("title", title)
                                  put("artist", artist)
                                  put("album", album)
                                  put("albumId", albumId)
                                  put("durationMs", durationMs)
                                  put("thumb", "https://cosmos.local/albumart/$albumId?thumb=1")
                                  put("cover", "https://cosmos.local/albumart/$albumId")
                              })
                              idx++
                          }
                      }
                      val jsonStr = arr.toString()
                      runOnUiThread {
                          trackList.clear()
                          trackList.addAll(scanned)
                          activeQueueIndices = trackList.indices.toMutableList()
                          evaluateJsSafely("window.onNativeLibraryLoaded(${JSONObject.quote(jsonStr)});")
                          if (trackList.isNotEmpty() && currentIndex == -1) {
                              loadTrackNative(0, false)
                          }
                      }
                  }.start()
              }

              inner class CosmosBridge {
                  @JavascriptInterface fun rescanMediaStore() { runOnUiThread { checkPermissionsAndScan() } }
                  @JavascriptInterface fun loadTrack(idx: Int, autoPlay: Boolean) { runOnUiThread { loadTrackNative(idx, autoPlay) } }
                  @JavascriptInterface fun togglePlay() { runOnUiThread { togglePlayNative() } }
                  @JavascriptInterface fun playAudio() { runOnUiThread { playNative() } }
                  @JavascriptInterface fun pauseAudio() { runOnUiThread { pauseNative() } }
                  @JavascriptInterface fun prevTrack() { runOnUiThread { prevTrackNative() } }
                  @JavascriptInterface fun nextTrack() { runOnUiThread { nextTrackNative() } }
                  @JavascriptInterface fun seekToPercent(pct: Double) { runOnUiThread { seekToPercentNative(pct) } }
                  @JavascriptInterface fun seekByDeltaMs(deltaMs: Int) { runOnUiThread { seekByDeltaMsNative(deltaMs) } }

                  @JavascriptInterface fun setShuffleAndRepeat(shuffle: Boolean, repeat: Int) {
                      runOnUiThread {
                          shuffleMode = shuffle
                          repeatMode = repeat
                      }
                  }

                  @JavascriptInterface fun setActiveQueue(jsonIndices: String) {
                      runOnUiThread {
                          try {
                              val arr = JSONArray(jsonIndices)
                              val list = mutableListOf<Int>()
                              for (i in 0 until arr.length()) {
                                  list.add(arr.getInt(i))
                              }
                              if (list.isNotEmpty()) activeQueueIndices = list
                          } catch (_: Exception) {}
                      }
                  }

                  @JavascriptInterface fun setEqBand(bandIdx: Int, dbVal: Int) {
                      runOnUiThread {
                          if (bandIdx in currentEqGainsDb.indices) {
                              currentEqGainsDb[bandIdx] = dbVal
                              applyEqGainsToHardware()
                          }
                      }
                  }

                  @JavascriptInterface fun setEqPresetGains(g0: Int, g1: Int, g2: Int, g3: Int, g4: Int) {
                      runOnUiThread {
                          currentEqGainsDb = intArrayOf(g0, g1, g2, g3, g4)
                          applyEqGainsToHardware()
                      }
                  }

                  @JavascriptInterface fun updateTrackMetadata(idx: Int, title: String, artist: String, album: String) {
                      runOnUiThread {
                          if (idx in trackList.indices) {
                              trackList[idx].title = title
                              trackList[idx].artist = artist
                              trackList[idx].album = album
                              if (idx == currentIndex) updateNotificationAndSession()
                          }
                      }
                  }

                  @JavascriptInterface fun shareTrackNative(mediaId: Long, title: String, artist: String, album: String) {
                      runOnUiThread {
                          try {
                              val shareIntent = Intent(Intent.ACTION_SEND)
                              if (mediaId > 0) {
                                  val contentUri = ContentUris.withAppendedId(MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, mediaId)
                                  shareIntent.type = "audio/*"
                                  shareIntent.putExtra(Intent.EXTRA_STREAM, contentUri)
                                  shareIntent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                              } else {
                                  shareIntent.type = "text/plain"
                              }
                              shareIntent.putExtra(Intent.EXTRA_SUBJECT, "$title - $artist")
                              shareIntent.putExtra(Intent.EXTRA_TEXT, "🎵 Escuchando \"$title\" de $artist ($album) en COSMOS • Belmont Edition")
                              startActivity(Intent.createChooser(shareIntent, "Compartir canción desde COSMOS"))
                          } catch (e: Exception) {
                              val fallback = Intent(Intent.ACTION_SEND).apply {
                                  type = "text/plain"
                                  putExtra(Intent.EXTRA_TEXT, "🎵 Escuchando \"$title\" de $artist ($album) en COSMOS • Belmont Edition")
                              }
                              startActivity(Intent.createChooser(fallback, "Compartir canción"))
                          }
                      }
                  }
              }

              private fun updateNotificationAndSession() {
                  if (currentIndex < 0 || currentIndex >= trackList.size) return
                  val track = trackList[currentIndex]
                  val isPlaying = isPlayerPrepared && (try { mediaPlayer?.isPlaying == true } catch (_: Exception) { false })
                  val positionMs = if (isPlayerPrepared) (try { mediaPlayer?.currentPosition?.toLong() ?: 0L } catch (_: Exception) { 0L }) else 0L
                  val durationMs = if (isPlayerPrepared) (try { mediaPlayer?.duration?.toLong() ?: track.durationMs } catch (_: Exception) { track.durationMs }) else track.durationMs
                  val artBitmap = currentArtBitmap ?: fallbackCosmosArt ?: Bitmap.createBitmap(128, 128, Bitmap.Config.ARGB_8888)

                  val state = if (isPlaying) PlaybackState.STATE_PLAYING else PlaybackState.STATE_PAUSED
                  val actions = PlaybackState.ACTION_PLAY or PlaybackState.ACTION_PAUSE or PlaybackState.ACTION_SKIP_TO_NEXT or PlaybackState.ACTION_SKIP_TO_PREVIOUS or PlaybackState.ACTION_SEEK_TO

                  mediaSession?.setPlaybackState(
                      PlaybackState.Builder()
                          .setActions(actions)
                          .setState(state, positionMs, if (isPlaying) 1.0f else 0f)
                          .build()
                  )

                  val metadata = MediaMetadata.Builder()
                      .putString(MediaMetadata.METADATA_KEY_TITLE, track.title)
                      .putString(MediaMetadata.METADATA_KEY_ARTIST, "${track.artist} • ${track.album}")
                      .putString(MediaMetadata.METADATA_KEY_ALBUM, "COSMOS • Belmont Edition")
                      .putLong(MediaMetadata.METADATA_KEY_DURATION, if (durationMs > 0) durationMs else -1L)
                      .putBitmap(MediaMetadata.METADATA_KEY_ALBUM_ART, artBitmap)
                      .build()
                  mediaSession?.setMetadata(metadata)

                  val openAppIntent = Intent(this, MainActivity::class.java).apply {
                      flags = Intent.FLAG_ACTIVITY_SINGLE_TOP
                  }
                  val contentPending = PendingIntent.getActivity(this, 0, openAppIntent, PendingIntent.FLAG_IMMUTABLE)
                  val prevPending = PendingIntent.getBroadcast(this, 1, Intent("COSMOS_PREV"), PendingIntent.FLAG_IMMUTABLE)
                  val togglePending = PendingIntent.getBroadcast(this, 2, Intent("COSMOS_TOGGLE"), PendingIntent.FLAG_IMMUTABLE)
                  val nextPending = PendingIntent.getBroadcast(this, 3, Intent("COSMOS_NEXT"), PendingIntent.FLAG_IMMUTABLE)

                  val playPauseIcon = if (isPlaying) R.drawable.ic_action_pause else R.drawable.ic_action_play

                  val prevAction = Notification.Action.Builder(Icon.createWithResource(this, R.drawable.ic_action_prev), "Anterior", prevPending).build()
                  val playAction = Notification.Action.Builder(Icon.createWithResource(this, playPauseIcon), if (isPlaying) "Pausa" else "Play", togglePending).build()
                  val nextAction = Notification.Action.Builder(Icon.createWithResource(this, R.drawable.ic_action_next), "Siguiente", nextPending).build()

                  val mediaStyle = Notification.MediaStyle()
                      .setMediaSession(mediaSession?.sessionToken)
                      .setShowActionsInCompactView(0, 1, 2)

                  val notification = Notification.Builder(this, CHANNEL_ID)
                      .setSmallIcon(R.drawable.ic_cosmos_notif)
                      .setLargeIcon(artBitmap)
                      .setContentTitle(track.title)
                      .setContentText("${track.artist} • ${track.album}")
                      .setSubText("COSMOS")
                      .setContentIntent(contentPending)
                      .setOngoing(isPlaying)
                      .setVisibility(Notification.VISIBILITY_PUBLIC)
                      .setColor(Color.parseColor("#6b21a8"))
                      .setColorized(true)
                      .addAction(prevAction)
                      .addAction(playAction)
                      .addAction(nextAction)
                      .setStyle(mediaStyle)
                      .build()

                  latestNotification = notification
                  getSystemService(NotificationManager::class.java).notify(777, notification)

                  if (!isForegroundServiceStarted) {
                      isForegroundServiceStarted = true
                      val serviceIntent = Intent(this, CosmosPlaybackService::class.java)
                      try {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              startForegroundService(serviceIntent)
                          } else {
                              startService(serviceIntent)
                          }
                      } catch (_: Exception) {}
                  }
              }

              override fun onResume() {
                  super.onResume()
                  isUiVisible = true
                  webView.onResume()
                  webView.resumeTimers()
                  syncFullTrackToWeb()
              }

              override fun onPause() {
                  isUiVisible = false
                  super.onPause()
              }

              override fun onDestroy() {
                  uiHandler.removeCallbacksAndMessages(null)
                  try {
                      hardwareEq?.release()
                      mediaPlayer?.release()
                  } catch (_: Exception) {}
                  unregisterReceiver(mediaActionReceiver)
                  mediaSession?.release()
                  super.onDestroy()
              }
          }
