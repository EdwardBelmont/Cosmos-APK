name: Compilar COSMOS APK Nativo

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Codigo Base
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Android SDK Unificado
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          rm tools.zip
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Compilar COSMOS 5.0 Motor 100% Nativo
        run: |
          mkdir -p app/src/main/java/com/belmont/cosmos app/src/main/assets app/src/main/res/values app/src/main/res/drawable app/src/main/res/mipmap-xxhdpi

          for img in ic_launcher.png app/src/main/res/drawable/ic_launcher.png; do
            if [ -f "$img" ]; then
              cp "$img" app/src/main/res/drawable/ic_launcher.png
              cp "$img" app/src/main/res/mipmap-xxhdpi/ic_launcher.png
              cp "$img" app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
              cp "$img" app/src/main/assets/ic_launcher.png
              break
            fi
          done

          for sp in splash_bg.png app/src/main/res/drawable/splash_bg.png; do
            if [ -f "$sp" ]; then
              cp "$sp" app/src/main/res/drawable/splash_bg.png
              cp "$sp" app/src/main/assets/splash_bg.png
              break
            fi
          done

          cat << 'EOF' > app/src/main/res/drawable/ic_cosmos_notif.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="100" android:viewportHeight="100">
            <path android:fillColor="#FFFFFF" android:pathData="M50,8 L16,62 L34,62 L50,32 L66,62 L84,62 Z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M36,58 L50,92 L64,58 L50,68 Z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M50,39 L56,50 L50,61 L44,50 Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_action_prev.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="28dp" android:height="28dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFF" android:pathData="M6,6c0.55,0 1,0.45 1,1v10c0,0.55 -0.45,1 -1,1s-1,-0.45 -1,-1V7C5,6.45 5.45,6 6,6zM9.5,12l8.5,6V6L9.5,12z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_action_play.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="32dp" android:height="32dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFF" android:pathData="M8,6.82v10.36c0,0.79 0.87,1.27 1.54,0.84l8.14,-5.18c0.62,-0.39 0.62,-1.29 0,-1.69L9.54,5.98C8.87,5.55 8,6.03 8,6.82z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_action_pause.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="32dp" android:height="32dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFF" android:pathData="M8,19c1.1,0 2,-0.9 2,-2V7c0,-1.1 -0.9,-2 -2,-2S6,5.9 6,7v10C6,18.1 6.9,19 8,19zM16,5c-1.1,0 -2,0.9 -2,2v10c0,1.1 0.9,2 2,2s2,-0.9 2,-2V7C18,5.9 17.1,5 16,5z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_action_next.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="28dp" android:height="28dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFF" android:pathData="M18,6c-0.55,0 -1,0.45 -1,1v10c0,0.55 0.45,1 1,1s1,-0.45 1,-1V7C19,6.45 18.55,6 18,6zM14.5,12L6,6v12L14.5,12z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <style name="Theme.CosmosSplash" parent="android:Theme.DeviceDefault.NoActionBar">
              <item name="android:windowBackground">#040109</item>
              <item name="android:statusBarColor">#040109</item>
              <item name="android:navigationBarColor">#040109</item>
            </style>
          </resources>
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          rootProject.name = "COSMOS"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
            id 'com.android.application' version '8.2.2' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
          }
          android {
            namespace 'com.belmont.cosmos'
            compileSdk 34
            defaultConfig {
              applicationId "com.belmont.cosmos"
              minSdk 26
              targetSdk 34
              versionCode 5
              versionName "5.0-NATIVE"
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.activity:activity-ktx:1.8.2'
            implementation 'androidx.media:media:1.7.0'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.WAKE_LOCK" />
            <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
            <uses-permission android:name="android.permission.BLUETOOTH" />
            <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
            <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
            <application
              android:label="COSMOS"
              android:icon="@mipmap/ic_launcher"
              android:roundIcon="@mipmap/ic_launcher_round"
              android:theme="@style/Theme.CosmosSplash"
              android:hardwareAccelerated="true"
              android:largeHeap="true"
              android:usesCleartextTraffic="true">
              <activity
                android:name=".MainActivity"
                android:exported="true"
                android:launchMode="singleTask"
                android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
              <service
                android:name=".CosmosPlaybackService"
                android:enabled="true"
                android:exported="false"
                android:stopWithTask="false"
                android:foregroundServiceType="mediaPlayback" />
            </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/belmont/cosmos/CosmosPlaybackService.kt
          package com.belmont.cosmos

          import android.app.Notification
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.IBinder
          import android.os.PowerManager
          import android.os.Process

          class CosmosPlaybackService : Service() {
            private var wakeLock: PowerManager.WakeLock? = null
            override fun onCreate() {
              super.onCreate()
              try { Process.setThreadPriority(Process.THREAD_PRIORITY_URGENT_AUDIO) } catch (_: Exception) {}
              val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
              wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "Cosmos::NativeAudioLock").apply { setReferenceCounted(false) }
            }
            override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
              val isPlaying = intent?.getBooleanExtra("IS_PLAYING", true) ?: true
              if (isPlaying && wakeLock?.isHeld == false) wakeLock?.acquire(12 * 60 * 60 * 1000L)
              val notif: Notification? = MainActivity.latestNotification
              if (notif != null) {
                try {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                    startForeground(777, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK)
                  } else {
                    startForeground(777, notif)
                  }
                } catch (_: Exception) {}
              }
              return START_STICKY
            }
            override fun onDestroy() {
              if (wakeLock?.isHeld == true) wakeLock?.release()
              super.onDestroy()
            }
            override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/belmont/cosmos/MainActivity.kt
          package com.belmont.cosmos

          import android.Manifest
          import android.app.*
          import android.content.*
          import android.content.pm.PackageManager
          import android.graphics.*
          import android.graphics.drawable.Icon
          import android.media.*
          import android.media.audiofx.Equalizer
          import android.media.session.MediaSession
          import android.media.session.PlaybackState
          import android.net.Uri
          import android.os.*
          import android.provider.MediaStore
          import android.provider.Settings
          import android.util.LruCache
          import android.view.View
          import android.webkit.*
          import androidx.activity.ComponentActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.BufferedInputStream
          import java.io.ByteArrayInputStream
          import java.io.ByteArrayOutputStream

          data class NativeTrack(
            val index: Int, val id: String, val mediaId: Long,
            var title: String, var artist: String, var album: String,
            val albumId: Long, val durationMs: Long
          )

          class MainActivity : ComponentActivity() {
            companion object { var latestNotification: Notification? = null }
            private lateinit var webView: WebView
            private var mediaSession: MediaSession? = null
            private lateinit var audioManager: AudioManager
            private var focusRequest: AudioFocusRequest? = null
            private val CHANNEL_ID = "cosmos_native_channel"
            private var fallbackCosmosArt: Bitmap? = null
            private var fallbackThumbBytes: ByteArray? = null

            private var mediaPlayer: MediaPlayer? = null
            private var hardwareEq: Equalizer? = null
            private var currentEqSessionId: Int = -1
            private var currentEqGainsDb = intArrayOf(5, 2, 0, 4, 6)
            private var isPlayerPrepared = false

            private val trackList = mutableListOf<NativeTrack>()
            private var activeQueueIndices = mutableListOf<Int>()
            private var currentIndex: Int = -1
            private var shuffleMode: Boolean = false
            private var repeatMode: Int = 0
            private var currentArtBitmap: Bitmap? = null

            private val uiHandler = Handler(Looper.getMainLooper())
            private var isUiVisible = true

            private val progressRunnable = object : Runnable {
              override fun run() {
                if (isUiVisible && isPlayerPrepared && mediaPlayer?.isPlaying == true) syncProgressToWeb()
                uiHandler.postDelayed(this, 400L)
              }
            }

            private val thumbCache = object : LruCache<Long, ByteArray>(12 * 1024 * 1024) {
              override fun sizeOf(key: Long, value: ByteArray): Int = value.size
            }

            private val mediaActionReceiver = object : BroadcastReceiver() {
              override fun onReceive(context: Context?, intent: Intent?) {
                when (intent?.action) {
                  "COSMOS_PREV" -> prevTrackNative()
                  "COSMOS_TOGGLE" -> togglePlayNative()
                  "COSMOS_NEXT" -> nextTrackNative()
                  AudioManager.ACTION_AUDIO_BECOMING_NOISY -> pauseNative()
                }
              }
            }

            override fun onCreate(savedInstanceState: Bundle?) {
              super.onCreate(savedInstanceState)
              window.statusBarColor = Color.parseColor("#040109")
              window.navigationBarColor = Color.parseColor("#040109")
              audioManager = getSystemService(Context.AUDIO_SERVICE) as AudioManager
              fallbackCosmosArt = createCosmosPurpleArtwork()
              currentArtBitmap = fallbackCosmosArt
              fallbackThumbBytes = bitmapToJpegBytes(Bitmap.createScaledBitmap(fallbackCosmosArt!!, 140, 140, true), 82)

              setupMediaSessionAndChannel()
              requestBatteryOptimizationExemption()

              webView = WebView(this)
              webView.setLayerType(View.LAYER_TYPE_HARDWARE, null)
              setContentView(webView)

              webView.settings.apply {
                javaScriptEnabled = true
                domStorageEnabled = true
                mediaPlaybackRequiresUserGesture = false
                allowFileAccess = true
                allowContentAccess = true
                cacheMode = WebSettings.LOAD_DEFAULT
              }
              webView.webChromeClient = WebChromeClient()
              webView.webViewClient = object : WebViewClient() {
                override fun shouldInterceptRequest(view: WebView?, request: WebResourceRequest?): WebResourceResponse? {
                  val uriObj = request?.url ?: return null
                  if (uriObj.toString().startsWith("https://cosmos.local/albumart/")) {
                    val albumId = uriObj.lastPathSegment?.toLongOrNull() ?: return null
                    return serveAlbumArtFast(albumId, uriObj.getQueryParameter("thumb") == "1")
                  }
                  return super.shouldInterceptRequest(view, request)
                }
              }
              webView.addJavascriptInterface(CosmosBridge(), "CosmosNative")
              webView.loadUrl("file:///android_asset/index.html")
              uiHandler.postDelayed(progressRunnable, 500L)
            }

            private fun loadTrackNative(index: Int, autoPlay: Boolean) {
              if (index < 0 || index >= trackList.size) return
              currentIndex = index
              val track = trackList[index]
              try {
                isPlayerPrepared = false
                if (mediaPlayer == null) {
                  mediaPlayer = MediaPlayer().apply {
                    setWakeMode(applicationContext, PowerManager.PARTIAL_WAKE_LOCK)
                    setAudioAttributes(AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_MEDIA).setContentType(AudioAttributes.CONTENT_TYPE_MUSIC).build())
                    setOnCompletionListener { onNativeTrackCompleted() }
                    setOnErrorListener { _, _, _ -> isPlayerPrepared = false; true }
                  }
                } else {
                  mediaPlayer?.reset()
                  mediaPlayer?.setWakeMode(applicationContext, PowerManager.PARTIAL_WAKE_LOCK)
                  mediaPlayer?.setAudioAttributes(AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_MEDIA).setContentType(AudioAttributes.CONTENT_TYPE_MUSIC).build())
                }
                val contentUri = ContentUris.withAppendedId(MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, track.mediaId)
                mediaPlayer?.setDataSource(applicationContext, contentUri)
                mediaPlayer?.prepare()
                isPlayerPrepared = true
                setupHardwareEqualizer(mediaPlayer!!.audioSessionId)
                if (autoPlay) {
                  requestCosmosAudioFocus()
                  mediaPlayer?.start()
                }
                syncFullTrackToWeb()
                Thread {
                  currentArtBitmap = loadAlbumArtBitmap(track.albumId)
                  runOnUiThread { updateNotificationAndSession() }
                }.start()
              } catch (e: Exception) { e.printStackTrace() }
            }

            private fun playNative() {
              if (!isPlayerPrepared) {
                if (trackList.isNotEmpty()) loadTrackNative(if (currentIndex >= 0) currentIndex else 0, true)
                return
              }
              try {
                requestCosmosAudioFocus()
                if (mediaPlayer?.isPlaying == false) mediaPlayer?.start()
                syncFullTrackToWeb()
                updateNotificationAndSession()
              } catch (_: Exception) {}
            }

            private fun pauseNative() {
              if (!isPlayerPrepared) return
              try {
                if (mediaPlayer?.isPlaying == true) mediaPlayer?.pause()
                syncFullTrackToWeb()
                updateNotificationAndSession()
              } catch (_: Exception) {}
            }

            private fun togglePlayNative() {
              if (!isPlayerPrepared) { playNative(); return }
              if (mediaPlayer?.isPlaying == true) pauseNative() else playNative()
            }

            private fun seekToPercentNative(percent: Double) {
              if (!isPlayerPrepared) return
              try {
                val mp = mediaPlayer ?: return
                val dur = mp.duration
                if (dur > 0) {
                  val targetMs = ((percent.coerceIn(0.0, 100.0) / 100.0) * dur).toInt()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) mp.seekTo(targetMs.toLong(), MediaPlayer.SEEK_CLOSEST_SYNC)
                  else mp.seekTo(targetMs)
                  syncProgressToWeb()
                  updateNotificationAndSession()
                }
              } catch (_: Exception) {}
            }

            private fun seekToMsNative(targetMs: Long) {
              if (!isPlayerPrepared) return
              try {
                val mp = mediaPlayer ?: return
                val dur = mp.duration
                if (dur > 0) {
                  val clamped = targetMs.coerceIn(0L, dur.toLong())
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) mp.seekTo(clamped, MediaPlayer.SEEK_CLOSEST_SYNC)
                  else mp.seekTo(clamped.toInt())
                  syncProgressToWeb()
                  updateNotificationAndSession()
                }
              } catch (_: Exception) {}
            }

            private fun seekByDeltaMsNative(deltaMs: Int) {
              if (!isPlayerPrepared) return
              try {
                val mp = mediaPlayer ?: return
                val dur = mp.duration
                if (dur > 0) {
                  val target = (mp.currentPosition + deltaMs).coerceIn(0, dur)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) mp.seekTo(target.toLong(), MediaPlayer.SEEK_CLOSEST_SYNC)
                  else mp.seekTo(target)
                  syncProgressToWeb()
                  updateNotificationAndSession()
                }
              } catch (_: Exception) {}
            }

            private fun prevTrackNative() {
              if (trackList.isEmpty()) return
              if (isPlayerPrepared && (mediaPlayer?.currentPosition ?: 0) > 3500) { seekToMsNative(0L); return }
              val queue = if (activeQueueIndices.isNotEmpty()) activeQueueIndices else trackList.indices.toList()
              if (queue.isEmpty()) return
              val pos = queue.indexOf(currentIndex)
              loadTrackNative(if (pos > 0) queue[pos - 1] else queue.last(), true)
            }

            private fun nextTrackNative() {
              if (trackList.isEmpty()) return
              val queue = if (activeQueueIndices.isNotEmpty()) activeQueueIndices else trackList.indices.toList()
              if (queue.isEmpty()) return
              val nextIdx = if (shuffleMode) queue.random() else {
                val pos = queue.indexOf(currentIndex)
                if (pos >= 0 && pos + 1 < queue.size) queue[pos + 1] else queue.first()
              }
              loadTrackNative(nextIdx, true)
            }

            private fun onNativeTrackCompleted() {
              if (trackList.isEmpty()) return
              if (repeatMode == 2) { seekToMsNative(0L); playNative(); return }
              nextTrackNative()
            }

            private fun setupHardwareEqualizer(sessionId: Int) {
              try {
                if (hardwareEq == null || currentEqSessionId != sessionId) {
                  hardwareEq?.release()
                  hardwareEq = Equalizer(0, sessionId).apply { enabled = true }
                  currentEqSessionId = sessionId
                }
                applyEqGainsToHardware()
              } catch (_: Exception) {}
            }

            private fun applyEqGainsToHardware() {
              try {
                val eq = hardwareEq ?: return
                val numBands = eq.numberOfBands.toInt()
                val minMb = eq.bandLevelRange[0].toInt()
                val maxMb = eq.bandLevelRange[1].toInt()
                for (b in 0 until numBands) {
                  val gainIdx = (b * currentEqGainsDb.size) / numBands
                  val dbVal = currentEqGainsDb[gainIdx.coerceIn(0, currentEqGainsDb.size - 1)]
                  eq.setBandLevel(b.toShort(), (dbVal * 100).coerceIn(minMb, maxMb).toShort())
                }
              } catch (_: Exception) {}
            }

            private fun syncFullTrackToWeb() {
              if (currentIndex < 0 || currentIndex >= trackList.size) return
              val playing = isPlayerPrepared && (mediaPlayer?.isPlaying == true)
              val posMs = if (isPlayerPrepared) (mediaPlayer?.currentPosition ?: 0) else 0
              val durMs = if (isPlayerPrepared) (mediaPlayer?.duration ?: trackList[currentIndex].durationMs.toInt()) else trackList[currentIndex].durationMs.toInt()
              webView.evaluateJavascript("window.onNativeTrackState($currentIndex, $playing, $posMs, $durMs);", null)
            }

            private fun syncProgressToWeb() {
              if (!isPlayerPrepared) return
              val playing = mediaPlayer?.isPlaying == true
              val posMs = mediaPlayer?.currentPosition ?: 0
              val durMs = mediaPlayer?.duration ?: 0
              webView.evaluateJavascript("window.onNativeProgress($posMs, $durMs, $playing);", null)
            }

            private fun requestBatteryOptimizationExemption() {
              try {
                val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                if (!pm.isIgnoringBatteryOptimizations(packageName)) {
                  startActivity(Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS).apply { data = Uri.parse("package:$packageName") })
                }
              } catch (_: Exception) {}
            }

            private fun bitmapToJpegBytes(bmp: Bitmap, quality: Int): ByteArray {
              val baos = ByteArrayOutputStream()
              bmp.compress(Bitmap.CompressFormat.JPEG, quality, baos)
              return baos.toByteArray()
            }

            private fun serveAlbumArtFast(albumId: Long, isThumb: Boolean): WebResourceResponse? {
              val headers = mapOf("Access-Control-Allow-Origin" to "*", "Cache-Control" to "max-age=31536000, immutable")
              if (isThumb) {
                thumbCache.get(albumId)?.let { return WebResourceResponse("image/jpeg", null, 200, "OK", headers, ByteArrayInputStream(it)) }
                val artUri = ContentUris.withAppendedId(Uri.parse("content://media/external/audio/albumart"), albumId)
                try {
                  contentResolver.openInputStream(artUri)?.use { s ->
                    val decoded = BitmapFactory.decodeStream(s, null, BitmapFactory.Options().apply { inSampleSize = 4 })
                    if (decoded != null) {
                      val bytes = bitmapToJpegBytes(Bitmap.createScaledBitmap(decoded, 140, 140, true), 82)
                      thumbCache.put(albumId, bytes)
                      return WebResourceResponse("image/jpeg", null, 200, "OK", headers, ByteArrayInputStream(bytes))
                    }
                  }
                } catch (_: Exception) {}
                val fb = fallbackThumbBytes ?: return null
                thumbCache.put(albumId, fb)
                return WebResourceResponse("image/jpeg", null, 200, "OK", headers, ByteArrayInputStream(fb))
              } else {
                val artUri = ContentUris.withAppendedId(Uri.parse("content://media/external/audio/albumart"), albumId)
                return try {
                  val s = contentResolver.openInputStream(artUri) ?: return null
                  WebResourceResponse("image/jpeg", null, 200, "OK", headers, BufferedInputStream(s, 65536))
                } catch (_: Exception) {
                  val fb = fallbackThumbBytes ?: return null
                  WebResourceResponse("image/jpeg", null, 200, "OK", headers, ByteArrayInputStream(fb))
                }
              }
            }

            private fun requestCosmosAudioFocus() {
              val attrs = AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_MEDIA).setContentType(AudioAttributes.CONTENT_TYPE_MUSIC).build()
              focusRequest = AudioFocusRequest.Builder(AudioManager.AUDIOFOCUS_GAIN)
                .setAudioAttributes(attrs).setAcceptsDelayedFocusGain(true).setWillPauseWhenDucked(false)
                .setOnAudioFocusChangeListener { change ->
                  when (change) {
                    AudioManager.AUDIOFOCUS_LOSS_TRANSIENT_CAN_DUCK -> try { mediaPlayer?.setVolume(0.35f, 0.35f) } catch (_: Exception) {}
                    AudioManager.AUDIOFOCUS_GAIN -> try { mediaPlayer?.setVolume(1.0f, 1.0f) } catch (_: Exception) {}
                    AudioManager.AUDIOFOCUS_LOSS -> pauseNative()
                  }
                }.build()
              focusRequest?.let { audioManager.requestAudioFocus(it) }
            }

            private fun createCosmosPurpleArtwork(): Bitmap {
              val bmp = Bitmap.createBitmap(512, 512, Bitmap.Config.ARGB_8888)
              val canvas = Canvas(bmp)
              val paint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                shader = LinearGradient(0f, 0f, 512f, 512f, intArrayOf(Color.parseColor("#3b0764"), Color.parseColor("#7e22ce"), Color.parseColor("#1e0536")), floatArrayOf(0f, 0.5f, 1f), Shader.TileMode.CLAMP)
              }
              canvas.drawRect(0f, 0f, 512f, 512f, paint)
              try {
                assets.open("ic_launcher.png").use { s ->
                  BitmapFactory.decodeStream(s)?.let { canvas.drawBitmap(Bitmap.createScaledBitmap(it, 340, 340, true), 86f, 86f, null) }
                }
              } catch (_: Exception) {}
              return bmp
            }

            private fun loadAlbumArtBitmap(albumId: Long): Bitmap {
              if (albumId >= 0) {
                try {
                  val artUri = ContentUris.withAppendedId(Uri.parse("content://media/external/audio/albumart"), albumId)
                  contentResolver.openInputStream(artUri)?.use { s ->
                    BitmapFactory.decodeStream(s)?.let { decoded ->
                      val copy = decoded.copy(Bitmap.Config.ARGB_8888, true)
                      Canvas(copy).drawRect(0f, 0f, copy.width.toFloat(), copy.height.toFloat(), Paint().apply { color = Color.argb(45, 126, 34, 206) })
                      return copy
                    }
                  }
                } catch (_: Exception) {}
              }
              return fallbackCosmosArt ?: Bitmap.createBitmap(64, 64, Bitmap.Config.ARGB_8888)
            }

            private fun setupMediaSessionAndChannel() {
              val channel = NotificationChannel(CHANNEL_ID, "COSMOS Native Audio", NotificationManager.IMPORTANCE_LOW).apply { setShowBadge(false) }
              getSystemService(NotificationManager::class.java).createNotificationChannel(channel)
              mediaSession = MediaSession(this, "CosmosNativeSession").apply {
                setCallback(object : MediaSession.Callback() {
                  override fun onPlay() { runOnUiThread { playNative() } }
                  override fun onPause() { runOnUiThread { pauseNative() } }
                  override fun onSkipToNext() { runOnUiThread { nextTrackNative() } }
                  override fun onSkipToPrevious() { runOnUiThread { prevTrackNative() } }
                  override fun onSeekTo(pos: Long) { runOnUiThread { seekToMsNative(pos) } }
                })
                isActive = true
              }
              val filter = IntentFilter().apply {
                addAction("COSMOS_PREV"); addAction("COSMOS_TOGGLE"); addAction("COSMOS_NEXT"); addAction(AudioManager.ACTION_AUDIO_BECOMING_NOISY)
              }
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) registerReceiver(mediaActionReceiver, filter, Context.RECEIVER_EXPORTED)
              else registerReceiver(mediaActionReceiver, filter)
            }

            private fun checkPermissionsAndScan() {
              val perms = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) listOf(Manifest.permission.READ_MEDIA_AUDIO, Manifest.permission.POST_NOTIFICATIONS)
              else listOf(Manifest.permission.READ_EXTERNAL_STORAGE)
              val missing = perms.filter { ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED }
              if (missing.isNotEmpty()) ActivityCompat.requestPermissions(this, missing.toTypedArray(), 101) else scanDeviceMusic()
            }

            override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
              super.onRequestPermissionsResult(requestCode, permissions, grantResults)
              scanDeviceMusic()
            }

            private fun scanDeviceMusic() {
              Thread {
                val arr = JSONArray()
                val scanned = mutableListOf<NativeTrack>()
                val proj = arrayOf(MediaStore.Audio.Media._ID, MediaStore.Audio.Media.TITLE, MediaStore.Audio.Media.ARTIST, MediaStore.Audio.Media.ALBUM, MediaStore.Audio.Media.ALBUM_ID, MediaStore.Audio.Media.DURATION)
                contentResolver.query(MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, proj, "${MediaStore.Audio.Media.IS_MUSIC} != 0", null, "${MediaStore.Audio.Media.DATE_ADDED} DESC")?.use { c ->
                  val idC = c.getColumnIndexOrThrow(MediaStore.Audio.Media._ID)
                  val titC = c.getColumnIndexOrThrow(MediaStore.Audio.Media.TITLE)
                  val artC = c.getColumnIndexOrThrow(MediaStore.Audio.Media.ARTIST)
                  val albC = c.getColumnIndexOrThrow(MediaStore.Audio.Media.ALBUM)
                  val albIdC = c.getColumnIndexOrThrow(MediaStore.Audio.Media.ALBUM_ID)
                  val durC = c.getColumnIndexOrThrow(MediaStore.Audio.Media.DURATION)
                  var idx = 0
                  while (c.moveToNext()) {
                    val id = c.getLong(idC)
                    val albumId = c.getLong(albIdC)
                    val durationMs = c.getLong(durC)
                    val title = c.getString(titC) ?: "Pista"
                    val artist = c.getString(artC) ?: "Edward Belmont"
                    val album = c.getString(albC) ?: "COSMOS"
                    scanned.add(NativeTrack(idx, "ms_$id", id, title, artist, album, albumId, durationMs))
                    arr.put(JSONObject().apply {
                      put("id", "ms_$id"); put("mediaId", id); put("title", title); put("artist", artist); put("album", album)
                      put("albumId", albumId); put("durationMs", durationMs)
                      put("thumb", "https://cosmos.local/albumart/$albumId?thumb=1")
                      put("cover", "https://cosmos.local/albumart/$albumId")
                    })
                    idx++
                  }
                }
                val jsonStr = arr.toString()
                runOnUiThread {
                  trackList.clear(); trackList.addAll(scanned)
                  activeQueueIndices = trackList.indices.toMutableList()
                  webView.evaluateJavascript("window.onNativeLibraryLoaded(${JSONObject.quote(jsonStr)});", null)
                  if (trackList.isNotEmpty() && currentIndex == -1) loadTrackNative(0, false)
                }
              }.start()
            }

            inner class CosmosBridge {
              @JavascriptInterface fun rescanMediaStore() { runOnUiThread { checkPermissionsAndScan() } }
              @JavascriptInterface fun loadTrack(idx: Int, autoPlay: Boolean) { runOnUiThread { loadTrackNative(idx, autoPlay) } }
              @JavascriptInterface fun togglePlay() { runOnUiThread { togglePlayNative() } }
              @JavascriptInterface fun playAudio() { runOnUiThread { playNative() } }
              @JavascriptInterface fun pauseAudio() { runOnUiThread { pauseNative() } }
              @JavascriptInterface fun prevTrack() { runOnUiThread { prevTrackNative() } }
              @JavascriptInterface fun nextTrack() { runOnUiThread { nextTrackNative() } }
              @JavascriptInterface fun seekToPercent(pct: Double) { runOnUiThread { seekToPercentNative(pct) } }
              @JavascriptInterface fun seekByDeltaMs(deltaMs: Int) { runOnUiThread { seekByDeltaMsNative(deltaMs) } }
              @JavascriptInterface fun setShuffleAndRepeat(shuffle: Boolean, repeat: Int) { runOnUiThread { shuffleMode = shuffle; repeatMode = repeat } }
              @JavascriptInterface fun setActiveQueue(jsonIndices: String) {
                runOnUiThread {
                  try {
                    val arr = JSONArray(jsonIndices)
                    val list = mutableListOf<Int>()
                    for (i in 0 until arr.length()) list.add(arr.getInt(i))
                    if (list.isNotEmpty()) activeQueueIndices = list
                  } catch (_: Exception) {}
                }
              }
              @JavascriptInterface fun setEqBand(bandIdx: Int, dbVal: Int) {
                runOnUiThread { if (bandIdx in currentEqGainsDb.indices) { currentEqGainsDb[bandIdx] = dbVal; applyEqGainsToHardware() } }
              }
              @JavascriptInterface fun setEqPresetGains(g0: Int, g1: Int, g2: Int, g3: Int, g4: Int) {
                runOnUiThread { currentEqGainsDb = intArrayOf(g0, g1, g2, g3, g4); applyEqGainsToHardware() }
              }
              @JavascriptInterface fun updateTrackMetadata(idx: Int, title: String, artist: String, album: String) {
                runOnUiThread {
                  if (idx in trackList.indices) {
                    trackList[idx].title = title; trackList[idx].artist = artist; trackList[idx].album = album
                    if (idx == currentIndex) updateNotificationAndSession()
                  }
                }
              }
              @JavascriptInterface fun shareTrackNative(mediaId: Long, title: String, artist: String, album: String) {
                runOnUiThread {
                  try {
                    val si = Intent(Intent.ACTION_SEND)
                    if (mediaId > 0) {
                      si.type = "audio/*"
                      si.putExtra(Intent.EXTRA_STREAM, ContentUris.withAppendedId(MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, mediaId))
                      si.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                    } else si.type = "text/plain"
                    si.putExtra(Intent.EXTRA_TEXT, "🎵 Escuchando \"$title\" de $artist ($album) en COSMOS • Belmont Edition")
                    startActivity(Intent.createChooser(si, "Compartir canción desde COSMOS"))
                  } catch (_: Exception) {}
                }
              }
            }

            private fun updateNotificationAndSession() {
              if (currentIndex < 0 || currentIndex >= trackList.size) return
              val track = trackList[currentIndex]
              val isPlaying = isPlayerPrepared && (mediaPlayer?.isPlaying == true)
              val posMs = if (isPlayerPrepared) (mediaPlayer?.currentPosition?.toLong() ?: 0L) else 0L
              val durMs = if (isPlayerPrepared) (mediaPlayer?.duration?.toLong() ?: track.durationMs) else track.durationMs
              val artBitmap = currentArtBitmap ?: fallbackCosmosArt ?: Bitmap.createBitmap(64, 64, Bitmap.Config.ARGB_8888)

              val state = if (isPlaying) PlaybackState.STATE_PLAYING else PlaybackState.STATE_PAUSED
              val actions = PlaybackState.ACTION_PLAY or PlaybackState.ACTION_PAUSE or PlaybackState.ACTION_SKIP_TO_NEXT or PlaybackState.ACTION_SKIP_TO_PREVIOUS or PlaybackState.ACTION_SEEK_TO
              mediaSession?.setPlaybackState(PlaybackState.Builder().setActions(actions).setState(state, posMs, if (isPlaying) 1.0f else 0f).build())
              mediaSession?.setMetadata(MediaMetadata.Builder()
                .putString(MediaMetadata.METADATA_KEY_TITLE, track.title)
                .putString(MediaMetadata.METADATA_KEY_ARTIST, "${track.artist} • ${track.album}")
                .putString(MediaMetadata.METADATA_KEY_ALBUM, "COSMOS • Belmont Edition")
                .putLong(MediaMetadata.METADATA_KEY_DURATION, if (durMs > 0) durMs else -1L)
                .putBitmap(MediaMetadata.METADATA_KEY_ALBUM_ART, artBitmap)
                .putBitmap(MediaMetadata.METADATA_KEY_DISPLAY_ICON, artBitmap).build())

              val contentPending = PendingIntent.getActivity(this, 0, Intent(this, MainActivity::class.java).apply { flags = Intent.FLAG_ACTIVITY_SINGLE_TOP }, PendingIntent.FLAG_IMMUTABLE)
              val prevPending = PendingIntent.getBroadcast(this, 1, Intent("COSMOS_PREV"), PendingIntent.FLAG_IMMUTABLE)
              val togglePending = PendingIntent.getBroadcast(this, 2, Intent("COSMOS_TOGGLE"), PendingIntent.FLAG_IMMUTABLE)
              val nextPending = PendingIntent.getBroadcast(this, 3, Intent("COSMOS_NEXT"), PendingIntent.FLAG_IMMUTABLE)
              val playPauseIcon = if (isPlaying) R.drawable.ic_action_pause else R.drawable.ic_action_play

              val notification = Notification.Builder(this, CHANNEL_ID)
                .setSmallIcon(R.drawable.ic_cosmos_notif)
                .setLargeIcon(artBitmap)
                .setContentTitle(track.title)
                .setContentText("${track.artist} • ${track.album}")
                .setSubText("COSMOS")
                .setContentIntent(contentPending)
                .setOngoing(isPlaying)
                .setVisibility(Notification.VISIBILITY_PUBLIC)
                .setColor(Color.parseColor("#6b21a8"))
                .setColorized(true)
                .addAction(Notification.Action.Builder(Icon.createWithResource(this, R.drawable.ic_action_prev), "Anterior", prevPending).build())
                .addAction(Notification.Action.Builder(Icon.createWithResource(this, playPauseIcon), if (isPlaying) "Pausa" else "Play", togglePending).build())
                .addAction(Notification.Action.Builder(Icon.createWithResource(this, R.drawable.ic_action_next), "Siguiente", nextPending).build())
                .setStyle(Notification.MediaStyle().setMediaSession(mediaSession?.sessionToken).setShowActionsInCompactView(0, 1, 2))
                .build()

              latestNotification = notification
              getSystemService(NotificationManager::class.java).notify(777, notification)
              val sIntent = Intent(this, CosmosPlaybackService::class.java).apply { putExtra("IS_PLAYING", isPlaying) }
              try {
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(sIntent) else startService(sIntent)
              } catch (_: Exception) {}
            }

            override fun onResume() { super.onResume(); isUiVisible = true; syncFullTrackToWeb() }
            override fun onPause() { super.onPause(); isUiVisible = false }
            override fun onDestroy() {
              uiHandler.removeCallbacksAndMessages(null)
              try { hardwareEq?.release(); mediaPlayer?.release() } catch (_: Exception) {}
              unregisterReceiver(mediaActionReceiver)
              mediaSession?.release()
              super.onDestroy()
            }
          }
