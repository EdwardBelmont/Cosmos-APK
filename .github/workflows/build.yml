                  <div style="display:flex;align-items:center;gap:8px;font-size:11px;font-family:monospace;"><span style="width:52px;">60 Hz</span><input type="range" id="eq-0" min="-12" max="12" value="5" oninput="updateEqBand(0,this.value)" /><span id="eq-val-0" style="width:38px;text-align:right;">+5dB</span></div>
                  <div style="display:flex;align-items:center;gap:8px;font-size:11px;font-family:monospace;"><span style="width:52px;">230 Hz</span><input type="range" id="eq-1" min="-12" max="12" value="2" oninput="updateEqBand(1,this.value)" /><span id="eq-val-1" style="width:38px;text-align:right;">+2dB</span></div>
                  <div style="display:flex;align-items:center;gap:8px;font-size:11px;font-family:monospace;"><span style="width:52px;">910 Hz</span><input type="range" id="eq-2" min="-12" max="12" value="0" oninput="updateEqBand(2,this.value)" /><span id="eq-val-2" style="width:38px;text-align:right;">0dB</span></div>
                  <div style="display:flex;align-items:center;gap:8px;font-size:11px;font-family:monospace;"><span style="width:52px;">3.6 kHz</span><input type="range" id="eq-3" min="-12" max="12" value="4" oninput="updateEqBand(3,this.value)" /><span id="eq-val-3" style="width:38px;text-align:right;">+4dB</span></div>
                  <div style="display:flex;align-items:center;gap:8px;font-size:11px;font-family:monospace;"><span style="width:52px;">14 kHz</span><input type="range" id="eq-4" min="-12" max="12" value="6" oninput="updateEqBand(4,this.value)" /><span id="eq-val-4" style="width:38px;text-align:right;">+6dB</span></div>
