name: Compilar COSMOS APK Nativo

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Codigo Base
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Android SDK Unificado
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          rm tools.zip
          
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Crear Estructura Gradle y Archivos de COSMOS Master Edition
        run: |
          mkdir -p app/src/main/java/com/belmont/cosmos
          mkdir -p app/src/main/assets

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "COSMOS"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.belmont.cosmos'
              compileSdk 34
              defaultConfig {
                  applicationId "com.belmont.cosmos"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.activity:activity-ktx:1.8.2'
              implementation 'androidx.media:media:1.7.0'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <application
                  android:label="COSMOS"
                  android:icon="@android:drawable/ic_media_play"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/belmont/cosmos/MainActivity.kt
          package com.belmont.cosmos

          import android.Manifest
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.ContentUris
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.pm.PackageManager
          import android.media.session.MediaSession
          import android.media.session.PlaybackState
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.MediaStore
          import android.webkit.JavascriptInterface
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceRequest
          import android.webkit.WebResourceResponse
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.activity.ComponentActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.app.NotificationCompat
          import androidx.core.content.ContextCompat
          import org.json.JSONArray
          import org.json.JSONObject

          class MainActivity : ComponentActivity() {
              private lateinit var webView: WebView
              private var mediaSession: MediaSession? = null
              private val CHANNEL_ID = "cosmos_playback_channel"

              private val mediaActionReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      when (intent?.action) {
                          "COSMOS_PREV" -> webView.evaluateJavascript("prevTrack();", null)
                          "COSMOS_TOGGLE" -> webView.evaluateJavascript("togglePlay();", null)
                          "COSMOS_NEXT" -> webView.evaluateJavascript("nextTrack();", null)
                      }
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = android.graphics.Color.parseColor("#040109")
                  window.navigationBarColor = android.graphics.Color.parseColor("#040109")
                  setupMediaSessionAndChannel()

                  webView = WebView(this)
                  setContentView(webView)
                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      mediaPlaybackRequiresUserGesture = false
                      allowFileAccess = true
                      allowContentAccess = true
                  }
                  webView.webChromeClient = WebChromeClient()
                  webView.webViewClient = object : WebViewClient() {
                      override fun shouldInterceptRequest(view: WebView?, request: WebResourceRequest?): WebResourceResponse? {
                          val url = request?.url?.toString() ?: return null
                          if (url.startsWith("https://cosmos.local/audio/")) {
                              val id = url.removePrefix("https://cosmos.local/audio/").toLongOrNull() ?: return null
                              val contentUri = ContentUris.withAppendedId(MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, id)
                              return try {
                                  val stream = contentResolver.openInputStream(contentUri)
                                  WebResourceResponse("audio/mpeg", "UTF-8", 200, "OK", mapOf("Access-Control-Allow-Origin" to "*"), stream)
                              } catch (e: Exception) { null }
                          }
                          if (url.startsWith("https://cosmos.local/albumart/")) {
                              val albumId = url.removePrefix("https://cosmos.local/albumart/").toLongOrNull() ?: return null
                              val artUri = ContentUris.withAppendedId(Uri.parse("content://media/external/audio/albumart"), albumId)
                              return try {
                                  val stream = contentResolver.openInputStream(artUri)
                                  WebResourceResponse("image/jpeg", "UTF-8", 200, "OK", mapOf("Access-Control-Allow-Origin" to "*"), stream)
                              } catch (e: Exception) { null }
                          }
                          return super.shouldInterceptRequest(view, request)
                      }
                  }
                  webView.addJavascriptInterface(CosmosBridge(), "CosmosNative")
                  webView.loadUrl("file:///android_asset/index.html")
              }

              private fun setupMediaSessionAndChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(CHANNEL_ID, "COSMOS Reproductor", NotificationManager.IMPORTANCE_LOW)
                      getSystemService(NotificationManager::class.java).createNotificationChannel(channel)
                  }
                  mediaSession = MediaSession(this, "CosmosBelmontSession").apply {
                      setCallback(object : MediaSession.Callback() {
                          override fun onPlay() { runOnUiThread { webView.evaluateJavascript("playAudio();", null) } }
                          override fun onPause() { runOnUiThread { webView.evaluateJavascript("pauseAudio();", null) } }
                          override fun onSkipToNext() { runOnUiThread { webView.evaluateJavascript("nextTrack();", null) } }
                          override fun onSkipToPrevious() { runOnUiThread { webView.evaluateJavascript("prevTrack();", null) } }
                      })
                      isActive = true
                  }
                  val filter = IntentFilter().apply {
                      addAction("COSMOS_PREV"); addAction("COSMOS_TOGGLE"); addAction("COSMOS_NEXT")
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      registerReceiver(mediaActionReceiver, filter, Context.RECEIVER_EXPORTED)
                  } else {
                      registerReceiver(mediaActionReceiver, filter)
                  }
              }

              private fun checkPermissionsAndScan() {
                  val perms = mutableListOf<String>()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      perms.add(Manifest.permission.READ_MEDIA_AUDIO)
                      perms.add(Manifest.permission.POST_NOTIFICATIONS)
                  } else {
                      perms.add(Manifest.permission.READ_EXTERNAL_STORAGE)
                  }
                  val missing = perms.filter { ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED }
                  if (missing.isNotEmpty()) {
                      ActivityCompat.requestPermissions(this, missing.toTypedArray(), 101)
                  } else {
                      scanDeviceMusic()
                  }
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  scanDeviceMusic()
              }

              private fun scanDeviceMusic() {
                  Thread {
                      val arr = JSONArray()
                      val projection = arrayOf(MediaStore.Audio.Media._ID, MediaStore.Audio.Media.TITLE, MediaStore.Audio.Media.ARTIST, MediaStore.Audio.Media.ALBUM, MediaStore.Audio.Media.ALBUM_ID)
                      contentResolver.query(MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, projection, "${MediaStore.Audio.Media.IS_MUSIC} != 0", null, "${MediaStore.Audio.Media.DATE_ADDED} DESC")?.use { cursor ->
                          val idCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media._ID)
                          val titleCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media.TITLE)
                          val artistCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media.ARTIST)
                          val albumCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media.ALBUM)
                          val albumIdCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media.ALBUM_ID)
                          while (cursor.moveToNext()) {
                              val id = cursor.getLong(idCol)
                              val albumId = cursor.getLong(albumIdCol)
                              arr.put(JSONObject().apply {
                                  put("id", "ms_$id")
                                  put("title", cursor.getString(titleCol) ?: "Pista")
                                  put("artist", cursor.getString(artistCol) ?: "Edward Belmont")
                                  put("album", cursor.getString(albumCol) ?: "Cosmos")
                                  put("audioUrl", "https://cosmos.local/audio/$id")
                                  put("cover", "https://cosmos.local/albumart/$albumId")
                              })
                          }
                      }
                      val jsonStr = arr.toString()
                      runOnUiThread { webView.evaluateJavascript("window.onNativeLibraryLoaded(${JSONObject.quote(jsonStr)});", null) }
                  }.start()
              }

              inner class CosmosBridge {
                  @JavascriptInterface fun rescanMediaStore() { runOnUiThread { checkPermissionsAndScan() } }
                  @JavascriptInterface fun updateNotification(title: String, artist: String, album: String, isPlaying: Boolean) {
                      runOnUiThread { showMediaNotification(title, artist, album, isPlaying) }
                  }
              }

              private fun showMediaNotification(title: String, artist: String, album: String, isPlaying: Boolean) {
                  val state = if (isPlaying) PlaybackState.STATE_PLAYING else PlaybackState.STATE_PAUSED
                  mediaSession?.setPlaybackState(PlaybackState.Builder().setActions(PlaybackState.ACTION_PLAY or PlaybackState.ACTION_PAUSE or PlaybackState.ACTION_SKIP_TO_NEXT or PlaybackState.ACTION_SKIP_TO_PREVIOUS).setState(state, PlaybackState.PLAYBACK_POSITION_UNKNOWN, 1.0f).build())

                  val prevPending = PendingIntent.getBroadcast(this, 1, Intent("COSMOS_PREV"), PendingIntent.FLAG_IMMUTABLE)
                  val togglePending = PendingIntent.getBroadcast(this, 2, Intent("COSMOS_TOGGLE"), PendingIntent.FLAG_IMMUTABLE)
                  val nextPending = PendingIntent.getBroadcast(this, 3, Intent("COSMOS_NEXT"), PendingIntent.FLAG_IMMUTABLE)
                  val playPauseIcon = if (isPlaying) android.R.drawable.ic_media_pause else android.R.drawable.ic_media_play

                  val builder = NotificationCompat.Builder(this, CHANNEL_ID)
                      .setSmallIcon(android.R.drawable.ic_media_play)
                      .setContentTitle(title)
                      .setContentText("$artist • $album")
                      .setOngoing(isPlaying)
                      .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                      .setColor(android.graphics.Color.parseColor("#9333ea"))
                      .setColorized(true)
                      .addAction(android.R.drawable.ic_media_previous, "Anterior", prevPending)
                      .addAction(playPauseIcon, if (isPlaying) "Pausa" else "Play", togglePending)
                      .addAction(android.R.drawable.ic_media_next, "Siguiente", nextPending)
                      .setStyle(androidx.media.app.NotificationCompat.MediaStyle().setShowActionsInCompactView(0, 1, 2))

                  getSystemService(NotificationManager::class.java).notify(777, builder.build())
              }

              override fun onDestroy() {
                  super.onDestroy()
                  unregisterReceiver(mediaActionReceiver)
                  mediaSession?.release()
              }
          }
          EOF

          cat << 'EOF' > app/src/main/assets/index.html
          <!DOCTYPE html>
          <html lang="es">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
            <meta name="theme-color" content="#040109" />
            <title>COSMOS</title>
            <script src="https://cdn.tailwindcss.com"></script>
            <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
            <style>
              @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Montserrat:wght@200;300;400;600&family=Inter:wght@300;400;500;600;700&display=swap');
              :root { --bg-void: #040109; --neon-purple: #c084fc; --neon-pink: #e879f9; }
              body { background-color: var(--bg-void); color: #f3e8ff; font-family: 'Inter', sans-serif; overflow-x: hidden; user-select: none; -webkit-tap-highlight-color: transparent; }
              .digital-cosmos { font-family: 'Share Tech Mono', monospace; letter-spacing: 0.28em; text-shadow: 0 0 14px rgba(217, 70, 239, 0.85), 0 0 26px rgba(147, 51, 234, 0.6); }
              .belmont-thin { font-family: 'Montserrat', sans-serif; font-weight: 200; letter-spacing: 0.36em; }
              .cosmos-bg { background: radial-gradient(circle at 50% -10%, rgba(168, 85, 247, 0.32) 0%, transparent 55%), radial-gradient(circle at 85% 60%, rgba(217, 70, 239, 0.14) 0%, transparent 45%), linear-gradient(180deg, #080312 0%, #040109 100%); }
              .glass-card { background: rgba(17, 8, 32, 0.88); backdrop-filter: blur(20px); border: 1px solid rgba(192, 132, 252, 0.24); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4); }
              .neon-chord-box { background: linear-gradient(160deg, rgba(107, 33, 168, 0.65) 0%, rgba(12, 5, 23, 0.98) 100%); border: 1.5px solid #e879f9; box-shadow: 0 0 28px rgba(217, 70, 239, 0.45), inset 0 0 14px rgba(192, 132, 252, 0.3); }
              input[type="range"] { -webkit-appearance: none; appearance: none; background: #23113b; height: 4px; border-radius: 999px; outline: none; }
              input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #f5d0fe; box-shadow: 0 0 14px #d946ef; cursor: pointer; }
              .no-scrollbar::-webkit-scrollbar { display: none; }
            </style>
          </head>
          <body class="cosmos-bg min-h-screen flex flex-col justify-between pb-40">
            <svg class="hidden">
              <defs>
                <linearGradient id="crestLeft" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ffffff" /><stop offset="45%" stop-color="#f0abfc" /><stop offset="100%" stop-color="#9333ea" /></linearGradient>
                <linearGradient id="crestRight" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#e9d5ff" /><stop offset="50%" stop-color="#a855f7" /><stop offset="100%" stop-color="#4c1d95" /></linearGradient>
                <g id="cosmosMasterLogo">
                  <circle cx="50" cy="50" r="45" fill="none" stroke="#e879f9" stroke-width="1.8" opacity="0.5" />
                  <path d="M 14 44 A 36 36 0 0 1 86 44" fill="none" stroke="url(#crestLeft)" stroke-width="3" stroke-linecap="round" opacity="0.95" />
                  <polygon points="50,8 16,62 34,62 50,32" fill="url(#crestLeft)" />
                  <polygon points="50,8 84,62 66,62 50,32" fill="url(#crestRight)" />
                  <polygon points="36,58 50,92 64,58 50,68" fill="url(#crestLeft)" />
                  <polygon points="50,39 56,50 50,61 44,50" fill="#ffffff" />
                </g>
              </defs>
            </svg>

            <header class="sticky top-0 z-30 glass-card px-4 py-3 flex items-center justify-between border-b border-purple-800/40">
              <div class="flex items-center gap-3">
                <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-purple-900/90 to-purple-950 border border-fuchsia-500/50 flex items-center justify-center shadow-[0_0_20px_rgba(217,70,239,0.35)]">
                  <svg class="w-9 h-9" viewBox="0 0 100 100"><use href="#cosmosMasterLogo" /></svg>
                </div>
                <div>
                  <h1 class="digital-cosmos text-lg font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-100 via-fuchsia-200 to-purple-400 leading-none">COSMOS</h1>
                  <p class="belmont-thin text-[7.5px] text-fuchsia-300 uppercase tracking-[0.3em] mt-1">Belmont Edition</p>
                </div>
              </div>
              <div class="flex items-center gap-2">
                <button onclick="openModal('timerModal')" class="px-2.5 py-1.5 rounded-xl bg-purple-950/80 border border-purple-600/40 text-xs text-purple-200 flex items-center gap-1.5 shadow-inner"><i class="fa-regular fa-clock text-fuchsia-400 text-[11px]"></i><span id="timerText" class="text-[10px] font-mono">Off</span></button>
                <button onclick="openModal('eqModal')" class="w-9 h-9 rounded-xl bg-purple-950/80 border border-purple-600/40 text-purple-200 flex items-center justify-center shadow-inner"><i class="fa-solid fa-sliders text-xs"></i></button>
                <button onclick="rescanPhoneLibrary()" class="px-3.5 py-1.5 rounded-xl bg-gradient-to-r from-purple-700 via-purple-600 to-fuchsia-600 text-white text-xs font-semibold flex items-center gap-1.5 shadow-lg active:scale-95 border border-fuchsia-400/30"><i class="fa-solid fa-rotate"></i> Escanear</button>
              </div>
            </header>

            <div class="px-4 pt-3.5"><div class="relative"><i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-fuchsia-400/60 text-xs"></i><input type="text" id="searchInput" oninput="renderLibrary()" placeholder="Buscar canción, artista o álbum..." class="w-full pl-9 pr-4 py-2.5 rounded-xl bg-purple-950/45 border border-purple-700/35 text-xs sm:text-sm text-purple-100 placeholder-purple-300/40 focus:outline-none focus:border-fuchsia-400 shadow-inner" /></div></div>

            <nav class="flex gap-2 px-4 py-3 overflow-x-auto no-scrollbar">
              <button onclick="switchTab('songs')" id="tab-songs" class="px-4 py-1.5 rounded-xl text-xs font-medium bg-gradient-to-r from-purple-700 to-fuchsia-600 text-white shadow-md shadow-purple-900/50 border border-fuchsia-400/30 whitespace-nowrap">Canciones (<span id="countSongs">0</span>)</button>
              <button onclick="switchTab('artists')" id="tab-artists" class="px-4 py-1.5 rounded-xl text-xs font-medium bg-purple-950/50 text-purple-300/80 border border-purple-800/40 whitespace-nowrap">Artistas</button>
              <button onclick="switchTab('albums')" id="tab-albums" class="px-4 py-1.5 rounded-xl text-xs font-medium bg-purple-950/50 text-purple-300/80 border border-purple-800/40 whitespace-nowrap">Álbumes</button>
              <button onclick="switchTab('playlists')" id="tab-playlists" class="px-4 py-1.5 rounded-xl text-xs font-medium bg-purple-950/50 text-purple-300/80 border border-purple-800/40 whitespace-nowrap">Playlists</button>
            </nav>

            <main id="libraryContainer" class="px-4 flex-1 space-y-2 overflow-y-auto"></main>

            <footer class="mt-6 mb-2 text-center pointer-events-none"><p class="belmont-thin text-[8px] uppercase text-purple-300 opacity-25">Desarrollado por Edward Belmont</p></footer>

            <div class="fixed bottom-0 left-0 right-0 z-40 p-2 bg-gradient-to-t from-[#040109] via-[#040109]/95 to-transparent">
              <div class="glass-card rounded-2xl p-3 shadow-2xl border border-purple-500/30">
                <div class="flex items-center justify-between gap-3">
                  <div class="flex items-center gap-3 flex-1 min-w-0 cursor-pointer" onclick="openModal('playerModal')">
                    <img id="miniCover" src="" class="w-12 h-12 rounded-xl object-cover border border-purple-400/35 bg-purple-950/60 shrink-0" />
                    <div class="min-w-0 flex-1">
                      <div class="flex items-center gap-2"><h3 id="miniTitle" class="font-semibold text-sm text-white truncate">Cargando biblioteca...</h3><span id="miniChordBadge" class="px-2 py-0.5 text-[11px] font-bold rounded bg-fuchsia-700/90 text-white border border-fuchsia-300/60 font-mono shrink-0 shadow">--</span></div>
                      <p id="miniArtist" class="text-xs text-purple-300/70 truncate">COSMOS Native Engine</p>
                    </div>
                  </div>
                  <div class="flex items-center gap-1.5">
                    <button onclick="prevTrack()" class="w-8 h-8 rounded-full flex items-center justify-center text-purple-200"><i class="fa-solid fa-backward-step"></i></button>
                    <button onclick="togglePlay()" id="miniPlayBtn" class="w-10 h-10 rounded-full bg-gradient-to-tr from-purple-600 to-fuchsia-500 text-white flex items-center justify-center shadow-md"><i class="fa-solid fa-play text-sm"></i></button>
                    <button onclick="nextTrack()" class="w-8 h-8 rounded-full flex items-center justify-center text-purple-200"><i class="fa-solid fa-forward-step"></i></button>
                    <button onclick="openModal('playerModal')" class="w-8 h-8 rounded-full bg-purple-950/80 text-purple-300 flex items-center justify-center"><i class="fa-solid fa-chevron-up text-xs"></i></button>
                  </div>
                </div>
                <div class="mt-2 flex items-center gap-2"><span id="miniCurrentTime" class="text-[10px] text-purple-300/70 w-8 font-mono">0:00</span><input type="range" id="miniSeek" value="0" min="0" max="100" step="0.1" oninput="seekAudio(this.value)" class="flex-1" /><span id="miniDuration" class="text-[10px] text-purple-300/70 w-8 text-right font-mono">0:00</span></div>
              </div>
            </div>

            <div id="playerModal" class="fixed inset-0 z-50 bg-[#040109]/98 backdrop-blur-2xl hidden flex-col justify-between p-4 sm:p-6 overflow-y-auto">
              <div class="flex items-center justify-between">
                <button onclick="closeModal('playerModal')" class="w-9 h-9 rounded-xl bg-purple-950/80 border border-purple-800/40 text-purple-200 flex items-center justify-center"><i class="fa-solid fa-chevron-down text-sm"></i></button>
                <div class="text-center"><span class="digital-cosmos text-[10px] uppercase text-fuchsia-300 block">COSMOS</span><span id="fullAlbumName" class="text-xs font-medium text-purple-200 truncate max-w-[200px] block">Álbum</span></div>
                <button onclick="openEditModal()" class="px-3 py-1.5 rounded-xl bg-purple-950/80 border border-purple-600/40 text-xs text-purple-200 flex items-center gap-1.5"><i class="fa-solid fa-pen text-[10px]"></i> Editar</button>
              </div>
              <div class="flex-1 flex flex-col items-center justify-center space-y-4 my-2">
                <img id="fullCover" src="" class="w-52 h-52 sm:w-60 sm:h-60 rounded-2xl object-cover shadow-2xl border border-purple-400/35 bg-purple-950/40" />
                <div class="w-full max-w-md glass-card rounded-2xl p-3.5 border border-purple-500/35">
                  <div class="flex items-center justify-between mb-2">
                    <div class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-fuchsia-400 animate-pulse"></span><span class="text-[10px] font-semibold uppercase tracking-wider text-purple-200">Reconocedor de Acordes Digital</span></div>
                    <button onclick="toggleChordMode()" id="chordModeBtn" class="px-2.5 py-0.5 rounded-lg bg-purple-900/90 border border-fuchsia-400/40 text-[10px] text-purple-100 font-medium">Power / Tónica</button>
                  </div>
                  <div class="w-full bg-black/60 h-1.5 rounded-full overflow-hidden mb-3 border border-purple-900/40"><div id="measureLockBar" class="bg-gradient-to-r from-purple-600 via-fuchsia-400 to-white h-full transition-all duration-100" style="width: 0%"></div></div>
                  <div class="grid grid-cols-3 gap-2.5 items-center text-center">
                    <div class="p-2.5 rounded-xl bg-black/40 border border-purple-900/40"><span class="text-[9px] uppercase tracking-wider text-purple-400/70 block mb-0.5">Compás Ant.</span><span id="prevChordBox" class="text-base font-bold text-purple-300 font-mono">--</span></div>
                    <div class="p-3 rounded-xl neon-chord-box transform scale-105"><span class="text-[9px] text-fuchsia-200 uppercase font-semibold tracking-wider block mb-0.5">En Compás</span><span id="currentChordBox" class="text-3xl font-extrabold text-white tracking-tight font-mono">--</span></div>
                    <div class="p-2.5 rounded-xl bg-black/40 border border-purple-900/40"><span class="text-[9px] uppercase tracking-wider text-purple-400/70 block mb-0.5">5ta (Power)</span><span id="nextChordBox" class="text-base font-bold text-purple-200 font-mono">--</span></div>
                  </div>
                  <div class="mt-3"><div id="chromaBars" class="grid grid-cols-12 gap-1 h-9 items-end pt-1.5 px-1.5 bg-black/50 rounded-lg border border-purple-900/30"></div><div class="grid grid-cols-12 gap-1 text-[9px] text-center text-purple-300/80 font-mono mt-1 font-semibold"><span>C</span><span>C#</span><span>D</span><span>D#</span><span>E</span><span>F</span><span>F#</span><span>G</span><span>G#</span><span>A</span><span>A#</span><span>B</span></div></div>
                </div>
              </div>
              <div class="space-y-2.5 pt-1">
                <div class="flex items-center justify-between"><div class="min-w-0 flex-1 pr-2"><h2 id="fullTitle" class="text-base sm:text-lg font-bold text-white truncate">Sin canción</h2><p id="fullArtist" class="text-xs sm:text-sm text-purple-300/80 truncate">--</p></div><span id="fullGenreBadge" class="px-2.5 py-1 rounded-md text-[10px] bg-purple-950 border border-purple-600/40 text-purple-200 shrink-0">Space Rock</span></div>
                <div><input type="range" id="fullSeek" value="0" min="0" max="100" step="0.1" oninput="seekAudio(this.value)" class="w-full" /><div class="flex justify-between text-[11px] text-purple-300/70 mt-1 font-mono"><span id="fullCurrentTime">0:00</span><span id="fullDuration">0:00</span></div></div>
                <div class="flex items-center justify-between px-2 pt-1">
                  <button onclick="toggleShuffle()" id="shuffleBtn" class="w-10 h-10 rounded-full flex items-center justify-center text-purple-400/50"><i class="fa-solid fa-shuffle text-base"></i></button>
                  <button onclick="prevTrack()" class="w-12 h-12 rounded-full bg-purple-950/90 border border-purple-800/40 flex items-center justify-center text-white text-lg active:scale-90"><i class="fa-solid fa-backward-step"></i></button>
                  <button onclick="togglePlay()" id="fullPlayBtn" class="w-14 h-14 rounded-full bg-gradient-to-tr from-purple-600 to-fuchsia-500 text-white flex items-center justify-center text-xl shadow-lg active:scale-95"><i class="fa-solid fa-play"></i></button>
                  <button onclick="nextTrack()" class="w-12 h-12 rounded-full bg-purple-950/90 border border-purple-800/40 flex items-center justify-center text-white text-lg active:scale-90"><i class="fa-solid fa-forward-step"></i></button>
                  <button onclick="cycleRepeat()" id="repeatBtn" class="w-10 h-10 rounded-full flex items-center justify-center text-purple-400/50 relative"><i class="fa-solid fa-repeat text-base"></i><span id="repeatOneBadge" class="hidden absolute -top-0.5 -right-0.5 w-4 h-4 rounded-full bg-fuchsia-400 text-[10px] font-bold text-black flex items-center justify-center">1</span></button>
                </div>
                <p class="belmont-thin text-[7px] text-center uppercase text-purple-300 opacity-20 pt-1">Desarrollado por Edward Belmont</p>
              </div>
            </div>

            <div id="editModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden items-center justify-center p-4">
              <div class="glass-card rounded-2xl w-full max-w-md p-5 space-y-3.5 border border-purple-500/40">
                <div class="flex justify-between items-center border-b border-purple-800/40 pb-2"><h3 class="font-semibold text-sm text-purple-100">Modificar Información y Portada</h3><button onclick="closeModal('editModal')" class="text-purple-400"><i class="fa-solid fa-xmark"></i></button></div>
                <div class="space-y-3 text-xs">
                  <div><label class="text-purple-300/80 block mb-1">Nombre</label><input type="text" id="editTitle" class="w-full p-2.5 rounded-lg bg-purple-950/90 border border-purple-700/50 text-white" /></div>
                  <div class="grid grid-cols-2 gap-2">
                    <div><label class="text-purple-300/80 block mb-1">Artista</label><input type="text" id="editArtist" class="w-full p-2.5 rounded-lg bg-purple-950/90 border border-purple-700/50 text-white" /></div>
                    <div><label class="text-purple-300/80 block mb-1">Álbum</label><input type="text" id="editAlbum" class="w-full p-2.5 rounded-lg bg-purple-950/90 border border-purple-700/50 text-white" /></div>
                  </div>
                  <div><label class="text-purple-300/80 block mb-1">Cambiar Portada</label><input type="file" id="editCoverFile" accept="image/*" class="w-full text-[11px] text-purple-300 file:mr-2 file:py-1.5 file:px-2 file:rounded-md file:border-0 file:bg-purple-700 file:text-white" /></div>
                </div>
                <div class="flex justify-end gap-2 pt-2"><button onclick="closeModal('editModal')" class="px-4 py-2 rounded-xl bg-purple-950 text-purple-300 text-xs">Cancelar</button><button onclick="saveTrackEdits()" class="px-5 py-2 rounded-xl bg-gradient-to-r from-purple-600 to-fuchsia-600 text-white text-xs font-semibold">Guardar</button></div>
              </div>
            </div>

            <div id="eqModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden items-center justify-center p-4">
              <div class="glass-card rounded-2xl w-full max-w-md p-5 space-y-4 border border-purple-500/40">
                <div class="flex justify-between items-center border-b border-purple-800/40 pb-2"><h3 class="font-semibold text-sm text-purple-100">Ecualizador por Género</h3><button onclick="closeModal('eqModal')" class="text-purple-400"><i class="fa-solid fa-xmark"></i></button></div>
                <div class="flex flex-wrap gap-1.5">
                  <button onclick="applyEqPreset('Space Rock')" class="px-3 py-1 rounded-lg text-xs bg-purple-700 text-white">Space Rock</button>
                  <button onclick="applyEqPreset('Gothic Rock')" class="px-3 py-1 rounded-lg text-xs bg-purple-950 border border-purple-800 text-purple-300">Gothic Rock</button>
                  <button onclick="applyEqPreset('Flat')" class="px-3 py-1 rounded-lg text-xs bg-purple-950 border border-purple-800 text-purple-300">Plano</button>
                </div>
                <div class="space-y-3 pt-1">
                  <div class="flex items-center gap-3"><span class="text-xs text-purple-300 w-16 font-mono">60 Hz</span><input type="range" id="eq-0" min="-12" max="12" value="5" oninput="updateEqBand(0, this.value)" class="flex-1" /><span id="eq-val-0" class="text-xs text-purple-200 w-10 text-right font-mono">+5dB</span></div>
                  <div class="flex items-center gap-3"><span class="text-xs text-purple-300 w-16 font-mono">230 Hz</span><input type="range" id="eq-1" min="-12" max="12" value="2" oninput="updateEqBand(1, this.value)" class="flex-1" /><span id="eq-val-1" class="text-xs text-purple-200 w-10 text-right font-mono">+2dB</span></div>
                  <div class="flex items-center gap-3"><span class="text-xs text-purple-300 w-16 font-mono">910 Hz</span><input type="range" id="eq-2" min="-12" max="12" value="0" oninput="updateEqBand(2, this.value)" class="flex-1" /><span id="eq-val-2" class="text-xs text-purple-200 w-10 text-right font-mono">0dB</span></div>
                  <div class="flex items-center gap-3"><span class="text-xs text-purple-300 w-16 font-mono">3.6 kHz</span><input type="range" id="eq-3" min="-12" max="12" value="4" oninput="updateEqBand(3, this.value)" class="flex-1" /><span id="eq-val-3" class="text-xs text-purple-200 w-10 text-right font-mono">+3dB</span></div>
                  <div class="flex items-center gap-3"><span class="text-xs text-purple-300 w-16 font-mono">14 kHz</span><input type="range" id="eq-4" min="-12" max="12" value="6" oninput="updateEqBand(4, this.value)" class="flex-1" /><span id="eq-val-4" class="text-xs text-purple-200 w-10 text-right font-mono">+6dB</span></div>
                </div>
              </div>
            </div>

            <div id="timerModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden items-center justify-center p-4">
              <div class="glass-card rounded-2xl w-full max-w-sm p-5 space-y-3 border border-purple-500/40 text-center">
                <div class="flex justify-between items-center border-b border-purple-800/40 pb-2"><h3 class="font-semibold text-sm text-purple-100">Temporizador de Apagado</h3><button onclick="closeModal('timerModal')" class="text-purple-400"><i class="fa-solid fa-xmark"></i></button></div>
                <div class="grid grid-cols-2 gap-2 pt-2"><button onclick="setSleepTimer(10)" class="p-2.5 rounded-xl bg-purple-950 border border-purple-800/40 text-xs font-medium">10 Min</button><button onclick="setSleepTimer(20)" class="p-2.5 rounded-xl bg-purple-950 border border-purple-800/40 text-xs font-medium">20 Min</button></div>
                <button onclick="setSleepTimer(0)" class="w-full p-2.5 rounded-xl bg-red-950/50 border border-red-800/40 text-xs text-red-300 font-medium mt-2">Desactivar</button>
              </div>
            </div>

            <audio id="audioElement" crossorigin="anonymous"></audio>

            <script>
              const fallbackCoverSvg = "data:image/svg+xml;utf8," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300"><rect width="300" height="300" fill="#06020d"/><circle cx="150" cy="150" r="105" fill="none" stroke="#9333ea" stroke-width="2" opacity="0.4"/><path d="M85 138 A68 68 0 0 1 215 138" fill="none" stroke="#f0abfc" stroke-width="5" stroke-linecap="round"/><polygon points="150,65 92,165 122,165 150,110" fill="#ffffff"/><polygon points="150,65 208,165 178,165 150,110" fill="#c084fc"/><polygon points="128,160 150,225 172,160 150,180" fill="#e879f9"/><polygon points="150,126 160,146 150,166 140,146" fill="#ffffff"/></svg>`);

              let tracks = [], customOverrides = JSON.parse(localStorage.getItem("cosmos_overrides_v7")) || {}, playlists = [];
              let currentTab = "songs", currentTrackIndex = -1, isPlaying = false, shuffleMode = false, repeatMode = 0;

              window.onNativeLibraryLoaded = function(jsonArray) {
                try {
                  const list = typeof jsonArray === "string" ? JSON.parse(jsonArray) : jsonArray;
                  tracks = list.map(item => {
                    const saved = customOverrides[item.id] || {};
                    return {
                      id: item.id,
                      title: saved.title || item.title,
                      artist: saved.artist || item.artist,
                      album: saved.album || item.album,
                      genre: saved.genre || "Space Rock",
                      cover: saved.cover || item.cover || fallbackCoverSvg,
                      audioUrl: item.audioUrl
                    };
                  });
                  renderLibrary();
                  if (tracks.length > 0 && currentTrackIndex === -1) loadTrack(0, false);
                } catch(e) {}
              };

              function rescanPhoneLibrary() { if(window.CosmosNative) window.CosmosNative.rescanMediaStore(); }
              function notifyNativeAndroidService() {
                if(window.CosmosNative && currentTrackIndex >= 0 && tracks[currentTrackIndex]) {
                  const t = tracks[currentTrackIndex];
                  window.CosmosNative.updateNotification(t.title, t.artist, t.album, isPlaying);
                }
              }

              // DSP RECONOCEDOR DE ACORDES MAESTRO BLINDADO
              let audioCtx = null, analyser = null, mediaSource = null;
              let chordDetectionMode = "power";
              const NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
              let smoothedRoot = new Array(12).fill(0), smoothedChroma = new Array(12).fill(0);
              let lockedPitch = -1, lockedQuality = "", prevChordName = "--", lockTime = 0, challenger = -1, challengerCount = 0;
              const HOLD_MS = 1400;
              const audioEl = document.getElementById("audioElement");

              function initAudioEngine() {
                if (audioCtx) {
                  if (audioCtx.state === "suspended") audioCtx.resume();
                  return;
                }
                try {
                  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                  analyser = audioCtx.createAnalyser();
                  analyser.fftSize = 8192;
                  analyser.smoothingTimeConstant = 0.82;
                  mediaSource = audioCtx.createMediaElementSource(audioEl);
                  mediaSource.connect(analyser);
                  analyser.connect(audioCtx.destination);
                  requestAnimationFrame(dspLoop);
                } catch (e) {}
              }

              function dspLoop() {
                if (isPlaying && analyser && audioCtx) {
                  const bufLen = analyser.frequencyBinCount;
                  const fftDb = new Float32Array(bufLen);
                  analyser.getFloatFrequencyData(fftDb);
                  const instRoot = new Array(12).fill(0), instChroma = new Array(12).fill(0);
                  const binW = audioCtx.sampleRate / analyser.fftSize;

                  for (let b = Math.max(2, Math.floor(55/binW)); b < Math.min(bufLen-4, Math.ceil(880/binW)); b++) {
                    const db = fftDb[b];
                    if (db > -78 && db >= fftDb[b-1] && db >= fftDb[b+1]) {
                      const freq = (b + 0.5 * (fftDb[b-1] - fftDb[b+1]) / (fftDb[b-1] - 2*db + fftDb[b+1])) * binW;
                      if (freq < 55 || freq > 880) continue;
                      const mag = Math.pow(10, db / 20);
                      const p = ((Math.round(12 * Math.log2(freq / 440) + 69) % 12) + 12) % 12;
                      instChroma[p] += mag;
                      if (freq <= 350) instRoot[p] += mag * (freq < 190 ? 1.6 : 1.1);
                    }
                  }

                  let sig = 0;
                  for(let i=0; i<12; i++) {
                    smoothedRoot[i] = smoothedRoot[i]*0.86 + instRoot[i]*0.14;
                    smoothedChroma[i] = smoothedChroma[i]*0.84 + instChroma[i]*0.16;
                    sig += smoothedRoot[i];
                  }

                  const maxR = Math.max(...smoothedRoot, 0.00001);
                  for(let i=0; i<12; i++) {
                    const bar = document.getElementById(`chroma-bar-${i}`);
                    if(bar) {
                      bar.style.height = `${Math.max(10, Math.round((smoothedRoot[i]/maxR)*100))}%`;
                      bar.style.opacity = i === lockedPitch ? "1" : "0.4";
                    }
                  }

                  if(sig > 0.0015) {
                    let bestIdx = 0; for(let i=1; i<12; i++) if(smoothedRoot[i] > smoothedRoot[bestIdx]) bestIdx = i;
                    const now = performance.now();
                    const elapsed = now - lockTime;
                    const barElem = document.getElementById("measureLockBar");
                    if(barElem) barElem.style.width = `${Math.min(100, Math.round((elapsed / HOLD_MS) * 100))}%`;

                    if(lockedPitch === -1) {
                      lockChord(bestIdx, now);
                    } else if(bestIdx !== lockedPitch) {
                      if(smoothedRoot[bestIdx] > smoothedRoot[lockedPitch] * (elapsed < HOLD_MS ? 1.4 : 1.15)) {
                        if(challenger === bestIdx) challengerCount++; else { challenger = bestIdx; challengerCount = 1; }
                        if(challengerCount >= 10) lockChord(bestIdx, now);
                      } else challengerCount = Math.max(0, challengerCount - 1);
                    } else challengerCount = 0;
                  }
                }
                requestAnimationFrame(dspLoop);
              }

              function lockChord(pitch, now) {
                if(lockedPitch !== -1) prevChordName = formatChord(lockedPitch, lockedQuality);
                lockedPitch = pitch; lockTime = now; challengerCount = 0;
                lockedQuality = smoothedChroma[(pitch + 3) % 12] > smoothedChroma[(pitch + 4) % 12] * 1.18 ? "m" : "";
                renderChordUI();
              }

              function formatChord(p, q) {
                if(p < 0) return "--";
                return chordDetectionMode === "power" ? NOTE_NAMES[p] : NOTE_NAMES[p] + q;
              }

              function renderChordUI() {
                const cur = formatChord(lockedPitch, lockedQuality);
                document.getElementById("miniChordBadge").textContent = cur;
                document.getElementById("currentChordBox").textContent = cur;
                document.getElementById("prevChordBox").textContent = prevChordName;
                document.getElementById("nextChordBox").textContent = `${NOTE_NAMES[lockedPitch]}5`;
              }

              function toggleChordMode() {
                chordDetectionMode = chordDetectionMode === "power" ? "triad" : "power";
                document.getElementById("chordModeBtn").textContent = chordDetectionMode === "power" ? "Power / Tónica" : "Tríadas";
                if(lockedPitch !== -1) renderChordUI();
              }

              function loadTrack(idx, autoPlay=false) {
                if(idx < 0 || idx >= tracks.length) return;
                currentTrackIndex = idx; const t = tracks[idx];
                lockedPitch = -1; prevChordName = "--";
                document.getElementById("miniCover").src = t.cover; document.getElementById("miniTitle").textContent = t.title; document.getElementById("miniArtist").textContent = t.artist;
                document.getElementById("fullCover").src = t.cover; document.getElementById("fullTitle").textContent = t.title; document.getElementById("fullArtist").textContent = t.artist;
                document.getElementById("fullAlbumName").textContent = t.album;
                audioEl.src = t.audioUrl; audioEl.load(); renderLibrary(); notifyNativeAndroidService();
                if(autoPlay) playAudio();
              }

              function togglePlay() { if(!tracks.length) { rescanPhoneLibrary(); return; } initAudioEngine(); isPlaying ? pauseAudio() : playAudio(); }
              function playAudio() { isPlaying = true; updatePlayButtons(true); audioEl.play().catch(()=>{}); notifyNativeAndroidService(); }
              function pauseAudio() { isPlaying = false; updatePlayButtons(false); audioEl.pause(); notifyNativeAndroidService(); }
              function updatePlayButtons(p) {
                const icon = p ? '<i class="fa-solid fa-pause"></i>' : '<i class="fa-solid fa-play"></i>';
                document.getElementById("miniPlayBtn").innerHTML = icon; document.getElementById("fullPlayBtn").innerHTML = icon;
              }
              function prevTrack() { if(tracks.length) loadTrack((currentTrackIndex - 1 + tracks.length) % tracks.length, true); }
              function nextTrack() { if(tracks.length) loadTrack((currentTrackIndex + 1) % tracks.length, true); }
              
              audioEl.addEventListener("timeupdate", () => updateTimeUI(audioEl.currentTime, audioEl.duration || 0));
              audioEl.addEventListener("ended", nextTrack);
              function seekAudio(val) { if(audioEl.duration) audioEl.currentTime = (val/100)*audioEl.duration; }
              function updateTimeUI(cur, tot) {
                const fmt = s => `${Math.floor(s/60)}:${Math.floor(s%60)<10?'0':''}${Math.floor(s%60)}`;
                document.getElementById("miniSeek").value = tot ? (cur/tot)*100 : 0; document.getElementById("fullSeek").value = tot ? (cur/tot)*100 : 0;
                document.getElementById("miniCurrentTime").textContent = fmt(cur); document.getElementById("fullCurrentTime").textContent = fmt(cur);
                document.getElementById("miniDuration").textContent = fmt(tot); document.getElementById("fullDuration").textContent = fmt(tot);
              }

              function switchTab(tab) {
                currentTab = tab;
                ["songs", "artists", "albums", "playlists"].forEach(t => {
                  const btn = document.getElementById(`tab-${t}`);
                  if(t === tab) {
                    btn.className = "px-4 py-1.5 rounded-xl text-xs font-medium bg-gradient-to-r from-purple-700 to-fuchsia-600 text-white shadow-md shadow-purple-900/50 border border-fuchsia-400/30 whitespace-nowrap";
                  } else {
                    btn.className = "px-4 py-1.5 rounded-xl text-xs font-medium bg-purple-950/50 text-purple-300/80 border border-purple-800/40 whitespace-nowrap";
                  }
                });
                renderLibrary();
              }

              function renderLibrary(filterField = null, filterValue = null) {
                const container = document.getElementById("libraryContainer");
                const query = document.getElementById("searchInput").value.toLowerCase();
                document.getElementById("countSongs").textContent = tracks.length;
                container.innerHTML = "";

                if(tracks.length === 0) {
                  container.innerHTML = `<div class="glass-card rounded-2xl p-8 text-center my-6 border border-purple-700/30"><h3 class="text-sm font-semibold text-white mb-1">Escaneando Dispositivo...</h3><button onclick="rescanPhoneLibrary()" class="mt-3 px-5 py-2.5 rounded-xl bg-purple-700 text-white text-xs font-bold">Escanear Memoria</button></div>`;
                  return;
                }

                let filtered = tracks.filter(t => t.title.toLowerCase().includes(query) || t.artist.toLowerCase().includes(query));
                if(filterField && filterValue) {
                  filtered = filtered.filter(t => t[filterField] === filterValue);
                  const back = document.createElement("button");
                  back.className = "mb-2 text-xs text-fuchsia-300 font-semibold flex items-center gap-1";
                  back.innerHTML = `<i class="fa-solid fa-arrow-left"></i> Volver`;
                  back.onclick = () => renderLibrary();
                  container.appendChild(back);
                }

                if(currentTab === "songs" || filterField) {
                  filtered.forEach(track => {
                    const idx = tracks.indexOf(track);
                    const isCur = idx === currentTrackIndex;
                    const div = document.createElement("div");
                    div.className = `p-2.5 rounded-xl flex items-center justify-between gap-3 cursor-pointer transition ${isCur ? "bg-purple-900/60 border border-fuchsia-400/60 shadow-[0_0_15px_rgba(217,70,239,0.2)]" : "glass-card hover:bg-purple-900/20"}`;
                    div.innerHTML = `<div class="flex items-center gap-3 min-w-0 flex-1" onclick="loadTrack(${idx}, true)"><img src="${track.cover}" class="w-11 h-11 rounded-lg object-cover border border-purple-500/30 shrink-0" /><div class="min-w-0 flex-1"><h4 class="text-sm font-semibold ${isCur?"text-fuchsia-300":"text-white"} truncate">${track.title}</h4><p class="text-xs text-purple-300/65 truncate">${track.artist} • ${track.album}</p></div></div><button onclick="currentTrackIndex=${idx};openEditModal();" class="p-2 text-purple-300/70 hover:text-white"><i class="fa-solid fa-pen text-xs"></i></button>`;
                    container.appendChild(div);
                  });
                } else if(currentTab === "artists") {
                  [...new Set(filtered.map(t => t.artist))].forEach(artist => {
                    const artistTracks = tracks.filter(t => t.artist === artist);
                    const div = document.createElement("div");
                    div.className = "glass-card p-3 rounded-xl flex items-center justify-between cursor-pointer";
                    div.onclick = () => renderLibrary("artist", artist);
                    div.innerHTML = `<div class="flex items-center gap-3"><img src="${artistTracks[0]?.cover}" class="w-10 h-10 rounded-full object-cover border border-purple-500/40" /><div><h4 class="text-sm font-semibold text-white">${artist}</h4><p class="text-xs text-purple-300/65">${artistTracks.length} pistas</p></div></div><i class="fa-solid fa-chevron-right text-purple-400 text-xs"></i>`;
                    container.appendChild(div);
                  });
                } else if(currentTab === "albums") {
                  const grid = document.createElement("div"); grid.className = "grid grid-cols-2 gap-3";
                  [...new Set(filtered.map(t => t.album))].forEach(album => {
                    const sample = tracks.find(t => t.album === album);
                    const card = document.createElement("div");
                    card.className = "glass-card p-3 rounded-xl cursor-pointer";
                    card.onclick = () => renderLibrary("album", album);
                    card.innerHTML = `<img src="${sample.cover}" class="w-full aspect-square object-cover rounded-xl mb-2 border border-purple-500/30" /><h4 class="text-xs font-semibold text-white truncate">${album}</h4><p class="text-[11px] text-purple-300/70 truncate">${sample.artist}</p>`;
                    grid.appendChild(card);
                  });
                  container.appendChild(grid);
                } else if(currentTab === "playlists") {
                  container.innerHTML = `<div class="glass-card p-6 text-center text-xs text-purple-300 rounded-xl">Sección de Playlists Activa</div>`;
                }
              }

              function openEditModal() {
                const t = tracks[currentTrackIndex]; if(!t) return;
                document.getElementById("editTitle").value = t.title;
                document.getElementById("editArtist").value = t.artist;
                document.getElementById("editAlbum").value = t.album;
                openModal("editModal");
              }

              function saveTrackEdits() {
                const t = tracks[currentTrackIndex]; if(!t) return;
                t.title = document.getElementById("editTitle").value;
                t.artist = document.getElementById("editArtist").value;
                t.album = document.getElementById("editAlbum").value;
                const coverFile = document.getElementById("editCoverFile").files[0];
                const save = () => {
                  customOverrides[t.id] = { title: t.title, artist: t.artist, album: t.album, cover: t.cover };
                  localStorage.setItem("cosmos_overrides_v7", JSON.stringify(customOverrides));
                  loadTrack(currentTrackIndex, isPlaying);
                };
                if(coverFile) {
                  const reader = new FileReader();
                  reader.onload = e => { t.cover = e.target.result; save(); };
                  reader.readAsDataURL(coverFile);
                } else save();
                closeModal("editModal");
              }

              function updateEqBand(i,v){} function applyEqPreset(p){} function setSleepTimer(m){}
              function openModal(id) { document.getElementById(id).classList.remove("hidden"); document.getElementById(id).classList.add("flex"); }
              function closeModal(id) { document.getElementById(id).classList.add("hidden"); document.getElementById(id).classList.remove("flex"); }

              window.addEventListener("DOMContentLoaded", () => {
                const c = document.getElementById("chromaBars");
                for(let i=0; i<12; i++) c.innerHTML += `<div id="chroma-bar-${i}" class="bg-gradient-to-t from-purple-700 via-fuchsia-400 to-white rounded-t transition-all duration-100" style="height:10%"></div>`;
                rescanPhoneLibrary();
              });
            </script>
          </body>
          </html>
          EOF

          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK Generado
        uses: actions/upload-artifact@v4
        with:
          name: COSMOS-Belmont-Edition-APK
          path: app/build/outputs/apk/debug/app-debug.apk
