            <audio id="audioElement" preload="auto" crossorigin="anonymous"></audio>

            <script>
              window.defaultLogoDataUri = "data:image/svg+xml;utf8," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300"><rect width="300" height="300" fill="#06020d"/><circle cx="150" cy="150" r="110" fill="none" stroke="#a855f7" stroke-width="3" opacity="0.5"/><path d="M80 138 A72 72 0 0 1 220 138" fill="none" stroke="#f0abfc" stroke-width="6" stroke-linecap="round"/><polygon points="150,55 88,168 122,168 150,108" fill="#f5d0fe"/><polygon points="150,55 212,168 178,168 150,108" fill="#a855f7"/><polygon points="124,162 150,235 176,162 150,184" fill="#c084fc"/><polygon points="150,122 162,146 150,170 138,146" fill="#ffffff"/></svg>`);

              const headerLogo = document.getElementById("headerLogoImg");
              headerLogo.onerror = function() { this.src = window.defaultLogoDataUri; };

              let tracks = [];
              let customOverrides = JSON.parse(localStorage.getItem("cosmos_overrides_2027")) || {};
              let likedTrackIds = JSON.parse(localStorage.getItem("cosmos_likes_2027")) || [];
              let userPlaylists = JSON.parse(localStorage.getItem("cosmos_playlists_2027")) || [
                { id: "pl_default_1", name: "Sesión Nocturna ✨", tracks: [] }
              ];

              let currentTab = "songs", currentTrackIndex = -1, actionSheetTrackIdx = -1, pendingAddTrackIdx = -1;
              let activePlaylistViewId = null;
              let isPlaying = false, isPlayerModalOpen = false, shuffleMode = false, repeatMode = 0;
              let activePresetName = "Space Rock", sleepTimerId = null;

              function showToast(msg) {
                const t = document.getElementById("cosmosToast");
                t.textContent = msg;
                t.style.opacity = "1";
                setTimeout(() => { t.style.opacity = "0"; }, 2000);
              }

              function updateBentoCounters() {
                document.getElementById("bentoLikesCount").textContent = `${likedTrackIds.length} pistas`;
                document.getElementById("bentoPlaylistsCount").textContent = `${userPlaylists.length} listas`;
              }

              const eqPresets = {
                "Space Rock": [5, 2, 0, 4, 6],
                "Gothic Rock": [6, 4, -1, 3, 5],
                "Love Metal": [6, 3, -1, 5, 6],
                "Symphonic": [5, 2, 1, 5, 7],
                "Metal": [7, 3, -3, 5, 7],
                "Rock": [5, 3, -1, 4, 5],
                "Pop": [2, 3, 4, 3, 3],
                "Acoustic": [3, 2, 1, 4, 5],
                "Bass Boost": [9, 6, 0, 1, 2],
                "Vocal": [-2, 1, 6, 5, 2],
                "Synthwave": [7, 4, -1, 3, 6],
                "Salsa": [4, 3, 3, 4, 5],
                "Cumbia": [7, 5, 1, 3, 4],
                "Jazz": [4, 2, -1, 3, 4],
                "Classical": [3, 1, 0, 3, 5],
                "Plano": [0, 0, 0, 0, 0]
              };

              function renderEqButtons() {
                const container = document.getElementById("eqPresetContainer");
                container.innerHTML = "";
                Object.keys(eqPresets).forEach(name => {
                  const btn = document.createElement("button");
                  const isAct = name === activePresetName;
                  btn.className = isAct
                    ? "px-2 py-1.5 rounded-xl text-[10px] font-bold bg-gradient-to-r from-purple-600 to-fuchsia-600 text-white border border-fuchsia-300 truncate"
                    : "px-2 py-1.5 rounded-xl text-[10px] glass-pill text-purple-300 truncate";
                  btn.textContent = name;
                  btn.onclick = () => applyEqPreset(name);
                  container.appendChild(btn);
                });
              }

              window.onNativeLibraryLoaded = function(jsonArray) {
                try {
                  const list = typeof jsonArray === "string" ? JSON.parse(jsonArray) : jsonArray;
                  tracks = list.map(item => {
                    const saved = customOverrides[item.id] || {};
                    return {
                      id: item.id,
                      mediaId: item.mediaId || 0,
                      title: saved.title || item.title,
                      artist: saved.artist || item.artist,
                      album: saved.album || item.album,
                      albumId: item.albumId !== undefined ? item.albumId : -1,
                      durationMs: item.durationMs || 0,
                      thumb: saved.cover || item.thumb || item.cover || "ic_launcher.png",
                      cover: saved.cover || item.cover || "ic_launcher.png",
                      audioUrl: item.audioUrl
                    };
                  });
                  updateBentoCounters();
                  renderLibrary();
                  if (tracks.length > 0 && currentTrackIndex === -1) loadTrack(0, false);
                } catch(e) {}
              };

              function rescanPhoneLibrary() { if(window.CosmosNative) window.CosmosNative.rescanMediaStore(); }

              function notifyNativeAndroidService() {
                if(window.CosmosNative && currentTrackIndex >= 0 && tracks[currentTrackIndex]) {
                  const t = tracks[currentTrackIndex];
                  const durMs = Math.round((audioEl.duration || (t.durationMs / 1000) || 0) * 1000);
                  const posMs = Math.round((audioEl.currentTime || 0) * 1000);
                  window.CosmosNative.updateNotification(t.title, t.artist, t.album, t.albumId || -1, durMs, posMs, isPlaying);
                }
              }

              // =========================================================================
              // SISTEMA DE ME GUSTA (ACTUALIZACION O(1) SIN RE-RENDERIZAR TODA LA LISTA)
              // =========================================================================
              function isTrackLiked(trackId) {
                return likedTrackIds.includes(trackId);
              }

              function toggleLikeByIdx(idx, ev) {
                if (ev) ev.stopPropagation();
                const t = tracks[idx];
                if (!t) return;
                const pos = likedTrackIds.indexOf(t.id);
                const nowLiked = pos === -1;
                if (pos >= 0) {
                  likedTrackIds.splice(pos, 1);
                  showToast("Quitado de Tus Me Gusta");
                } else {
                  likedTrackIds.push(t.id);
                  showToast("❤️ Añadido a Tus Me Gusta");
                }
                localStorage.setItem("cosmos_likes_2027", JSON.stringify(likedTrackIds));
                updateLikeButtonsUI();
                updateBentoCounters();

                // Actualizar solo el boton de esa fila sin reconstruir el DOM
                const rowHeartBtn = document.getElementById(`row-like-btn-${idx}`);
                if (rowHeartBtn) {
                  rowHeartBtn.className = `w-8 h-8 rounded-full flex items-center justify-center ${nowLiked ? 'text-pink-500' : 'text-purple-300/50'}`;
                  rowHeartBtn.innerHTML = `<i class="${nowLiked ? 'fa-solid' : 'fa-regular'} fa-heart text-xs"></i>`;
                }
                if (currentTab === "favorites") renderLibrary();
              }

              function toggleLikeCurrent() {
                if (currentTrackIndex >= 0) toggleLikeByIdx(currentTrackIndex);
              }

              function updateLikeButtonsUI() {
                if (currentTrackIndex < 0 || !tracks[currentTrackIndex]) return;
                const liked = isTrackLiked(tracks[currentTrackIndex].id);
                const miniBtn = document.getElementById("miniLikeBtn");
                const fullBtn = document.getElementById("fullLikeBtn");
                const iconHtml = liked
                  ? '<i class="fa-solid fa-heart text-pink-500"></i>'
                  : '<i class="fa-regular fa-heart"></i>';
                if (miniBtn) miniBtn.innerHTML = iconHtml;
                if (fullBtn) fullBtn.innerHTML = iconHtml;
              }

              function openActionSheet(idx) {
                if (idx < 0 || !tracks[idx]) return;
                actionSheetTrackIdx = idx;
                const t = tracks[idx];
                if (navigator.vibrate) navigator.vibrate(20);
                setImageWithFallback(document.getElementById("sheetTrackCover"), t.thumb);
                document.getElementById("sheetTrackTitle").textContent = t.title;
                document.getElementById("sheetTrackArtist").textContent = `${t.artist} • ${t.album}`;
                const liked = isTrackLiked(t.id);
                document.getElementById("sheetLikeIcon").className = liked
                  ? "fa-solid fa-heart text-pink-500 text-base w-5 text-center"
                  : "fa-regular fa-heart text-pink-400 text-base w-5 text-center";
                document.getElementById("sheetLikeText").textContent = liked
                  ? "Quitar de Tus Me Gusta"
                  : "Añadir a Tus Me Gusta ❤️";
                openModal("actionSheetModal");
              }

              function sheetToggleLike() {
                toggleLikeByIdx(actionSheetTrackIdx);
                closeModal("actionSheetModal");
              }

              function sheetAddToPlaylist() {
                closeModal("actionSheetModal");
                openAddToPlaylistModal(actionSheetTrackIdx);
              }

              function sheetShareTrack() {
                closeModal("actionSheetModal");
                shareTrack(actionSheetTrackIdx);
              }

              function sheetEditTrack() {
                closeModal("actionSheetModal");
                currentTrackIndex = actionSheetTrackIdx;
                openEditModal();
              }

              function shareTrack(idx) {
                const t = tracks[idx];
                if (!t) return;
                if (window.CosmosNative && window.CosmosNative.shareTrackNative) {
                  window.CosmosNative.shareTrackNative(t.mediaId || 0, t.title, t.artist, t.album);
                } else if (navigator.share) {
                  navigator.share({ title: t.title, text: `🎵 Escuchando "${t.title}" de ${t.artist} en COSMOS` }).catch(()=>{});
                }
              }

              function openCreatePlaylistModal(fromSelector = false) {
                if (!fromSelector) pendingAddTrackIdx = -1;
                document.getElementById("newPlaylistNameInput").value = "";
                openModal("createPlaylistModal");
              }

              function confirmCreatePlaylist() {
                const name = document.getElementById("newPlaylistNameInput").value.trim();
                if (!name) return;
                const newPl = { id: "pl_" + Date.now(), name: name, tracks: [] };
                if (pendingAddTrackIdx >= 0 && tracks[pendingAddTrackIdx]) {
                  newPl.tracks.push(tracks[pendingAddTrackIdx].id);
                  showToast(`✨ Creada y añadida a "${name}"`);
                } else {
                  showToast(`✨ Playlist "${name}" creada`);
                }
                userPlaylists.push(newPl);
                localStorage.setItem("cosmos_playlists_2027", JSON.stringify(userPlaylists));
                pendingAddTrackIdx = -1;
                updateBentoCounters();
                closeModal("createPlaylistModal");
                if (currentTab === "playlists") renderLibrary();
              }

              function openAddToPlaylistModal(idx) {
                if (idx < 0 || !tracks[idx]) return;
                pendingAddTrackIdx = idx;
                const listEl = document.getElementById("playlistSelectorList");
                listEl.innerHTML = "";
                const trackId = tracks[idx].id;

                userPlaylists.forEach(pl => {
                  const alreadyIn = pl.tracks.includes(trackId);
                  const btn = document.createElement("button");
                  btn.className = "w-full p-3 rounded-2xl glass-pill flex items-center justify-between text-left active:scale-98";
                  btn.innerHTML = `
                    <div class="flex items-center gap-3 min-w-0">
                      <div class="w-9 h-9 rounded-xl bg-purple-900/80 border border-fuchsia-400/30 flex items-center justify-center text-fuchsia-300 shrink-0">
                        <i class="fa-solid fa-music text-xs"></i>
                      </div>
                      <div class="min-w-0">
                        <div class="text-xs font-bold text-white truncate">${pl.name}</div>
                        <div class="text-[10px] text-purple-300/70">${pl.tracks.length} canciones</div>
                      </div>
                    </div>
                    <span class="text-xs font-bold ${alreadyIn ? 'text-fuchsia-400' : 'text-purple-300'}">${alreadyIn ? '✓ Añadida' : '+ Añadir'}</span>
                  `;
                  btn.onclick = () => {
                    if (!alreadyIn) {
                      pl.tracks.push(trackId);
                      localStorage.setItem("cosmos_playlists_2027", JSON.stringify(userPlaylists));
                      showToast(`🎵 Añadida a "${pl.name}"`);
                    } else {
                      showToast(`Ya estaba en "${pl.name}"`);
                    }
                    closeModal("addToPlaylistModal");
                    if (currentTab === "playlists") renderLibrary();
                  };
                  listEl.appendChild(btn);
                });
                openModal("addToPlaylistModal");
              }

              function deletePlaylist(plId, ev) {
                if (ev) ev.stopPropagation();
                userPlaylists = userPlaylists.filter(p => p.id !== plId);
                localStorage.setItem("cosmos_playlists_2027", JSON.stringify(userPlaylists));
                updateBentoCounters();
                renderLibrary();
                showToast("Playlist eliminada");
              }

              function removeTrackFromPlaylist(plId, trackId, ev) {
                if (ev) ev.stopPropagation();
                const pl = userPlaylists.find(p => p.id === plId);
                if (!pl) return;
                pl.tracks = pl.tracks.filter(id => id !== trackId);
                localStorage.setItem("cosmos_playlists_2027", JSON.stringify(userPlaylists));
                renderLibrary();
                showToast("Quitada de la playlist");
              }

              function playRandomMix() {
                if (!tracks.length) return;
                shuffleMode = true;
                document.getElementById("shuffleBtn").className = "w-10 h-10 rounded-full flex items-center justify-center text-fuchsia-400";
                const rnd = Math.floor(Math.random() * tracks.length);
                loadTrack(rnd, true);
                showToast("🔀 Mix Cosmos Activado");
              }

              // =========================================================================
              // MOTOR DE AUDIO TURBO (TABLA LUT PRECALCULADA + HIBERNACION EN BLUETOOTH)
              // =========================================================================
              let audioCtx = null, analyser = null, mediaSource = null, masterGainNode = null, isSourceConnected = false, eqFilters = [];
              let chordDetectionMode = "triad";
              const NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
              let smoothedRoot = new Float32Array(12), smoothedChroma = new Float32Array(12);
              let fftDbBuffer = null, chromaBarEls = [];
              let binPitchLut = null, binRootWeightLut = null, minGuitarBin = 2, maxGuitarBin = 100;
              let lockedPitch = -1, lockedQuality = "", prevChordName = "--", lockTime = 0, challenger = -1, challengerCount = 0;
              const HOLD_MS = 1350;
              const audioEl = document.getElementById("audioElement");

              let detectedBpm = 120, prevLowEnergy = 0, lastPeakTime = 0;
              let onsetIntervals = [], tapTimes = [];
              let metronomeSoundEnabled = false, currentBeatIndex = 0, nextBeatTime = 0;

              window.setDuckVolume = function(val) {
                if (masterGainNode && audioCtx) {
                  masterGainNode.gain.setTargetAtTime(val, audioCtx.currentTime, 0.08);
                } else {
                  audioEl.volume = val;
                }
              };

              function buildFastGuitarLookupTable(sampleRate, fftSize) {
                const binCount = fftSize / 2;
                const binW = sampleRate / fftSize;
                binPitchLut = new Int8Array(binCount);
                binRootWeightLut = new Float32Array(binCount);
                minGuitarBin = Math.max(2, Math.floor(65 / binW));
                maxGuitarBin = Math.min(binCount - 3, Math.ceil(780 / binW));

                for (let b = minGuitarBin; b <= maxGuitarBin; b++) {
                  const freq = b * binW;
                  const p = ((Math.round(12 * Math.log2(freq / 440) + 69) % 12) + 12) % 12;
                  binPitchLut[b] = p;
                  if (freq >= 78 && freq <= 400) {
                    binRootWeightLut[b] = freq < 220 ? 1.75 : 1.25;
                  } else {
                    binRootWeightLut[b] = 0;
                  }
                }
              }

              function initAudioEngine() {
                if (!audioCtx) {
                  try {
                    const AC = window.AudioContext || window.webkitAudioContext;
                    audioCtx = new AC({ latencyHint: "playback", sampleRate: 48000 });
                    analyser = audioCtx.createAnalyser();
                    analyser.fftSize = 2048;
                    analyser.smoothingTimeConstant = 0.80;
                    masterGainNode = audioCtx.createGain();
                    masterGainNode.gain.value = 1.0;
                    fftDbBuffer = new Float32Array(analyser.frequencyBinCount);
                    buildFastGuitarLookupTable(audioCtx.sampleRate, analyser.fftSize);
                  } catch (e) {}
                }
                if (audioCtx && audioCtx.state === "suspended") {
                  audioCtx.resume();
                }
                if (!isSourceConnected && audioEl && audioCtx) {
                  try {
                    mediaSource = audioCtx.createMediaElementSource(audioEl);
                    const freqs = [60, 230, 910, 3600, 14000];
                    const initialGains = eqPresets[activePresetName] || [0,0,0,0,0];
                    eqFilters = freqs.map((f, i) => {
                      const filter = audioCtx.createBiquadFilter();
                      filter.type = "peaking";
                      filter.frequency.value = f;
                      filter.gain.value = initialGains[i];
                      filter.Q.value = 1.0;
                      return filter;
                    });
                    let curr = mediaSource;
                    eqFilters.forEach(f => { curr.connect(f); curr = f; });
                    curr.connect(analyser);
                    analyser.connect(masterGainNode);
                    masterGainNode.connect(audioCtx.destination);
                    isSourceConnected = true;
                  } catch (e) {
                    isSourceConnected = true;
                  }
                }
              }

              // Vigilante Bluetooth: mantiene el AudioContext despierto con 0% de carga de CPU
              setInterval(() => {
                if (isPlaying && audioCtx && audioCtx.state === "suspended") {
                  audioCtx.resume();
                }
              }, 2000);

              // Analizador DSP Inteligente: SOLO corre cuando el reproductor grande esta abierto y visible
              setInterval(() => {
                if (!isPlaying || !isPlayerModalOpen || document.hidden || !analyser || !audioCtx || !fftDbBuffer || !binPitchLut) return;

                analyser.getFloatFrequencyData(fftDbBuffer);
                const instRoot = new Float32Array(12);
                const instChroma = new Float32Array(12);
                let lowRhythmEnergy = 0;

                for (let b = minGuitarBin; b <= maxGuitarBin; b++) {
                  const db = fftDbBuffer[b];
                  if (db > -74) {
                    const mag = Math.pow(10, db * 0.05);
                    if (b < minGuitarBin + 8) lowRhythmEnergy += mag;
                    if (db >= fftDbBuffer[b - 1] && db >= fftDbBuffer[b + 1]) {
                      const p = binPitchLut[b];
                      instChroma[p] += mag;
                      const rw = binRootWeightLut[b];
                      if (rw > 0) instRoot[p] += mag * rw;
                    }
                  }
                }

                const now = performance.now();
                if (lowRhythmEnergy > prevLowEnergy * 1.38 && lowRhythmEnergy > 0.012 && (now - lastPeakTime) > 260) {
                  const interval = now - lastPeakTime;
                  lastPeakTime = now;
                  if (interval >= 320 && interval <= 1050) {
                    let candidateBpm = 60000 / interval;
                    while (candidateBpm < 75) candidateBpm *= 2;
                    while (candidateBpm > 165) candidateBpm /= 2;
                    onsetIntervals.push(candidateBpm);
                    if (onsetIntervals.length > 10) onsetIntervals.shift();
                    if (onsetIntervals.length >= 4) {
                      const sorted = [...onsetIntervals].sort((a, b) => a - b);
                      const median = sorted[Math.floor(sorted.length / 2)];
                      detectedBpm = Math.round(detectedBpm * 0.85 + median * 0.15);
                      updateBpmUI();
                    }
                  }
                }
                prevLowEnergy = lowRhythmEnergy * 0.75 + prevLowEnergy * 0.25;

                let sig = 0;
                for (let i = 0; i < 12; i++) {
                  smoothedRoot[i] = smoothedRoot[i] * 0.80 + instRoot[i] * 0.20;
                  smoothedChroma[i] = smoothedChroma[i] * 0.78 + instChroma[i] * 0.22;
                  sig += smoothedRoot[i];
                }

                let maxR = 0.00001;
                for (let i = 0; i < 12; i++) if (smoothedRoot[i] > maxR) maxR = smoothedRoot[i];

                for (let i = 0; i < 12; i++) {
                  const bar = chromaBarEls[i];
                  if (bar) {
                    const scale = Math.max(0.12, smoothedRoot[i] / maxR);
                    bar.style.transform = `scaleY(${scale.toFixed(2)})`;
                    bar.style.opacity = i === lockedPitch ? "1" : "0.42";
                  }
                }

                if (sig > 0.0012) {
                  let bestIdx = 0;
                  for (let i = 1; i < 12; i++) if (smoothedRoot[i] > smoothedRoot[bestIdx]) bestIdx = i;

                  const elapsed = now - lockTime;
                  const barElem = document.getElementById("measureLockBar");
                  if (barElem) barElem.style.width = `${Math.min(100, Math.round((elapsed / HOLD_MS) * 100))}%`;

                  if (lockedPitch === -1) {
                    lockChord(bestIdx, now);
                  } else if (bestIdx !== lockedPitch) {
                    if (smoothedRoot[bestIdx] > smoothedRoot[lockedPitch] * (elapsed < HOLD_MS ? 1.35 : 1.14)) {
                      if (challenger === bestIdx) challengerCount++; else { challenger = bestIdx; challengerCount = 1; }
                      if (challengerCount >= 4) lockChord(bestIdx, now);
                    } else {
                      challengerCount = Math.max(0, challengerCount - 1);
                    }
                  } else {
                    challengerCount = 0;
                  }
                }
              }, 65);

              // Reloj del Metronomo: solo actualiza LEDs si el reproductor grande esta abierto o el clic sonoro activo
              setInterval(() => {
                if (!isPlaying || (!isPlayerModalOpen && !metronomeSoundEnabled)) return;
                const now = performance.now();
                const beatIntervalMs = 60000 / Math.max(40, Math.min(220, detectedBpm));
                if (now >= nextBeatTime) {
                  nextBeatTime = now + beatIntervalMs;
                  currentBeatIndex = (currentBeatIndex + 1) % 4;
                  if (isPlayerModalOpen && !document.hidden) {
                    for (let i = 0; i < 4; i++) {
                      const led = document.getElementById(`beat-${i}`);
                      if (led) {
                        led.className = i === currentBeatIndex
                          ? (i === 0 ? "w-2.5 h-2.5 rounded-full bg-white border border-fuchsia-300 shadow-[0_0_8px_#fff] scale-125" : "w-2.5 h-2.5 rounded-full bg-fuchsia-400 border border-fuchsia-200 scale-110")
                          : "w-2.5 h-2.5 rounded-full bg-purple-950 border border-purple-600/40";
                      }
                    }
                  }
                  if (metronomeSoundEnabled && audioCtx) {
                    playMetronomeClick(currentBeatIndex === 0);
                  }
                }
              }, 30);

              function playMetronomeClick(isAccent) {
                try {
                  const osc = audioCtx.createOscillator();
                  const gain = audioCtx.createGain();
                  osc.type = "triangle";
                  osc.frequency.setValueAtTime(isAccent ? 1200 : 850, audioCtx.currentTime);
                  gain.gain.setValueAtTime(0.22, audioCtx.currentTime);
                  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.045);
                  osc.connect(gain);
                  gain.connect(audioCtx.destination);
                  osc.start(audioCtx.currentTime);
                  osc.stop(audioCtx.currentTime + 0.05);
                } catch (e) {}
              }

              function toggleMetronomeSound() {
                initAudioEngine();
                metronomeSoundEnabled = !metronomeSoundEnabled;
                const btn = document.getElementById("metroSoundBtn");
                const icon = document.getElementById("metroIcon");
                if (metronomeSoundEnabled) {
                  btn.className = "px-3 h-7 rounded-full bg-fuchsia-600 border border-fuchsia-300 text-[10px] text-white font-bold flex items-center gap-1";
                  icon.className = "fa-solid fa-volume-high";
                } else {
                  btn.className = "px-3 h-7 rounded-full glass-pill text-[10px] text-purple-200 font-semibold flex items-center gap-1";
                  icon.className = "fa-solid fa-volume-xmark";
                }
              }

              function adjustBpm(delta) {
                detectedBpm = Math.max(40, Math.min(220, detectedBpm + delta));
                updateBpmUI();
              }

              function tapTempo() {
                const now = performance.now();
                tapTimes.push(now);
                if (tapTimes.length > 5) tapTimes.shift();
                if (tapTimes.length >= 2) {
                  let sum = 0;
                  for (let i = 1; i < tapTimes.length; i++) sum += (tapTimes[i] - tapTimes[i - 1]);
                  const avg = sum / (tapTimes.length - 1);
                  if (avg > 250 && avg < 1500) {
                    detectedBpm = Math.round(60000 / avg);
                    updateBpmUI();
                  }
                }
              }

              function updateBpmUI() {
                document.getElementById("bpmValueDisplay").textContent = detectedBpm;
                document.getElementById("miniBpmBadge").textContent = `${detectedBpm} BPM`;
              }

              function lockChord(pitch, now) {
                if(lockedPitch !== -1) prevChordName = formatChord(lockedPitch, lockedQuality);
                lockedPitch = pitch; lockTime = now; challengerCount = 0;
                const min3 = smoothedChroma[(pitch + 3) % 12];
                const maj3 = smoothedChroma[(pitch + 4) % 12];
                lockedQuality = min3 > maj3 * 1.12 ? "m" : "";
                renderChordUI();
              }

              function formatChord(p, q) {
                if(p < 0) return "--";
                return chordDetectionMode === "power" ? NOTE_NAMES[p] + "5" : NOTE_NAMES[p] + q;
              }

              function renderChordUI() {
                const cur = formatChord(lockedPitch, lockedQuality);
                document.getElementById("miniChordBadge").textContent = cur;
                document.getElementById("currentChordBox").textContent = cur;
                document.getElementById("prevChordBox").textContent = prevChordName;
                document.getElementById("nextChordBox").textContent = `${NOTE_NAMES[lockedPitch]}5 (${NOTE_NAMES[(lockedPitch + 7) % 12]})`;
              }

              function toggleChordMode() {
                chordDetectionMode = chordDetectionMode === "power" ? "triad" : "power";
                document.getElementById("chordModeBtn").textContent = chordDetectionMode === "power" ? "Power / 5ta" : "Tríadas (m/Maj)";
                if(lockedPitch !== -1) renderChordUI();
              }

              function applyEqPreset(name) {
                const gains = eqPresets[name];
                if (!gains) return;
                activePresetName = name;
                document.getElementById("fullGenreBadge").textContent = `EQ: ${name}`;
                gains.forEach((val, idx) => {
                  const slider = document.getElementById(`eq-${idx}`);
                  if (slider) slider.value = val;
                  updateEqBand(idx, val);
                });
                renderEqButtons();
              }

              function updateEqBand(index, val) {
                initAudioEngine();
                if (eqFilters && eqFilters[index]) {
                  eqFilters[index].gain.value = parseFloat(val);
                }
                const valLabel = document.getElementById(`eq-val-${index}`);
                if (valLabel) valLabel.textContent = (val > 0 ? "+" : "") + val + "dB";
              }

              function setImageWithFallback(imgEl, srcUrl) {
                imgEl.onerror = function() {
                  this.onerror = function() { this.src = window.defaultLogoDataUri; };
                  this.src = "ic_launcher.png";
                };
                imgEl.src = srcUrl || "ic_launcher.png";
              }

              // Cambio de pista ultra rapido O(1) sin reconstruir toda la lista del DOM
              function highlightActiveRow(prevIdx, newIdx) {
                if (prevIdx >= 0) {
                  const oldRow = document.getElementById(`song-row-${prevIdx}`);
                  const oldTitle = document.getElementById(`song-title-${prevIdx}`);
                  if (oldRow) oldRow.classList.remove("song-row-active");
                  if (oldTitle) { oldTitle.classList.remove("text-fuchsia-300"); oldTitle.classList.add("text-white"); }
                }
                if (newIdx >= 0) {
                  const newRow = document.getElementById(`song-row-${newIdx}`);
                  const newTitle = document.getElementById(`song-title-${newIdx}`);
                  if (newRow) newRow.classList.add("song-row-active");
                  if (newTitle) { newTitle.classList.remove("text-white"); newTitle.classList.add("text-fuchsia-300"); }
                }
              }

              function loadTrack(idx, autoPlay=false) {
                if(idx < 0 || idx >= tracks.length) return;
                const prevIdx = currentTrackIndex;
                currentTrackIndex = idx;
                const t = tracks[idx];
                lockedPitch = -1; prevChordName = "--"; onsetIntervals = [];
                setImageWithFallback(document.getElementById("miniCover"), t.thumb);
                setImageWithFallback(document.getElementById("fullCover"), t.cover);
                document.getElementById("miniTitle").textContent = t.title;
                document.getElementById("miniArtist").textContent = t.artist;
                document.getElementById("fullTitle").textContent = t.title;
                document.getElementById("fullArtist").textContent = t.artist;
                document.getElementById("fullAlbumName").textContent = t.album;
                audioEl.src = t.audioUrl;
                audioEl.load();
                updateLikeButtonsUI();
                highlightActiveRow(prevIdx, idx);
                notifyNativeAndroidService();
                if(autoPlay) playAudio();
              }

              function togglePlay() {
                if(!tracks.length) { rescanPhoneLibrary(); return; }
                initAudioEngine();
                isPlaying ? pauseAudio() : playAudio();
              }

              function playAudio() {
                initAudioEngine();
                isPlaying = true;
                nextBeatTime = performance.now();
                updatePlayButtons(true);
                audioEl.play().catch(()=>{});
                notifyNativeAndroidService();
              }

              function pauseAudio() {
                isPlaying = false;
                updatePlayButtons(false);
                audioEl.pause();
                notifyNativeAndroidService();
              }

              function updatePlayButtons(p) {
                const icon = p ? '<i class="fa-solid fa-pause"></i>' : '<i class="fa-solid fa-play"></i>';
                document.getElementById("miniPlayBtn").innerHTML = icon;
                document.getElementById("fullPlayBtn").innerHTML = icon;
              }

              function prevTrack() { if(tracks.length) loadTrack((currentTrackIndex - 1 + tracks.length) % tracks.length, true); }
              function nextTrack() {
                if(!tracks.length) return;
                if(repeatMode === 2) { audioEl.currentTime = 0; playAudio(); return; }
                const nextIdx = shuffleMode ? Math.floor(Math.random() * tracks.length) : (currentTrackIndex + 1) % tracks.length;
                loadTrack(nextIdx, true);
              }

              function toggleShuffle() {
                shuffleMode = !shuffleMode;
                document.getElementById("shuffleBtn").className = shuffleMode
                  ? "w-10 h-10 rounded-full flex items-center justify-center text-fuchsia-400"
                  : "w-10 h-10 rounded-full flex items-center justify-center text-purple-400/50";
              }

              function cycleRepeat() {
                repeatMode = (repeatMode + 1) % 3;
                const btn = document.getElementById("repeatBtn");
                const badge = document.getElementById("repeatOneBadge");
                btn.className = repeatMode > 0
                  ? "w-10 h-10 rounded-full flex items-center justify-center text-fuchsia-400 relative"
                  : "w-10 h-10 rounded-full flex items-center justify-center text-purple-400/50 relative";
                badge.classList.toggle("hidden", repeatMode !== 2);
              }

              audioEl.addEventListener("play", () => initAudioEngine());
              let lastTimeUpdateMs = 0;
              audioEl.addEventListener("timeupdate", () => {
                const now = performance.now();
                if (now - lastTimeUpdateMs > 250) {
                  lastTimeUpdateMs = now;
                  updateTimeUI(audioEl.currentTime, audioEl.duration || 0);
                }
              });
              audioEl.addEventListener("loadedmetadata", () => notifyNativeAndroidService());
              audioEl.addEventListener("ended", nextTrack);

              function seekAudio(val) {
                if(audioEl.duration) {
                  audioEl.currentTime = (val / 100) * audioEl.duration;
                  notifyNativeAndroidService();
                }
              }

              window.seekToMs = function(ms) {
                audioEl.currentTime = ms / 1000;
                notifyNativeAndroidService();
              };

              function updateTimeUI(cur, tot) {
                const fmt = s => `${Math.floor(s/60)}:${Math.floor(s%60)<10?'0':''}${Math.floor(s%60)}`;
                document.getElementById("miniSeek").value = tot ? (cur/tot)*100 : 0;
                if (isPlayerModalOpen) {
                  document.getElementById("fullSeek").value = tot ? (cur/tot)*100 : 0;
                  document.getElementById("fullCurrentTime").textContent = fmt(cur);
                  document.getElementById("fullDuration").textContent = fmt(tot);
                }
                document.getElementById("miniCurrentTime").textContent = fmt(cur);
                document.getElementById("miniDuration").textContent = fmt(tot);
              }

              function setSleepTimer(mins) {
                if (sleepTimerId) { clearTimeout(sleepTimerId); sleepTimerId = null; }
                const label = document.getElementById("timerText");
                if (mins > 0) {
                  label.textContent = `${mins}m`;
                  sleepTimerId = setTimeout(() => { pauseAudio(); label.textContent = "Off"; }, mins * 60000);
                } else {
                  label.textContent = "Off";
                }
                closeModal("timerModal");
              }

              function switchTab(tab) {
                currentTab = tab;
                activePlaylistViewId = null;
                ["songs", "favorites", "playlists", "artists", "albums"].forEach(t => {
                  const btn = document.getElementById(`tab-${t}`);
                  if (!btn) return;
                  btn.className = t === tab
                    ? "px-4 py-1.5 rounded-full text-xs font-bold bg-gradient-to-r from-purple-600 to-fuchsia-600 text-white shadow-md whitespace-nowrap flex items-center gap-1"
                    : "px-4 py-1.5 rounded-full text-xs font-semibold glass-pill text-purple-200/85 whitespace-nowrap flex items-center gap-1";
                });
                renderLibrary();
              }

              // Fila ligera a 120 FPS con miniaturas comprimidas y carga diferida
              function createSongRowElement(track, idx, extraRightHtml = "") {
                const isCur = idx === currentTrackIndex;
                const liked = isTrackLiked(track.id);
                const div = document.createElement("div");
                div.id = `song-row-${idx}`;
                div.className = `p-2.5 rounded-2xl flex items-center justify-between gap-3 cursor-pointer song-row-fast ${isCur ? "song-row-active" : ""}`;

                let pressTimer = null;
                let longPressTriggered = false;

                div.addEventListener("touchstart", () => {
                  longPressTriggered = false;
                  pressTimer = setTimeout(() => {
                    longPressTriggered = true;
                    openActionSheet(idx);
                  }, 460);
                }, { passive: true });

                div.addEventListener("touchend", () => { if (pressTimer) clearTimeout(pressTimer); });
                div.addEventListener("touchmove", () => { if (pressTimer) clearTimeout(pressTimer); });
                div.oncontextmenu = (e) => { e.preventDefault(); openActionSheet(idx); return false; };

                const mainArea = document.createElement("div");
                mainArea.className = "flex items-center gap-3 min-w-0 flex-1";
                mainArea.onclick = () => { if (!longPressTriggered) loadTrack(idx, true); };
                mainArea.innerHTML = `
                  <img src="${track.thumb}" loading="lazy" decoding="async" onerror="this.onerror=null;this.src='ic_launcher.png';" class="w-12 h-12 cover-row object-cover shrink-0 bg-purple-950" />
                  <div class="min-w-0 flex-1">
                    <h4 id="song-title-${idx}" class="text-sm font-bold ${isCur ? "text-fuchsia-300" : "text-white"} truncate">${track.title}</h4>
                    <p class="text-xs text-purple-300/70 truncate">${track.artist} • ${track.album}</p>
                  </div>
                `;

                const actionsArea = document.createElement("div");
                actionsArea.className = "flex items-center gap-1 shrink-0";
                actionsArea.innerHTML = `
                  ${extraRightHtml}
                  <button id="row-like-btn-${idx}" onclick="toggleLikeByIdx(${idx}, event)" class="w-8 h-8 rounded-full flex items-center justify-center ${liked ? 'text-pink-500' : 'text-purple-300/50'}">
                    <i class="${liked ? 'fa-solid' : 'fa-regular'} fa-heart text-xs"></i>
                  </button>
                  <button onclick="event.stopPropagation(); openActionSheet(${idx});" class="w-8 h-8 rounded-full flex items-center justify-center text-purple-300/75">
                    <i class="fa-solid fa-ellipsis-vertical text-xs"></i>
                  </button>
                `;

                div.appendChild(mainArea);
                div.appendChild(actionsArea);
                return div;
              }

              function renderLibrary(filterField = null, filterValue = null) {
                const container = document.getElementById("libraryContainer");
                const query = document.getElementById("searchInput").value.toLowerCase();
                document.getElementById("countSongs").textContent = tracks.length;
                container.innerHTML = "";

                if(tracks.length === 0) {
                  container.innerHTML = `<div class="card-2027 rounded-3xl p-8 text-center my-6"><h3 class="text-sm font-bold text-white mb-1">Escaneando tu Música...</h3><button onclick="rescanPhoneLibrary()" class="mt-3 px-6 py-2.5 rounded-full bg-gradient-to-r from-purple-600 to-fuchsia-600 text-white text-xs font-bold shadow-lg">Escanear Memoria</button></div>`;
                  return;
                }

                const frag = document.createDocumentFragment();
                let filtered = tracks.filter(t => t.title.toLowerCase().includes(query) || t.artist.toLowerCase().includes(query) || t.album.toLowerCase().includes(query));

                if(filterField && filterValue) {
                  filtered = filtered.filter(t => t[filterField] === filterValue);
                  const back = document.createElement("button");
                  back.className = "mb-2 px-3.5 py-1.5 rounded-full glass-pill text-xs text-fuchsia-300 font-bold flex items-center gap-1.5";
                  back.innerHTML = `<i class="fa-solid fa-arrow-left"></i> Volver a ${currentTab === 'artists' ? 'Artistas' : 'Álbumes'}`;
                  back.onclick = () => renderLibrary();
                  frag.appendChild(back);
                }

                if(currentTab === "songs" || filterField) {
                  filtered.forEach(track => {
                    const idx = tracks.indexOf(track);
                    frag.appendChild(createSongRowElement(track, idx));
                  });
                } else if(currentTab === "favorites") {
                  const favTracks = filtered.filter(t => isTrackLiked(t.id));
                  if (favTracks.length === 0) {
                    container.innerHTML = `<div class="card-2027 rounded-3xl p-8 text-center text-xs text-purple-300/80"><i class="fa-regular fa-heart text-2xl text-pink-400 mb-2 block"></i>Aún no tienes canciones en Tus Me Gusta.<br>Toca el corazón ❤️ en cualquier canción para guardarla aquí.</div>`;
                    return;
                  }
                  favTracks.forEach(track => {
                    const idx = tracks.indexOf(track);
                    frag.appendChild(createSongRowElement(track, idx));
                  });
                } else if(currentTab === "playlists") {
                  if (activePlaylistViewId) {
                    const pl = userPlaylists.find(p => p.id === activePlaylistViewId);
                    if (!pl) { activePlaylistViewId = null; renderLibrary(); return; }
                    const topBar = document.createElement("div");
                    topBar.className = "flex items-center justify-between mb-3";
                    topBar.innerHTML = `
                      <button onclick="activePlaylistViewId=null; renderLibrary();" class="px-3.5 py-1.5 rounded-full glass-pill text-xs text-fuchsia-300 font-bold flex items-center gap-1.5">
                        <i class="fa-solid fa-arrow-left"></i> Playlists
                      </button>
                      <h3 class="text-sm font-extrabold text-white truncate">${pl.name}</h3>
                    `;
                    frag.appendChild(topBar);

                    const plTracks = pl.tracks.map(id => tracks.find(t => t.id === id)).filter(Boolean);
                    if (plTracks.length === 0) {
                      const empty = document.createElement("div");
                      empty.className = "card-2027 rounded-3xl p-6 text-center text-xs text-purple-300/80";
                      empty.innerHTML = "Esta playlist está vacía.<br>Mantén presionada cualquier canción en tu biblioteca para añadirla aquí.";
                      frag.appendChild(empty);
                    } else {
                      plTracks.forEach(track => {
                        const idx = tracks.indexOf(track);
                        const removeBtn = `<button onclick="removeTrackFromPlaylist('${pl.id}', '${track.id}', event)" class="w-8 h-8 rounded-full flex items-center justify-center text-red-400/80" title="Quitar"><i class="fa-solid fa-xmark text-xs"></i></button>`;
                        frag.appendChild(createSongRowElement(track, idx, removeBtn));
                      });
                    }
                    container.appendChild(frag);
                    return;
                  }

                  const headerBtn = document.createElement("button");
                  headerBtn.className = "w-full p-3.5 mb-2 rounded-2xl bg-gradient-to-r from-purple-700 to-fuchsia-600 border border-fuchsia-400/40 text-white text-xs font-bold flex items-center justify-center gap-2 shadow-md active:scale-98";
                  headerBtn.innerHTML = `<i class="fa-solid fa-plus"></i> Crear Nueva Playlist Personalizada`;
                  headerBtn.onclick = () => openCreatePlaylistModal(false);
                  frag.appendChild(headerBtn);

                  userPlaylists.forEach(pl => {
                    const firstTrack = pl.tracks.map(id => tracks.find(t => t.id === id)).find(Boolean);
                    const coverSrc = firstTrack ? firstTrack.thumb : "ic_launcher.png";
                    const card = document.createElement("div");
                    card.className = "card-2027 p-3 rounded-2xl flex items-center justify-between cursor-pointer active:scale-98";
                    card.onclick = () => { activePlaylistViewId = pl.id; renderLibrary(); };
                    card.innerHTML = `
                      <div class="flex items-center gap-3.5 min-w-0">
                        <img src="${coverSrc}" loading="lazy" decoding="async" onerror="this.onerror=null;this.src='ic_launcher.png';" class="w-[52px] h-[52px] cover-row object-cover shrink-0" />
                        <div class="min-w-0">
                          <h4 class="text-sm font-bold text-white truncate">${pl.name}</h4>
                          <p class="text-xs text-fuchsia-300/75">${pl.tracks.length} canciones</p>
                        </div>
                      </div>
                      <div class="flex items-center gap-2">
                        <button onclick="deletePlaylist('${pl.id}', event)" class="w-8 h-8 rounded-full flex items-center justify-center text-purple-400/60 hover:text-red-400">
                          <i class="fa-regular fa-trash-can text-xs"></i>
                        </button>
                        <i class="fa-solid fa-chevron-right text-purple-400 text-xs pr-1"></i>
                      </div>
                    `;
                    frag.appendChild(card);
                  });
                } else if(currentTab === "artists") {
                  [...new Set(filtered.map(t => t.artist))].forEach(artist => {
                    const artistTracks = tracks.filter(t => t.artist === artist);
                    const div = document.createElement("div");
                    div.className = "card-2027 p-3 rounded-2xl flex items-center justify-between cursor-pointer active:scale-98";
                    div.onclick = () => renderLibrary("artist", artist);
                    div.innerHTML = `<div class="flex items-center gap-3.5"><img src="${artistTracks[0]?.thumb}" loading="lazy" decoding="async" onerror="this.onerror=null;this.src='ic_launcher.png';" class="w-12 h-12 rounded-full object-cover border border-fuchsia-400/40" /><div><h4 class="text-sm font-bold text-white">${artist}</h4><p class="text-xs text-purple-300/70">${artistTracks.length} pistas</p></div></div><i class="fa-solid fa-chevron-right text-purple-400 text-xs pr-2"></i>`;
                    frag.appendChild(div);
                  });
                } else if(currentTab === "albums") {
                  const grid = document.createElement("div"); grid.className = "grid grid-cols-2 gap-3";
                  [...new Set(filtered.map(t => t.album))].forEach(album => {
                    const sample = tracks.find(t => t.album === album);
                    const card = document.createElement("div");
                    card.className = "card-2027 p-3 rounded-3xl cursor-pointer active:scale-98";
                    card.onclick = () => renderLibrary("album", album);
                    card.innerHTML = `<img src="${sample.thumb}" loading="lazy" decoding="async" onerror="this.onerror=null;this.src='ic_launcher.png';" class="w-full aspect-square cover-2027 object-cover mb-2.5" /><h4 class="text-xs font-bold text-white truncate px-1">${album}</h4><p class="text-[11px] text-purple-300/75 truncate px-1">${sample.artist}</p>`;
                    grid.appendChild(card);
                  });
                  frag.appendChild(grid);
                }

                container.appendChild(frag);
              }

              function openEditModal() {
                const t = tracks[currentTrackIndex]; if(!t) return;
                document.getElementById("editTitle").value = t.title;
                document.getElementById("editArtist").value = t.artist;
                document.getElementById("editAlbum").value = t.album;
                openModal("editModal");
              }

              function saveTrackEdits() {
                const t = tracks[currentTrackIndex]; if(!t) return;
                t.title = document.getElementById("editTitle").value;
                t.artist = document.getElementById("editArtist").value;
                t.album = document.getElementById("editAlbum").value;
                const coverFile = document.getElementById("editCoverFile").files[0];
                const save = () => {
                  customOverrides[t.id] = { title: t.title, artist: t.artist, album: t.album, cover: t.cover };
                  localStorage.setItem("cosmos_overrides_2027", JSON.stringify(customOverrides));
                  loadTrack(currentTrackIndex, isPlaying);
                  renderLibrary();
                  showToast("✨ Información actualizada");
                };
                if(coverFile) {
                  const reader = new FileReader();
                  reader.onload = e => { t.cover = e.target.result; t.thumb = e.target.result; save(); };
                  reader.readAsDataURL(coverFile);
                } else save();
                closeModal("editModal");
              }

              function openModal(id) {
                if (id === "playerModal") {
                  isPlayerModalOpen = true;
                  updateTimeUI(audioEl.currentTime, audioEl.duration || 0);
                }
                document.getElementById(id).classList.remove("hidden");
                document.getElementById(id).classList.add("flex");
              }

              function closeModal(id) {
                if (id === "playerModal") isPlayerModalOpen = false;
                document.getElementById(id).classList.add("hidden");
                document.getElementById(id).classList.remove("flex");
              }

              window.addEventListener("DOMContentLoaded", () => {
                const c = document.getElementById("chromaBars");
                for(let i=0; i<12; i++) {
                  const bar = document.createElement("div");
                  bar.id = `chroma-bar-${i}`;
                  bar.className = "bg-gradient-to-t from-purple-700 via-fuchsia-400 to-white h-full w-full rounded-t-sm chroma-bar-gpu";
                  bar.style.transform = "scaleY(0.12)";
                  c.appendChild(bar);
                  chromaBarEls.push(bar);
                }
                renderEqButtons();
                updateBentoCounters();
                rescanPhoneLibrary();

                const splash = document.getElementById("welcomeSplash");
                const bar = document.getElementById("splashBar");
                setTimeout(() => { if(bar) bar.style.width = "100%"; }, 80);
                setTimeout(() => {
                  if(splash) {
                    splash.style.opacity = "0";
                    setTimeout(() => splash.remove(), 500);
                  }
                }, 1600);
              });
            </script>
          </body>
          </html>
          EOF

          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK Generado
        uses: actions/upload-artifact@v4
        with:
          name: COSMOS-Belmont-Edition-APK
          path: app/build/outputs/apk/debug/app-debug.apk
