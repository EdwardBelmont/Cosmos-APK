                  <div><label class="text-purple-300/80 block mb-1">Cambiar Portada</label><input type="file" id="editCoverFile" accept="image/*" class="w-full text-[11px] text-purple-300 file:mr-2 file:py-1.5 file:px-2 file:border-0 file:bg-purple-700 file:text-white" /></div>
                </div>
                <div class="flex justify-end gap-2 pt-2">
                  <button onclick="closeModal('editModal')" class="px-4 py-2 bg-purple-950 text-purple-300 text-xs">Cancelar</button>
                  <button onclick="saveTrackEdits()" class="px-5 py-2 bg-gradient-to-r from-purple-600 to-fuchsia-600 text-white text-xs font-semibold">Guardar</button>
                </div>
              </div>
            </div>

            <!-- MODAL ECUALIZADOR DE 16 GENEROS + PREAMP -->
            <div id="eqModal" class="fixed inset-0 z-50 bg-black/85 hidden items-center justify-center p-4">
              <div class="glass-card w-full max-w-md p-5 space-y-4 border border-purple-500/40 max-h-[90vh] overflow-y-auto">
                <div class="flex justify-between items-center border-b border-purple-800/40 pb-2">
                  <h3 class="font-semibold text-sm text-purple-100">Ecualizador Master DSP (16 Géneros)</h3>
                  <button onclick="closeModal('eqModal')" class="text-purple-400"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div id="eqPresetContainer" class="grid grid-cols-4 gap-1.5"></div>
                <div class="space-y-3 pt-2 border-t border-purple-900/50">
                  <div class="flex items-center gap-3"><span class="text-xs text-fuchsia-300 w-16 font-mono font-bold">60 Hz</span><input type="range" id="eq-0" min="-12" max="12" value="5" oninput="updateEqBand(0, this.value)" class="flex-1" /><span id="eq-val-0" class="text-xs text-purple-200 w-10 text-right font-mono">+5dB</span></div>
                  <div class="flex items-center gap-3"><span class="text-xs text-purple-300 w-16 font-mono">230 Hz</span><input type="range" id="eq-1" min="-12" max="12" value="2" oninput="updateEqBand(1, this.value)" class="flex-1" /><span id="eq-val-1" class="text-xs text-purple-200 w-10 text-right font-mono">+2dB</span></div>
                  <div class="flex items-center gap-3"><span class="text-xs text-purple-300 w-16 font-mono">910 Hz</span><input type="range" id="eq-2" min="-12" max="12" value="0" oninput="updateEqBand(2, this.value)" class="flex-1" /><span id="eq-val-2" class="text-xs text-purple-200 w-10 text-right font-mono">0dB</span></div>
                  <div class="flex items-center gap-3"><span class="text-xs text-purple-300 w-16 font-mono">3.6 kHz</span><input type="range" id="eq-3" min="-12" max="12" value="4" oninput="updateEqBand(3, this.value)" class="flex-1" /><span id="eq-val-3" class="text-xs text-purple-200 w-10 text-right font-mono">+4dB</span></div>
                  <div class="flex items-center gap-3"><span class="text-xs text-fuchsia-300 w-16 font-mono font-bold">14 kHz</span><input type="range" id="eq-4" min="-12" max="12" value="6" oninput="updateEqBand(4, this.value)" class="flex-1" /><span id="eq-val-4" class="text-xs text-purple-200 w-10 text-right font-mono">+6dB</span></div>
                </div>
              </div>
            </div>

            <!-- MODAL TEMPORIZADOR -->
            <div id="timerModal" class="fixed inset-0 z-50 bg-black/85 hidden items-center justify-center p-4">
              <div class="glass-card w-full max-w-sm p-5 space-y-3 border border-purple-500/40 text-center">
                <div class="flex justify-between items-center border-b border-purple-800/40 pb-2">
                  <h3 class="font-semibold text-sm text-purple-100">Temporizador de Apagado</h3>
                  <button onclick="closeModal('timerModal')" class="text-purple-400"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="grid grid-cols-3 gap-2 pt-2">
                  <button onclick="setSleepTimer(10)" class="p-2.5 bg-purple-950 border border-purple-800/40 text-xs font-medium">10 Min</button>
                  <button onclick="setSleepTimer(20)" class="p-2.5 bg-purple-950 border border-purple-800/40 text-xs font-medium">20 Min</button>
                  <button onclick="setSleepTimer(45)" class="p-2.5 bg-purple-950 border border-purple-800/40 text-xs font-medium">45 Min</button>
                </div>
                <button onclick="setSleepTimer(0)" class="w-full p-2.5 bg-red-950/50 border border-red-800/40 text-xs text-red-300 font-medium mt-2">Desactivar</button>
              </div>
            </div>

            <audio id="audioElement" preload="auto" crossorigin="anonymous"></audio>

            <script>
              window.defaultLogoDataUri = "data:image/svg+xml;utf8," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300"><rect width="300" height="300" fill="#06020d"/><circle cx="150" cy="150" r="110" fill="none" stroke="#a855f7" stroke-width="3" opacity="0.5"/><path d="M80 138 A72 72 0 0 1 220 138" fill="none" stroke="#f0abfc" stroke-width="6" stroke-linecap="round"/><polygon points="150,55 88,168 122,168 150,108" fill="#f5d0fe"/><polygon points="150,55 212,168 178,168 150,108" fill="#a855f7"/><polygon points="124,162 150,235 176,162 150,184" fill="#c084fc"/><polygon points="150,122 162,146 150,170 138,146" fill="#ffffff"/></svg>`);

              const headerLogo = document.getElementById("headerLogoImg");
              headerLogo.onerror = function() { this.src = window.defaultLogoDataUri; };

              let tracks = [], customOverrides = JSON.parse(localStorage.getItem("cosmos_overrides_v12")) || {};
              let currentTab = "songs", currentTrackIndex = -1, isPlaying = false, shuffleMode = false, repeatMode = 0;
              let activePresetName = "Space Rock", sleepTimerId = null;

              const eqPresets = {
                "Space Rock": [5, 2, 0, 4, 6],
                "Gothic Rock": [6, 4, -1, 3, 5],
                "Love Metal": [6, 3, -1, 5, 6],
                "Symphonic": [5, 2, 1, 5, 7],
                "Metal": [7, 3, -3, 5, 7],
                "Rock": [5, 3, -1, 4, 5],
                "Pop": [2, 3, 4, 3, 3],
                "Acoustic": [3, 2, 1, 4, 5],
                "Bass Boost": [9, 6, 0, 1, 2],
                "Vocal": [-2, 1, 6, 5, 2],
                "Synthwave": [7, 4, -1, 3, 6],
                "Salsa": [4, 3, 3, 4, 5],
                "Cumbia": [7, 5, 1, 3, 4],
                "Jazz": [4, 2, -1, 3, 4],
                "Classical": [3, 1, 0, 3, 5],
                "Plano": [0, 0, 0, 0, 0]
              };

              function renderEqButtons() {
                const container = document.getElementById("eqPresetContainer");
                container.innerHTML = "";
                Object.keys(eqPresets).forEach(name => {
                  const btn = document.createElement("button");
                  const isAct = name === activePresetName;
                  btn.className = isAct
                    ? "px-2 py-1.5 text-[10px] font-bold bg-gradient-to-r from-purple-600 to-fuchsia-600 text-white border border-fuchsia-300 truncate"
                    : "px-2 py-1.5 text-[10px] bg-purple-950/80 border border-purple-800/50 text-purple-300 truncate";
                  btn.textContent = name;
                  btn.onclick = () => applyEqPreset(name);
                  container.appendChild(btn);
                });
              }

              window.onNativeLibraryLoaded = function(jsonArray) {
                try {
                  const list = typeof jsonArray === "string" ? JSON.parse(jsonArray) : jsonArray;
                  tracks = list.map(item => {
                    const saved = customOverrides[item.id] || {};
                    return {
                      id: item.id,
                      title: saved.title || item.title,
                      artist: saved.artist || item.artist,
                      album: saved.album || item.album,
                      albumId: item.albumId !== undefined ? item.albumId : -1,
                      durationMs: item.durationMs || 0,
                      cover: saved.cover || item.cover || "ic_launcher.png",
                      audioUrl: item.audioUrl
                    };
                  });
                  renderLibrary();
                  if (tracks.length > 0 && currentTrackIndex === -1) loadTrack(0, false);
                } catch(e) {}
              };

              function rescanPhoneLibrary() { if(window.CosmosNative) window.CosmosNative.rescanMediaStore(); }

              function notifyNativeAndroidService() {
                if(window.CosmosNative && currentTrackIndex >= 0 && tracks[currentTrackIndex]) {
                  const t = tracks[currentTrackIndex];
                  const durMs = Math.round((audioEl.duration || (t.durationMs / 1000) || 0) * 1000);
                  const posMs = Math.round((audioEl.currentTime || 0) * 1000);
                  window.CosmosNative.updateNotification(t.title, t.artist, t.album, t.albumId || -1, durMs, posMs, isPlaying);
                }
              }

              // =========================================================================
              // MOTOR DE AUDIO SIN LAG (PLAYBACK BUFFER) + DSP ACORDES + AUTO-BPM
              // =========================================================================
              let audioCtx = null, analyser = null, mediaSource = null, isSourceConnected = false, eqFilters = [];
              let chordDetectionMode = "triad";
              const NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
              let smoothedRoot = new Float32Array(12), smoothedChroma = new Float32Array(12);
              let fftDbBuffer = null, chromaBarEls = [];
              let lockedPitch = -1, lockedQuality = "", prevChordName = "--", lockTime = 0, challenger = -1, challengerCount = 0;
              const HOLD_MS = 1350;
              const audioEl = document.getElementById("audioElement");

              // Variables del Metrónomo y Detector Automático de Tempo (BPM)
              let detectedBpm = 120, prevLowEnergy = 0, lastPeakTime = 0;
              let onsetIntervals = [], tapTimes = [];
              let metronomeSoundEnabled = false, currentBeatIndex = 0, nextBeatTime = 0;

              function initAudioEngine() {
                if (!audioCtx) {
                  try {
                    const AC = window.AudioContext || window.webkitAudioContext;
                    audioCtx = new AC({ latencyHint: "playback", sampleRate: 48000 });
                    analyser = audioCtx.createAnalyser();
                    analyser.fftSize = 4096;
                    analyser.smoothingTimeConstant = 0.80;
                    fftDbBuffer = new Float32Array(analyser.frequencyBinCount);
                  } catch (e) {}
                }
                if (audioCtx && audioCtx.state === "suspended") {
                  audioCtx.resume();
                }
                if (!isSourceConnected && audioEl && audioCtx) {
                  try {
                    mediaSource = audioCtx.createMediaElementSource(audioEl);
                    const freqs = [60, 230, 910, 3600, 14000];
                    const initialGains = eqPresets[activePresetName] || [0,0,0,0,0];
                    eqFilters = freqs.map((f, i) => {
                      const filter = audioCtx.createBiquadFilter();
                      filter.type = "peaking";
                      filter.frequency.value = f;
                      filter.gain.value = initialGains[i];
                      filter.Q.value = 1.0;
                      return filter;
                    });
                    let curr = mediaSource;
                    eqFilters.forEach(f => { curr.connect(f); curr = f; });
                    curr.connect(analyser);
                    analyser.connect(audioCtx.destination);
                    isSourceConnected = true;
                  } catch (e) {
                    isSourceConnected = true;
                  }
                }
              }

              // Bucle DSP desacoplado a 20Hz (cada 50ms) para CERO lag en el audio
              setInterval(() => {
                if (!isPlaying || !analyser || !audioCtx || !fftDbBuffer) return;

                analyser.getFloatFrequencyData(fftDbBuffer);
                const binW = audioCtx.sampleRate / analyser.fftSize;
                const instRoot = new Float32Array(12);
                const instChroma = new Float32Array(12);

                // 1. Detección de Transientes Rítmicos (65Hz - 180Hz) para BPM Automático
                let lowRhythmEnergy = 0;
                const minBin = Math.max(2, Math.floor(60 / binW));
                const maxBin = Math.min(fftDbBuffer.length - 4, Math.ceil(780 / binW));

                for (let b = minBin; b < maxBin; b++) {
                  const db = fftDbBuffer[b];
                  if (db > -75) {
                    const mag = Math.pow(10, db / 20);
                    const freq = b * binW;
                    if (freq >= 65 && freq <= 175) {
                      lowRhythmEnergy += mag;
                    }
                    if (db >= fftDbBuffer[b - 1] && db >= fftDbBuffer[b + 1]) {
                      const p = ((Math.round(12 * Math.log2(freq / 440) + 69) % 12) + 12) % 12;
                      instChroma[p] += mag;
                      // Foco quirúrgico en fundamentales de guitarra (E2 82Hz a G4 392Hz)
                      if (freq >= 78 && freq <= 400) {
                        instRoot[p] += mag * (freq < 220 ? 1.75 : 1.25);
                      }
                    }
                  }
                }

                const now = performance.now();
                // Detector de picos de percusión/rasgueo para calcular el Tempo (BPM)
                if (lowRhythmEnergy > prevLowEnergy * 1.38 && lowRhythmEnergy > 0.012 && (now - lastPeakTime) > 260) {
                  const interval = now - lastPeakTime;
                  lastPeakTime = now;
                  if (interval >= 320 && interval <= 1050) {
                    let candidateBpm = 60000 / interval;
                    while (candidateBpm < 75) candidateBpm *= 2;
                    while (candidateBpm > 165) candidateBpm /= 2;
                    onsetIntervals.push(candidateBpm);
                    if (onsetIntervals.length > 12) onsetIntervals.shift();
                    if (onsetIntervals.length >= 4) {
                      const sorted = [...onsetIntervals].sort((a, b) => a - b);
                      const median = sorted[Math.floor(sorted.length / 2)];
                      detectedBpm = Math.round(detectedBpm * 0.85 + median * 0.15);
                      updateBpmUI();
                    }
                  }
                }
                prevLowEnergy = lowRhythmEnergy * 0.75 + prevLowEnergy * 0.25;

                // 2. Procesamiento Armónico de Acordes de Guitarra
                let sig = 0;
                for (let i = 0; i < 12; i++) {
                  smoothedRoot[i] = smoothedRoot[i] * 0.80 + instRoot[i] * 0.20;
                  smoothedChroma[i] = smoothedChroma[i] * 0.78 + instChroma[i] * 0.22;
                  sig += smoothedRoot[i];
                }

                let maxR = 0.00001;
                for (let i = 0; i < 12; i++) if (smoothedRoot[i] > maxR) maxR = smoothedRoot[i];

                for (let i = 0; i < 12; i++) {
                  const bar = chromaBarEls[i];
                  if (bar) {
                    const scale = Math.max(0.12, smoothedRoot[i] / maxR);
                    bar.style.transform = `scaleY(${scale.toFixed(2)})`;
                    bar.style.opacity = i === lockedPitch ? "1" : "0.42";
                  }
                }

                if (sig > 0.0012) {
                  let bestIdx = 0;
                  for (let i = 1; i < 12; i++) if (smoothedRoot[i] > smoothedRoot[bestIdx]) bestIdx = i;

                  const elapsed = now - lockTime;
                  const barElem = document.getElementById("measureLockBar");
                  if (barElem) barElem.style.width = `${Math.min(100, Math.round((elapsed / HOLD_MS) * 100))}%`;

                  if (lockedPitch === -1) {
                    lockChord(bestIdx, now);
                  } else if (bestIdx !== lockedPitch) {
                    if (smoothedRoot[bestIdx] > smoothedRoot[lockedPitch] * (elapsed < HOLD_MS ? 1.35 : 1.14)) {
                      if (challenger === bestIdx) challengerCount++; else { challenger = bestIdx; challengerCount = 1; }
                      if (challengerCount >= 5) lockChord(bestIdx, now);
                    } else {
                      challengerCount = Math.max(0, challengerCount - 1);
                    }
                  } else {
                    challengerCount = 0;
                  }
                }
              }, 50);

              // Reloj del Metrónomo de Alta Precisión
              setInterval(() => {
                if (!isPlaying) return;
                const now = performance.now();
                const beatIntervalMs = 60000 / Math.max(40, Math.min(220, detectedBpm));
                if (now >= nextBeatTime) {
                  nextBeatTime = now + beatIntervalMs;
                  currentBeatIndex = (currentBeatIndex + 1) % 4;
                  for (let i = 0; i < 4; i++) {
                    const led = document.getElementById(`beat-${i}`);
                    if (led) {
                      if (i === currentBeatIndex) {
                        led.className = i === 0
                          ? "w-3 h-3 bg-white border border-fuchsia-300 shadow-[0_0_10px_#fff] scale-125 transition-transform"
                          : "w-3 h-3 bg-fuchsia-400 border border-fuchsia-200 shadow-[0_0_8px_#e879f9] scale-110 transition-transform";
                      } else {
                        led.className = "w-3 h-3 bg-purple-950 border border-purple-600/40 transition-transform";
                      }
                    }
                  }
                  if (metronomeSoundEnabled && audioCtx) {
                    playMetronomeClick(currentBeatIndex === 0);
                  }
                }
              }, 20);

              function playMetronomeClick(isAccent) {
                try {
                  const osc = audioCtx.createOscillator();
                  const gain = audioCtx.createGain();
                  osc.type = "triangle";
                  osc.frequency.setValueAtTime(isAccent ? 1200 : 850, audioCtx.currentTime);
                  gain.gain.setValueAtTime(0.22, audioCtx.currentTime);
                  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.045);
                  osc.connect(gain);
                  gain.connect(audioCtx.destination);
                  osc.start(audioCtx.currentTime);
                  osc.stop(audioCtx.currentTime + 0.05);
                } catch (e) {}
              }

              function toggleMetronomeSound() {
                initAudioEngine();
                metronomeSoundEnabled = !metronomeSoundEnabled;
                const btn = document.getElementById("metroSoundBtn");
                const icon = document.getElementById("metroIcon");
                if (metronomeSoundEnabled) {
                  btn.className = "px-2.5 h-7 bg-fuchsia-600 border border-fuchsia-300 text-[10px] text-white font-bold flex items-center gap-1 shadow-[0_0_10px_rgba(217,70,239,0.5)]";
                  icon.className = "fa-solid fa-volume-high";
                } else {
                  btn.className = "px-2.5 h-7 bg-purple-950 border border-purple-600/50 text-[10px] text-purple-200 font-semibold flex items-center gap-1";
                  icon.className = "fa-solid fa-volume-xmark";
                }
              }

              function adjustBpm(delta) {
                detectedBpm = Math.max(40, Math.min(220, detectedBpm + delta));
                updateBpmUI();
              }

              function tapTempo() {
                const now = performance.now();
                tapTimes.push(now);
                if (tapTimes.length > 5) tapTimes.shift();
                if (tapTimes.length >= 2) {
                  let sum = 0;
                  for (let i = 1; i < tapTimes.length; i++) sum += (tapTimes[i] - tapTimes[i - 1]);
                  const avg = sum / (tapTimes.length - 1);
                  if (avg > 250 && avg < 1500) {
                    detectedBpm = Math.round(60000 / avg);
                    updateBpmUI();
                  }
                }
              }

              function updateBpmUI() {
                document.getElementById("bpmValueDisplay").textContent = detectedBpm;
                document.getElementById("miniBpmBadge").textContent = `${detectedBpm} BPM`;
              }

              function lockChord(pitch, now) {
                if(lockedPitch !== -1) prevChordName = formatChord(lockedPitch, lockedQuality);
                lockedPitch = pitch; lockTime = now; challengerCount = 0;
                const min3 = smoothedChroma[(pitch + 3) % 12];
                const maj3 = smoothedChroma[(pitch + 4) % 12];
                lockedQuality = min3 > maj3 * 1.12 ? "m" : "";
                renderChordUI();
              }

              function formatChord(p, q) {
                if(p < 0) return "--";
                return chordDetectionMode === "power" ? NOTE_NAMES[p] + "5" : NOTE_NAMES[p] + q;
              }

              function renderChordUI() {
                const cur = formatChord(lockedPitch, lockedQuality);
                document.getElementById("miniChordBadge").textContent = cur;
                document.getElementById("currentChordBox").textContent = cur;
                document.getElementById("prevChordBox").textContent = prevChordName;
                document.getElementById("nextChordBox").textContent = `${NOTE_NAMES[lockedPitch]}5 (${NOTE_NAMES[(lockedPitch + 7) % 12]})`;
              }

              function toggleChordMode() {
                chordDetectionMode = chordDetectionMode === "power" ? "triad" : "power";
                document.getElementById("chordModeBtn").textContent = chordDetectionMode === "power" ? "Power / 5ta" : "Tríadas (m/Maj)";
                if(lockedPitch !== -1) renderChordUI();
              }

              function applyEqPreset(name) {
                const gains = eqPresets[name];
                if (!gains) return;
                activePresetName = name;
                document.getElementById("fullGenreBadge").textContent = `EQ: ${name}`;
                gains.forEach((val, idx) => {
                  const slider = document.getElementById(`eq-${idx}`);
                  if (slider) slider.value = val;
                  updateEqBand(idx, val);
                });
                renderEqButtons();
              }

              function updateEqBand(index, val) {
                initAudioEngine();
                if (eqFilters && eqFilters[index]) {
                  eqFilters[index].gain.value = parseFloat(val);
                }
                const valLabel = document.getElementById(`eq-val-${index}`);
                if (valLabel) valLabel.textContent = (val > 0 ? "+" : "") + val + "dB";
              }

              function setImageWithFallback(imgEl, srcUrl) {
                imgEl.onerror = function() {
                  this.onerror = function() { this.src = window.defaultLogoDataUri; };
                  this.src = "ic_launcher.png";
                };
                imgEl.src = srcUrl || "ic_launcher.png";
              }

              function loadTrack(idx, autoPlay=false) {
                if(idx < 0 || idx >= tracks.length) return;
                currentTrackIndex = idx; const t = tracks[idx];
                lockedPitch = -1; prevChordName = "--"; onsetIntervals = [];
                setImageWithFallback(document.getElementById("miniCover"), t.cover);
                setImageWithFallback(document.getElementById("fullCover"), t.cover);
                document.getElementById("miniTitle").textContent = t.title;
                document.getElementById("miniArtist").textContent = t.artist;
                document.getElementById("fullTitle").textContent = t.title;
                document.getElementById("fullArtist").textContent = t.artist;
                document.getElementById("fullAlbumName").textContent = t.album;
                audioEl.src = t.audioUrl;
                audioEl.load();
                renderLibrary();
                notifyNativeAndroidService();
                if(autoPlay) playAudio();
              }

              function togglePlay() {
                if(!tracks.length) { rescanPhoneLibrary(); return; }
                initAudioEngine();
                isPlaying ? pauseAudio() : playAudio();
              }

              function playAudio() {
                initAudioEngine();
                isPlaying = true;
                nextBeatTime = performance.now();
                updatePlayButtons(true);
                audioEl.play().catch(()=>{});
                notifyNativeAndroidService();
              }

              function pauseAudio() {
                isPlaying = false;
                updatePlayButtons(false);
                audioEl.pause();
                notifyNativeAndroidService();
              }

              function updatePlayButtons(p) {
                const icon = p ? '<i class="fa-solid fa-pause"></i>' : '<i class="fa-solid fa-play"></i>';
                document.getElementById("miniPlayBtn").innerHTML = icon;
                document.getElementById("fullPlayBtn").innerHTML = icon;
              }

              function prevTrack() { if(tracks.length) loadTrack((currentTrackIndex - 1 + tracks.length) % tracks.length, true); }
              function nextTrack() {
                if(!tracks.length) return;
                if(repeatMode === 2) { audioEl.currentTime = 0; playAudio(); return; }
                const nextIdx = shuffleMode ? Math.floor(Math.random() * tracks.length) : (currentTrackIndex + 1) % tracks.length;
                loadTrack(nextIdx, true);
              }

              function toggleShuffle() {
                shuffleMode = !shuffleMode;
                document.getElementById("shuffleBtn").className = shuffleMode
                  ? "w-10 h-10 flex items-center justify-center text-fuchsia-400"
                  : "w-10 h-10 flex items-center justify-center text-purple-400/50";
              }

              function cycleRepeat() {
                repeatMode = (repeatMode + 1) % 3;
                const btn = document.getElementById("repeatBtn");
                const badge = document.getElementById("repeatOneBadge");
                btn.className = repeatMode > 0
                  ? "w-10 h-10 flex items-center justify-center text-fuchsia-400 relative"
                  : "w-10 h-10 flex items-center justify-center text-purple-400/50 relative";
                badge.classList.toggle("hidden", repeatMode !== 2);
              }

              audioEl.addEventListener("Play", () => initAudioEngine());
              audioEl.addEventListener("timeupdate", () => updateTimeUI(audioEl.currentTime, audioEl.duration || 0));
              audioEl.addEventListener("loadedmetadata", () => notifyNativeAndroidService());
              audioEl.addEventListener("ended", nextTrack);

              function seekAudio(val) {
                if(audioEl.duration) {
                  audioEl.currentTime = (val / 100) * audioEl.duration;
                  notifyNativeAndroidService();
                }
              }

              window.seekToMs = function(ms) {
                audioEl.currentTime = ms / 1000;
                notifyNativeAndroidService();
              };

              function updateTimeUI(cur, tot) {
                const fmt = s => `${Math.floor(s/60)}:${Math.floor(s%60)<10?'0':''}${Math.floor(s%60)}`;
                document.getElementById("miniSeek").value = tot ? (cur/tot)*100 : 0;
                document.getElementById("fullSeek").value = tot ? (cur/tot)*100 : 0;
                document.getElementById("miniCurrentTime").textContent = fmt(cur);
                document.getElementById("fullCurrentTime").textContent = fmt(cur);
                document.getElementById("miniDuration").textContent = fmt(tot);
                document.getElementById("fullDuration").textContent = fmt(tot);
              }

              function setSleepTimer(mins) {
                if (sleepTimerId) { clearTimeout(sleepTimerId); sleepTimerId = null; }
                const label = document.getElementById("timerText");
                if (mins > 0) {
                  label.textContent = `${mins}m`;
                  sleepTimerId = setTimeout(() => { pauseAudio(); label.textContent = "Off"; }, mins * 60000);
                } else {
                  label.textContent = "Off";
                }
                closeModal("timerModal");
              }

              function switchTab(tab) {
                currentTab = tab;
                ["songs", "artists", "albums", "playlists"].forEach(t => {
                  const btn = document.getElementById(`tab-${t}`);
                  btn.className = t === tab
                    ? "px-4 py-1.5 text-xs font-semibold bg-gradient-to-r from-purple-700 to-fuchsia-600 text-white border border-fuchsia-400/40 whitespace-nowrap"
                    : "px-4 py-1.5 text-xs font-medium bg-purple-950/60 text-purple-300/80 border border-purple-800/40 whitespace-nowrap";
                });
                renderLibrary();
              }

              function renderLibrary(filterField = null, filterValue = null) {
                const container = document.getElementById("libraryContainer");
                const query = document.getElementById("searchInput").value.toLowerCase();
                document.getElementById("countSongs").textContent = tracks.length;
                container.innerHTML = "";

                if(tracks.length === 0) {
                  container.innerHTML = `<div class="glass-card p-8 text-center my-6 border border-purple-700/30"><h3 class="text-sm font-semibold text-white mb-1">Escaneando Memoria...</h3><button onclick="rescanPhoneLibrary()" class="mt-3 px-5 py-2.5 bg-purple-700 text-white text-xs font-bold">Escanear Dispositivo</button></div>`;
                  return;
                }

                let filtered = tracks.filter(t => t.title.toLowerCase().includes(query) || t.artist.toLowerCase().includes(query));
                if(filterField && filterValue) {
                  filtered = filtered.filter(t => t[filterField] === filterValue);
                  const back = document.createElement("button");
                  back.className = "mb-2 text-xs text-fuchsia-300 font-semibold flex items-center gap-1";
                  back.innerHTML = `<i class="fa-solid fa-arrow-left"></i> Volver`;
                  back.onclick = () => renderLibrary();
                  container.appendChild(back);
                }

                if(currentTab === "songs" || filterField) {
                  filtered.forEach(track => {
                    const idx = tracks.indexOf(track);
                    const isCur = idx === currentTrackIndex;
                    const div = document.createElement("div");
                    div.className = `p-2.5 flex items-center justify-between gap-3 cursor-pointer transition ${isCur ? "bg-purple-900/65 border border-fuchsia-400/70 shadow-[0_0_15px_rgba(217,70,239,0.25)]" : "glass-card hover:bg-purple-900/20"}`;
                    div.innerHTML = `<div class="flex items-center gap-3 min-w-0 flex-1" onclick="loadTrack(${idx}, true)"><img src="${track.cover}" onerror="this.onerror=null;this.src='ic_launcher.png';" class="w-12 h-12 sharp-cover object-cover shrink-0" /><div class="min-w-0 flex-1"><h4 class="text-sm font-semibold ${isCur?"text-fuchsia-300":"text-white"} truncate">${track.title}</h4><p class="text-xs text-purple-300/70 truncate">${track.artist} • ${track.album}</p></div></div><button onclick="currentTrackIndex=${idx};openEditModal();" class="p-2 text-purple-300/70 hover:text-white"><i class="fa-solid fa-pen text-xs"></i></button>`;
                    container.appendChild(div);
                  });
                } else if(currentTab === "artists") {
                  [...new Set(filtered.map(t => t.artist))].forEach(artist => {
                    const artistTracks = tracks.filter(t => t.artist === artist);
                    const div = document.createElement("div");
                    div.className = `glass-card p-3 flex items-center justify-between cursor-pointer`;
                    div.onclick = () => renderLibrary("artist", artist);
                    div.innerHTML = `<div class="flex items-center gap-3"><img src="${artistTracks[0]?.cover}" onerror="this.onerror=null;this.src='ic_launcher.png';" class="w-12 h-12 sharp-cover object-cover" /><div><h4 class="text-sm font-semibold text-white">${artist}</h4><p class="text-xs text-purple-300/65">${artistTracks.length} pistas</p></div></div><i class="fa-solid fa-chevron-right text-purple-400 text-xs"></i>`;
                    container.appendChild(div);
                  });
                } else if(currentTab === "albums") {
                  const grid = document.createElement("div"); grid.className = "grid grid-cols-2 gap-3";
                  [...new Set(filtered.map(t => t.album))].forEach(album => {
                    const sample = tracks.find(t => t.album === album);
                    const card = document.createElement("div");
                    card.className = "glass-card p-3 cursor-pointer";
                    card.onclick = () => renderLibrary("album", album);
                    card.innerHTML = `<img src="${sample.cover}" onerror="this.onerror=null;this.src='ic_launcher.png';" class="w-full aspect-square sharp-cover object-cover mb-2" /><h4 class="text-xs font-semibold text-white truncate">${album}</h4><p class="text-[11px] text-purple-300/70 truncate">${sample.artist}</p>`;
                    grid.appendChild(card);
                  });
                  container.appendChild(grid);
                } else if(currentTab === "playlists") {
                  container.innerHTML = `<div class="glass-card p-6 text-center text-xs text-purple-300">Todas tus pistas activas (${tracks.length} canciones listas)</div>`;
                }
              }

              function openEditModal() {
                const t = tracks[currentTrackIndex]; if(!t) return;
                document.getElementById("editTitle").value = t.title;
                document.getElementById("editArtist").value = t.artist;
                document.getElementById("editAlbum").value = t.album;
                openModal("editModal");
              }

              function saveTrackEdits() {
                const t = tracks[currentTrackIndex]; if(!t) return;
                t.title = document.getElementById("editTitle").value;
                t.artist = document.getElementById("editArtist").value;
                t.album = document.getElementById("editAlbum").value;
                const coverFile = document.getElementById("editCoverFile").files[0];
                const save = () => {
                  customOverrides[t.id] = { title: t.title, artist: t.artist, album: t.album, cover: t.cover };
                  localStorage.setItem("cosmos_overrides_v12", JSON.stringify(customOverrides));
                  loadTrack(currentTrackIndex, isPlaying);
                };
                if(coverFile) {
                  const reader = new FileReader();
                  reader.onload = e => { t.cover = e.target.result; save(); };
                  reader.readAsDataURL(coverFile);
                } else save();
                closeModal("editModal");
              }

              function openModal(id) { document.getElementById(id).classList.remove("hidden"); document.getElementById(id).classList.add("flex"); }
              function closeModal(id) { document.getElementById(id).classList.add("hidden"); document.getElementById(id).classList.remove("flex"); }

              window.addEventListener("DOMContentLoaded", () => {
                const c = document.getElementById("chromaBars");
                for(let i=0; i<12; i++) {
                  const bar = document.createElement("div");
                  bar.id = `chroma-bar-${i}`;
                  bar.className = "bg-gradient-to-t from-purple-700 via-fuchsia-400 to-white h-full w-full chroma-bar-gpu";
                  bar.style.transform = "scaleY(0.12)";
                  c.appendChild(bar);
                  chromaBarEls.push(bar);
                }
                renderEqButtons();
                rescanPhoneLibrary();

                // Animación del Splash Screen al iniciar
                const splash = document.getElementById("welcomeSplash");
                const bar = document.getElementById("splashBar");
                setTimeout(() => { if(bar) bar.style.width = "100%"; }, 100);
                setTimeout(() => {
                  if(splash) {
                    splash.style.opacity = "0";
                    setTimeout(() => splash.remove(), 700);
                  }
                }, 2200);
              });
            </script>
          </body>
          </html>
          EOF

          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK Generado
        uses: actions/upload-artifact@v4
        with:
          name: COSMOS-Belmont-Edition-APK
          path: app/build/outputs/apk/debug/app-debug.apk
